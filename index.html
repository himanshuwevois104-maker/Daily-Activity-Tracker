<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WeVois &middot; Daily Activity Tracker</title>
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.json">
<style>
/* ================= Design tokens ================= */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-strong:#256abf; --accent-soft:#e5effb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --ord1:#86b6ef; --ord2:#5598e7; --ord3:#3987e5; --ord4:#256abf; --ord5:#1c5cab; --ord6:#104281;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
  --shadow-lg:0 8px 40px rgba(11,11,11,.16);
  --r:14px; --r-sm:10px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-strong:#5598e7; --accent-soft:#16283f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --ord1:#86b6ef; --ord2:#6da7ec; --ord3:#5598e7; --ord4:#3987e5; --ord5:#2a78d6; --ord6:#184f95;
  --good-text:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--page); color:var(--ink);
  font-size:14.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select,textarea{font:inherit; color:var(--ink)}
::placeholder{color:var(--muted)}
h1,h2,h3,h4{font-weight:650; letter-spacing:-.01em}
.hidden{display:none !important}

/* ================= Login ================= */
#login{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(1100px 500px at 85% -10%, color-mix(in srgb, var(--s1) 14%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--s3) 12%, transparent), transparent 60%),
    var(--page);}
.login-card{width:min(680px,100%); background:var(--surface); border:1px solid var(--border);
  border-radius:20px; box-shadow:var(--shadow-lg); padding:34px 36px}
.login-head{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.logo-mark{width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--s3));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px; flex:none}
.login-head h1{font-size:21px}
.login-sub{color:var(--ink2); margin:2px 0 20px}
.login-group{margin-top:16px}
.login-group .lvl{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px}
.login-users{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px}
.user-btn{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface); text-align:left; transition:.15s}
.user-btn:hover{border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px)}
.user-btn .nm{font-weight:600; font-size:13.5px; line-height:1.2}
.user-btn .tt{font-size:11.5px; color:var(--muted); line-height:1.25}
.demo-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2);
  background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:4px 12px; margin-top:20px}
.demo-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--warning)}

/* ================= App shell ================= */
#app{display:flex; min-height:100dvh}
#sidebar{width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100dvh; padding:18px 12px 12px; z-index:30}
.side-logo{display:flex; align-items:center; gap:10px; padding:0 8px 16px}
.side-logo .logo-mark{width:34px; height:34px; font-size:15px; border-radius:9px}
.side-logo .t1{font-weight:750; font-size:15px; line-height:1.1}
.side-logo .t2{font-size:11px; color:var(--muted)}
nav{display:flex; flex-direction:column; gap:2px}
.nav-btn{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px;
  color:var(--ink2); font-weight:550; font-size:14px; transition:.12s}
.nav-btn svg{width:19px; height:19px; flex:none}
.nav-btn:hover{background:var(--surface-2); color:var(--ink)}
.nav-btn.active{background:var(--accent-soft); color:var(--accent-strong)}
.nav-btn .cnt,.pipe-tab .cnt{font-size:10.5px; font-weight:750; background:var(--critical);
  color:#fff; border-radius:99px; min-width:18px; height:18px; padding:0 5px; display:inline-flex;
  align-items:center; justify-content:center}
.pipe-tab .cnt{margin-left:2px}
/* red says "this needs you"; accent says "this changed since you last looked" */
.nav-btn .badges{margin-left:auto; display:inline-flex; align-items:center; gap:5px; flex:none}
.nav-btn .cnt.new{background:var(--accent)}
.nav-btn.active .cnt.new{background:var(--accent-strong)}
.side-foot{margin-top:auto; border-top:1px solid var(--border); padding-top:10px}
.me-card{display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; width:100%; text-align:left}
.me-card:hover{background:var(--surface-2)}
.me-card .nm{font-weight:650; font-size:13.5px; line-height:1.15}
.me-card .rl{font-size:11.5px; color:var(--muted)}
.switch-hint{font-size:10.5px; color:var(--muted); padding:2px 8px 0}

#main{flex:1; min-width:0; display:flex; flex-direction:column}
#topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--page) 86%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:12px 26px; min-height:60px}
#viewTitle{font-size:18px}
#viewDate{font-size:12.5px; color:var(--muted); margin-top:1px}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:9px}
.icon-btn{width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--ink2)}
.icon-btn:hover{color:var(--ink); box-shadow:var(--shadow)}
.icon-btn svg{width:17px; height:17px}
#view{padding:24px 26px 90px; max-width:1500px; width:100%}

/* Level badges */
.lvl-badge{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; border-radius:6px; padding:2px 7px}
.lvl-ceo{background:color-mix(in srgb,var(--s7) 16%, var(--surface)); color:var(--s7)}
[data-theme="dark"] .lvl-ceo{color:#b3aaf3}
.lvl-vp{background:color-mix(in srgb,var(--s1) 15%, var(--surface)); color:var(--accent-strong)}
.lvl-manager{background:color-mix(in srgb,var(--s3) 16%, var(--surface)); color:#0d7a55}
[data-theme="dark"] .lvl-manager{color:#3fc796}
.lvl-member{background:var(--surface-2); color:var(--ink2)}

/* Avatars */
.av{border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:700; flex:none; color:var(--ink); border:1px solid var(--border)}
.av-sm{width:26px; height:26px; font-size:10px}
.av-md{width:34px; height:34px; font-size:12.5px}
.av-lg{width:48px; height:48px; font-size:17px}

/* ================= Cards / common ================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.card-head h3{font-size:15px}
.card-head .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
.card-head .spacer{margin-left:auto}
.btn{display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:10px; font-weight:600;
  font-size:13.5px; border:1px solid var(--border); background:var(--surface); color:var(--ink2); transition:.12s}
.btn:hover{color:var(--ink); box-shadow:var(--shadow)}
.btn.primary{background:var(--accent); border-color:transparent; color:#fff}
.btn.primary:hover{background:var(--accent-strong); color:#fff}
.btn.danger{color:var(--critical); border-color:color-mix(in srgb,var(--critical) 35%, transparent)}
.btn.sm{padding:5px 11px; font-size:12.5px; border-radius:8px}
.btn svg{width:15px; height:15px}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
  border-radius:7px; padding:2.5px 8px; background:var(--surface-2); color:var(--ink2)}
.chip .ic{font-size:11px}
.chip.p-urgent{background:color-mix(in srgb,var(--critical) 14%, var(--surface)); color:var(--critical)}
.chip.p-high{background:color-mix(in srgb,var(--serious) 16%, var(--surface)); color:#c05a32}
[data-theme="dark"] .chip.p-high{color:var(--serious)}
.chip.p-medium{background:color-mix(in srgb,var(--warning) 18%, var(--surface)); color:#8a6206}
[data-theme="dark"] .chip.p-medium{color:var(--warning)}
.chip.p-low{background:var(--surface-2); color:var(--muted)}
.chip.overdue{background:color-mix(in srgb,var(--critical) 13%, var(--surface)); color:var(--critical)}
.chip.today{background:color-mix(in srgb,var(--warning) 18%, var(--surface)); color:#8a6206}
[data-theme="dark"] .chip.today{color:var(--warning)}
.chip.done{background:color-mix(in srgb,var(--good) 14%, var(--surface)); color:var(--good-text)}

/* Grid helpers */
.grid{display:grid; gap:16px}
.g-kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-main-side{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media(max-width:1050px){.g-2,.g-main-side{grid-template-columns:1fr}}

/* Stat tiles */
.tile{padding:15px 17px}
.tile .lbl{font-size:12.5px; color:var(--ink2); font-weight:550}
.tile .val{font-size:27px; font-weight:680; letter-spacing:-.02em; margin-top:3px}
.tile .delta{font-size:12px; margin-top:2px; color:var(--muted)}
.tile .delta.up{color:var(--good-text)} .tile .delta.down{color:var(--critical)}

/* Chart bits */
.chart-wrap{position:relative}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2)}
.legend .key{display:inline-flex; align-items:center; gap:6px}
.legend .sw{width:10px; height:10px; border-radius:3px}
#tooltip{position:fixed; z-index:99; pointer-events:none; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); padding:8px 11px;
  font-size:12.5px; max-width:260px; opacity:0; transition:opacity .1s}
#tooltip .tt-t{font-weight:650; margin-bottom:3px}
#tooltip .tt-row{display:flex; align-items:center; gap:7px; color:var(--ink2)}
#tooltip .tt-row .sw{width:8px; height:8px; border-radius:2px; flex:none}
#tooltip .tt-row b{color:var(--ink); margin-left:auto; padding-left:12px}

/* Stage distribution stacked bar */
.stack{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-2)}
.stack .seg{height:100%; border-right:2px solid var(--surface)}
.stack .seg:last-child{border-right:none}
.o1{background:var(--ord1)}.o2{background:var(--ord2)}.o3{background:var(--ord3)}
.o4{background:var(--ord4)}.o5{background:var(--ord5)}.o6{background:var(--ord6)}

/* ================= Kanban ================= */
.pipe-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.pipe-tab{display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:99px;
  border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px; color:var(--ink2)}
.pipe-tab .pdot{width:9px; height:9px; border-radius:50%}
.pipe-tab.active{border-color:var(--accent); color:var(--ink); box-shadow:var(--shadow)}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.filters input[type=search],.filters select{padding:7px 11px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); font-size:13px; color:var(--ink)}
.filters input[type=search]{min-width:190px}
.board{display:flex; gap:14px; overflow-x:auto; padding-bottom:18px; align-items:flex-start}
.col{flex:0 0 262px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r);
  padding:10px; max-height:calc(100dvh - 305px); display:flex; flex-direction:column}
.col.drag-over{outline:2px dashed var(--accent); outline-offset:-2px; background:var(--accent-soft)}
.col-head{display:flex; align-items:center; gap:8px; padding:2px 6px 10px}
.col-head .cnm{font-weight:650; font-size:13px}
.col-head .cct{font-size:11.5px; font-weight:700; background:var(--surface); border:1px solid var(--border);
  border-radius:99px; padding:1px 8px; color:var(--ink2)}
.col-head .add{margin-left:auto; color:var(--muted); width:24px; height:24px; border-radius:7px;
  display:flex; align-items:center; justify-content:center}
.col-head .add:hover{background:var(--surface); color:var(--ink)}
.col-body{overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-height:40px; flex:1}
.tcard{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 12px;
  cursor:grab; box-shadow:var(--shadow); border-left:3px solid var(--pc,var(--baseline)); transition:.12s}
.tcard:hover{transform:translateY(-1px); box-shadow:var(--shadow-lg)}
.tcard.dragging{opacity:.45; cursor:grabbing}
.tcard .tt{font-weight:600; font-size:13.5px; line-height:1.3}
.tcard .meta{display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap}
.tcard .meta .av-sm{margin-left:auto}
.tcard.done-card .tt{text-decoration:line-through; color:var(--muted)}
.empty-col{font-size:12px; color:var(--muted); text-align:center; padding:14px 6px; border:1.5px dashed var(--grid); border-radius:10px}

/* ================= Daily log ================= */
.log-day{margin-bottom:20px}
.log-day .dhead{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.log-day .dhead .dt{font-weight:700; font-size:13.5px}
.log-day .dhead .dsub{font-size:12px; color:var(--muted)}
.log-entry{display:flex; gap:12px; padding:11px 4px; border-bottom:1px solid var(--grid)}
.log-entry:last-child{border-bottom:none}
.log-entry .cat-ic{width:32px; height:32px; border-radius:9px; background:var(--surface-2); flex:none;
  display:flex; align-items:center; justify-content:center; font-size:15px}
.log-entry .note{font-size:13.5px; margin-top:1px; color:var(--ink)}
.log-entry .lmeta{display:flex; gap:8px; align-items:center; font-size:11.5px; color:var(--muted)}
.log-entry .acts{margin-left:auto; display:flex; gap:4px; opacity:0; transition:.15s}
.log-entry:hover .acts{opacity:1}
.mini-btn{font-size:11.5px; color:var(--muted); padding:3px 8px; border-radius:7px}
.mini-btn:hover{background:var(--surface-2); color:var(--ink)}
.qa-form{display:grid; grid-template-columns:150px 170px 1fr auto; gap:9px; align-items:center}
.qa-form select,.qa-form input,.qa-form textarea{padding:8px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px}
@media(max-width:860px){.qa-form{grid-template-columns:1fr 1fr; }.qa-form .qa-note{grid-column:1/-1}}

/* task checklist rows (My Day) */
.trow{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--grid)}
.trow:last-child{border-bottom:none}
.trow .cb{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--baseline); flex:none;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; transition:.12s}
.trow .cb.on{background:var(--good); border-color:var(--good)}
.trow .t{font-size:13.5px; font-weight:550; cursor:pointer}
.trow.done .t{text-decoration:line-through; color:var(--muted)}
.trow .sub{font-size:11.5px; color:var(--muted)}
.trow .right{margin-left:auto; display:flex; gap:6px; align-items:center}

/* ================= Team / org chart ================= */
.org{overflow-x:auto; padding:10px 4px 26px}
.org ul{display:flex; justify-content:center; padding-top:24px; position:relative; list-style:none}
.org > ul{padding-top:0}
.org li{display:flex; flex-direction:column; align-items:center; position:relative; padding:24px 7px 0}
.org > ul > li{padding-top:0}
.org li::before,.org li::after{content:""; position:absolute; top:0; right:50%; width:50%; height:24px;
  border-top:1.5px solid var(--baseline)}
.org li::after{right:auto; left:50%; border-left:1.5px solid var(--baseline)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org > ul > li::before,.org > ul > li::after{display:none}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:1.5px solid var(--baseline)}
.org ul ul::before{content:""; position:absolute; top:0; left:50%; border-left:1.5px solid var(--baseline); width:0; height:24px}
.person{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:11px 14px;
  min-width:168px; box-shadow:var(--shadow); cursor:pointer; text-align:left; transition:.13s; position:relative; z-index:1}
.person:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--accent)}
.person .prow{display:flex; align-items:center; gap:9px}
.person .nm{font-weight:650; font-size:13.5px; line-height:1.15}
.person .tt{font-size:11.5px; color:var(--muted); line-height:1.25}
.person .pstats{display:flex; gap:6px; margin-top:8px}
.pstat{font-size:10.5px; font-weight:600; background:var(--surface-2); border-radius:6px; padding:2px 7px; color:var(--ink2)}

/* ================= Overlays / modals ================= */
.overlay{position:fixed; inset:0; z-index:80; background:rgba(11,11,11,.45); display:flex;
  align-items:flex-start; justify-content:center; padding:5vh 18px 18px; overflow-y:auto}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.6)}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg);
  width:min(560px,100%); padding:24px 26px; animation:pop .18s ease}
.modal.wide{width:min(780px,100%)}
@keyframes pop{from{transform:translateY(10px); opacity:0} to{transform:none; opacity:1}}
.modal h3{font-size:17px; margin-bottom:4px}
.modal .msub{font-size:13px; color:var(--muted); margin-bottom:16px}
.f-grid{display:grid; gap:13px}
.f-2{grid-template-columns:1fr 1fr} @media(max-width:640px){.f-2{grid-template-columns:1fr}}
.field label{display:block; font-size:12px; font-weight:650; color:var(--ink2); margin-bottom:5px}
.field input,.field select,.field textarea{width:100%; padding:9px 12px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); font-size:13.5px}
.field textarea{resize:vertical; min-height:74px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%, transparent); border-color:var(--accent)}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--surface-2);
  color:var(--ink2); border-color:var(--grid); cursor:default; opacity:1; resize:none}
input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; flex:none; cursor:pointer; margin:0}
.field input[type=checkbox]{width:16px; height:16px; padding:0; border-radius:4px}
.check-list{display:flex; flex-direction:column; gap:2px; margin-top:2px}
.check-list label{display:flex !important; align-items:center; gap:9px; font-size:13.5px; color:var(--ink);
  text-transform:none; font-weight:500; margin:0; padding:7px 9px; border-radius:9px; cursor:pointer}
.check-list label:hover{background:var(--surface-2)}
.m-actions{display:flex; gap:9px; margin-top:20px; align-items:center}
.m-actions .grow{flex:1}

/* ---- long forms ------------------------------------------------------
   A form with papers and sub-tables on it is too tall to scroll as one
   block: the person loses the title at the top and the Save button at the
   bottom. .modal.tall pins both and scrolls only the middle. */
.modal.tall{display:flex; flex-direction:column; max-height:88vh; padding:0}
.modal.tall > form{display:flex; flex-direction:column; flex:1; min-height:0}
.modal.tall .m-head{padding:19px 24px 13px; border-bottom:1px solid var(--grid); flex:none}
.modal.tall .m-head h3{margin-bottom:3px}
.modal.tall .m-head .msub{margin:0}
.modal.tall .m-body{padding:17px 24px 20px; overflow-y:auto; flex:1; min-height:0}
.modal.tall .m-actions{margin:0; padding:12px 24px; border-top:1px solid var(--grid);
  background:var(--surface); border-radius:0 0 18px 18px; flex:none}
.modal.tall .field textarea{min-height:54px}
@media(max-width:640px){.modal.tall{max-height:94vh}
  .modal.tall .m-head,.modal.tall .m-body,.modal.tall .m-actions{padding-left:16px; padding-right:16px}}

/* a titled group of fields, with a hairline running out to the edge */
.fsec{margin-bottom:19px}
.fsec:last-child{margin-bottom:0}
.fsec-h{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.fsec-h b{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:750; flex:none}
.fsec-h .fsec-n{font-size:11.5px; color:var(--muted); flex:none}
@media(max-width:660px){.fsec-h .fsec-n{display:none}}
.fsec-h:after{content:""; flex:1; height:1px; background:var(--grid)}
.fsec table.simple th{padding:5px 7px}
.fsec table.simple td{padding:5px 7px}
.fsec table.simple input,.fsec table.simple select{padding:6px 8px; font-size:12.5px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); width:100%; min-width:0}
.emd-wrap{overflow-x:auto}
.emd-wrap table.simple{min-width:780px}
.emd-wrap th{white-space:nowrap}
.emd-wrap td input[type=number]{text-align:right}
.emd-wrap td:last-child{text-align:center}

.f-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.f-3{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.f-3{grid-template-columns:1fr}}
.f-grid{align-items:start}
.span2{grid-column:span 2} .span3{grid-column:span 3}
@media(max-width:760px){.span3{grid-column:span 2}}
@media(max-width:520px){.span2,.span3{grid-column:span 1}}
.field .hint{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.35}

/* two file groups side by side, each its own tray */
.file-cols{display:grid; grid-template-columns:1fr 1fr; gap:13px}
@media(max-width:640px){.file-cols{grid-template-columns:1fr}}
.file-box{border:1px solid var(--border); border-radius:12px; padding:11px 12px}
.file-box .fb-h{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
  color:var(--ink2); margin-bottom:8px}
.file-box .fb-h span{margin-left:auto; font-weight:600; color:var(--muted); font-size:11.5px}
.file-box .log-entry{padding:6px 2px; gap:9px}
.file-box .file-ic{width:26px; height:26px; font-size:9px}
.drop-mini{border:1.4px dashed var(--border); border-radius:10px; padding:11px 8px; text-align:center;
  font-size:12.5px; color:var(--muted); cursor:pointer; transition:.15s; margin-bottom:7px}
.drop-mini:hover,.drop-mini.hot{border-color:var(--accent); background:var(--surface-2); color:var(--ink)}
.color-row{display:flex; gap:8px; flex-wrap:wrap}
.color-dot{width:28px; height:28px; border-radius:50%; border:2.5px solid transparent; cursor:pointer}
.color-dot.sel{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface) inset}
.stage-row{display:flex; gap:7px; align-items:center; margin-bottom:7px}
.stage-row input{flex:1; padding:7px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px}
.stage-row .mini-btn{border:1px solid var(--border); border-radius:8px}

/* Person drawer */
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(430px,94vw); z-index:85; background:var(--surface);
  border-left:1px solid var(--border); box-shadow:var(--shadow-lg); padding:24px; overflow-y:auto;
  transform:translateX(100%); transition:transform .22s ease}
.drawer.open{transform:none}
.drawer-scrim{position:fixed; inset:0; z-index:84; background:rgba(11,11,11,.3); opacity:0; pointer-events:none; transition:.2s}
.drawer-scrim.open{opacity:1; pointer-events:auto}

/* Feed */
.feed-item{display:flex; gap:11px; padding:9px 2px; border-bottom:1px solid var(--grid); font-size:13px}
.feed-item:last-child{border-bottom:none}
.feed-item .fic{width:28px; height:28px; border-radius:9px; flex:none; display:flex; align-items:center;
  justify-content:center; font-size:13px; background:var(--surface-2)}
.feed-item .ftxt{color:var(--ink2)} .feed-item .ftxt b{color:var(--ink); font-weight:620}
.feed-item .ftm{font-size:11px; color:var(--muted); margin-top:1px}

/* Tables */
table.simple{width:100%; border-collapse:collapse; font-size:13px}
table.simple th{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
  text-align:left; padding:7px 10px; border-bottom:1px solid var(--grid); font-weight:700}
table.simple td{padding:9px 10px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums}
table.simple tr:last-child td{border-bottom:none}
table.simple tr.click{cursor:pointer} table.simple tr.click:hover td{background:var(--surface-2)}

/* Toast */
#toasts{position:fixed; bottom:22px; right:22px; z-index:120; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--ink); color:var(--page); padding:10px 16px; border-radius:11px; font-size:13px;
  font-weight:550; box-shadow:var(--shadow-lg); animation:pop .2s ease; display:flex; gap:8px; align-items:center}

/* KPIs */
.kpi-row{padding:13px 0;border-bottom:1px solid var(--grid)}
.kpi-row:last-child{border-bottom:none}
.kpi-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13.5px}
.kpi-bar{position:relative;height:9px;border-radius:99px;background:var(--surface-2);margin:2px 0}
.kpi-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.kpi-bar i.good{background:var(--good)}
.kpi-bar i.ok{background:var(--accent)}
.kpi-bar i.behind{background:var(--warning)}
.kpi-bar .pace{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.45;border-radius:2px}
.kpi-edit{display:grid;grid-template-columns:120px 1fr auto;gap:8px;margin-top:9px}
.kpi-edit input{padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13px}
@media(max-width:640px){.kpi-edit{grid-template-columns:1fr}}

/* Working-pattern strip */
.act-strip{display:flex;align-items:flex-end;gap:3px;height:64px;padding:2px 0}
.act-strip i{flex:1;border-radius:2px 2px 0 0;min-width:3px;display:block}

/* Board header */
.board-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.board-head .grow{flex:1}
.board-pick{padding:9px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  font-size:13.5px;font-weight:650;color:var(--ink);min-width:230px}
.board-owner-filter{position:relative}
.board-owner-filter summary{list-style:none;cursor:pointer;white-space:nowrap}
.board-owner-filter summary::-webkit-details-marker{display:none}
.board-owner-menu{position:absolute;z-index:20;top:calc(100% + 7px);left:0;min-width:230px;max-height:280px;overflow:auto;
  padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow,0 8px 24px #0002)}
.board-owner-option{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;font-size:13px;cursor:pointer}
.board-owner-option:hover{background:var(--surface-2)}
.board-sub{font-size:12px;color:var(--muted);margin:-4px 0 12px 2px}
.btn .cnt{background:var(--accent);color:#fff;border-radius:99px;padding:0 6px;font-size:10.5px;
  font-weight:800;margin-left:4px}

/* Tasks & status list on a person */
.ptask{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--grid);cursor:pointer}
.ptask:last-child{border-bottom:none}
.ptask:hover{background:var(--surface-2)}
.ptask .t{font-size:13px;font-weight:600;color:var(--ink)}
.ptask .s{font-size:11.5px;color:var(--muted);margin-top:1px}

/* Right now + Needs attention */
.now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.now-cell{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;transition:.15s;width:100%}
.now-cell:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.now-cell .nm{font-size:13px;font-weight:650;color:var(--ink)}
.now-cell .st{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-top:1px}
.now-cell .st .dot{width:7px;height:7px;border-radius:50%;background:var(--baseline);flex:none}
.now-cell .st .dot.working{background:var(--good)}
.now-cell .st .dot.paused{background:var(--warning)}
.now-cell .st .dot.idle{background:var(--serious)}
.now-cell .tk{font-size:11.5px;color:var(--ink);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-cell .ex{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-row{display:flex;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--grid);cursor:pointer}
.att-row:last-child{border-bottom:none}
.att-row:hover{background:var(--surface-2)}
.att-row .ic{font-size:15px;width:20px;text-align:center;flex:none}
.att-row .t{font-size:13px;font-weight:600;color:var(--ink)}
.att-row .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.att-row .sev{width:4px;height:26px;border-radius:99px;margin-left:auto;flex:none;background:var(--baseline)}
.att-row .sev.s3{background:var(--critical)}
.att-row .sev.s2{background:var(--warning)}
.att-row .sev.s1{background:var(--serious)}
.stage-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
  padding:2.5px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink2)}
.stage-pill.Pause{background:color-mix(in srgb,var(--warning) 20%, var(--surface));color:#8a6206}
[data-theme="dark"] .stage-pill.Pause{color:var(--warning)}

/* Group chat */
.chat-wrap{display:grid; grid-template-columns:1fr 268px; gap:16px; align-items:start}
@media(max-width:900px){.chat-wrap{grid-template-columns:1fr}}
.chat-log{max-height:calc(100dvh - 340px); min-height:220px; overflow-y:auto; padding:4px 2px 8px;
  display:flex; flex-direction:column; gap:2px}
.chat-day{text-align:center; font-size:11px; color:var(--muted); font-weight:650; margin:14px 0 8px}
.msg{display:flex; gap:10px; padding:5px 2px}
.msg .who{font-size:12px; font-weight:700; color:var(--ink)}
.msg .at{font-size:11px; color:var(--muted); margin-left:6px; font-weight:500}
.msg .txt{font-size:13.5px; color:var(--ink); white-space:pre-wrap; word-break:break-word; margin-top:1px}
.msg.mine .bub{background:color-mix(in srgb,var(--accent) 10%, var(--surface))}
.msg .bub{border-radius:12px; padding:7px 11px; background:var(--surface-2); min-width:0; flex:1}
.msg .del{opacity:0; transition:.15s; align-self:center}
.msg:hover .del{opacity:1}
.msg-file{display:inline-flex; align-items:center; gap:9px; margin-top:6px; padding:8px 11px;
  border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; max-width:100%}
.msg-file:hover{border-color:var(--accent)}
.msg-file .nm{font-size:12.5px; font-weight:600; color:var(--ink); word-break:break-all}
.msg-file .sz{font-size:11px; color:var(--muted)}
.composer{display:flex; gap:8px; align-items:flex-end; border-top:1px solid var(--border); padding-top:12px; margin-top:6px}
.composer textarea{flex:1; resize:none; min-height:40px; max-height:120px; padding:10px 12px;
  border-radius:11px; border:1px solid var(--border); background:var(--surface); font-size:13.5px; font-family:inherit}
.g-member{display:flex; align-items:center; gap:9px; padding:7px 2px; font-size:13px; border-bottom:1px solid var(--grid)}
.g-member:last-child{border-bottom:none}
.g-member .x{margin-left:auto; opacity:0; transition:.15s}
.g-member:hover .x{opacity:1}
.g-empty{text-align:center; color:var(--muted); font-size:13px; padding:34px 10px}

/* Task timeline */
.tl-wrap{margin-top:22px; border-top:1px solid var(--border); padding-top:16px}
.tl-sum{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tl-sum .b{background:var(--surface-2); border-radius:10px; padding:7px 11px; font-size:12px; line-height:1.35}
.tl-sum .b .k{color:var(--muted); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px}
.tl-sum .b .v{font-weight:650; color:var(--ink)}
.tl-bars{display:flex; height:9px; border-radius:99px; overflow:hidden; margin-bottom:7px; background:var(--surface-2)}
.tl-bars i{display:block; height:100%}
.tl-key{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:16px}
.tl-key span{display:inline-flex; align-items:center; gap:5px}
.tl-key .sw{width:9px; height:9px; border-radius:3px}
.tl-list{position:relative; padding-left:20px; max-height:280px; overflow-y:auto}
.tl-list:before{content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--grid)}
.tl-row{position:relative; padding:0 0 13px 0; font-size:12.5px}
.tl-row:last-child{padding-bottom:2px}
.tl-row .dot{position:absolute; left:-19px; top:4px; width:9px; height:9px; border-radius:50%;
  background:var(--baseline); border:2px solid var(--surface); box-sizing:content-box}
.tl-row.k-created .dot{background:var(--accent)}
.tl-row.k-done .dot{background:var(--good)}
.tl-row.k-reopened .dot{background:var(--serious)}
.tl-row.k-paused .dot{background:var(--warning)}
.tl-row.k-resumed .dot{background:var(--good)}
.tl-row.k-comment .dot{background:var(--s7,var(--accent))}
.tl-row .when{color:var(--muted); font-size:11.5px; margin-left:6px; white-space:nowrap}
.tl-row .said{background:var(--surface-2); border-radius:9px; padding:7px 10px; margin-top:4px;
  font-size:13px; color:var(--ink); white-space:pre-wrap}
.tl-add{display:flex; gap:8px; margin-top:12px}
.tl-add input{flex:1; padding:8px 11px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); font-size:13px}

/* Documents */
.doc-drop{border:1.5px dashed var(--border); border-radius:12px; padding:18px; text-align:center;
  cursor:pointer; transition:.15s; background:var(--surface); font-size:13px; color:var(--muted)}
.doc-drop:hover,.doc-drop.hot{border-color:var(--accent); background:var(--surface-2); color:var(--ink)}
.doc-drop b{color:var(--ink); font-weight:650}
.doc-pick{display:flex; align-items:center; gap:10px; margin-top:11px; font-size:13px;
  background:var(--surface-2); border-radius:10px; padding:9px 12px}
.doc-pick .x{margin-left:auto}
.log-entry .file-ic{width:34px; height:34px; border-radius:9px; flex:none; display:flex;
  align-items:center; justify-content:center; font-size:10px; font-weight:800; letter-spacing:.3px;
  background:var(--surface-2); color:var(--muted); text-transform:uppercase}
.doc-name{font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; word-break:break-word}
.doc-name:hover{color:var(--accent); text-decoration:underline}

/* Daily Update — one day at a time: who moved what, and who did not */
.day-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface);
  border:1px solid var(--border); border-radius:12px; padding:9px 12px; margin-bottom:16px}
.day-bar .dnav{width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center;
  border-radius:9px; border:1px solid var(--border); background:var(--surface); cursor:pointer;
  font-size:17px; line-height:1; color:var(--ink2); font-family:inherit}
.day-bar .dnav:hover:not(:disabled){background:var(--surface-2); color:var(--ink)}
.day-bar .dnav:disabled{opacity:.32; cursor:default}
.day-bar .dttl{font-size:14.5px; font-weight:650; color:var(--ink); min-width:172px; line-height:1.25}
.day-bar .dttl small{display:block; font-size:11.5px; font-weight:500; color:var(--muted)}
.day-bar input[type=date]{padding:7px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); font-size:12.5px; color:var(--ink); font-family:inherit}
.day-bar .spacer{margin-left:auto}
/* Daily Update — one card per person; their whole day opens in a layer on the right */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(262px,1fr)); gap:12px; margin-top:2px}
.pcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 13px 11px;
  cursor:pointer; transition:.13s; display:flex; flex-direction:column; gap:9px; text-align:left; width:100%;
  font-family:inherit; font-size:inherit; color:var(--ink); box-shadow:var(--shadow); appearance:none}
.pcard:hover{transform:translateY(-1px); box-shadow:var(--shadow-lg); border-color:var(--accent)}
.pcard.quiet{opacity:.8}
.pcard.idle{background:transparent; border-style:dashed; box-shadow:none; opacity:.7}
.pcard-head{display:flex; align-items:center; gap:9px}
.pcard-head .nm{font-weight:650; font-size:13.5px; line-height:1.25}
.pcard-head .rl{font-size:11px; color:var(--muted)}
.pcard-head .bell{margin-left:auto; flex:none; height:22px; padding:0 9px; border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  font-size:11.5px; font-weight:750; background:var(--accent); color:#fff}
.pcard-head .bell.none{background:var(--surface); color:var(--muted); border:1px solid var(--border); font-weight:600}
.pcard-nums{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:8px 0 7px;
  border-top:1px solid var(--grid); border-bottom:1px solid var(--grid)}
.pcard-nums .n{text-align:center; min-width:0}
.pcard-nums .n b{display:block; font-size:17px; font-weight:750; line-height:1.1; font-variant-numeric:tabular-nums}
.pcard-nums .n span{display:block; font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; margin-top:2px}
.pcard-nums .n.bad b{color:var(--critical)}
.pcard-nums .n.good b{color:var(--good)}
.pcard-nums .n.zero b{color:var(--muted); font-weight:600}
.pcard-foot{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; min-width:0}
.pcard-foot .q{color:var(--muted); font-weight:650}
.pcard-foot .go{margin-left:auto; flex:none; color:var(--accent); font-weight:650}
/* the layer itself: the person drawer, made wide, with a pinned head and a scrolling body */
.drawer.wide{width:min(900px,96vw); padding:0; display:flex; flex-direction:column; overflow:hidden}
.upl-head{flex:none; background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px 12px}
.upl-who{display:flex; align-items:center; gap:12px}
.upl-who .nm{font-weight:700; font-size:16px; line-height:1.2}
.upl-who .rl{font-size:12px; color:var(--muted); margin-top:1px}
.upl-who .acts{margin-left:auto; display:flex; gap:6px; align-items:center; flex:none}
.upl-day{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
.upl-day .dttl{font-size:13.5px; font-weight:650; min-width:150px; line-height:1.2}
.upl-day .dttl small{display:block; font-size:11px; font-weight:500; color:var(--muted)}
.upl-tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
.upl-tiles .tile{padding:9px 11px; box-shadow:none}
.upl-tiles .tile .lbl{font-size:11px}
.upl-tiles .tile .val{font-size:20px; margin-top:1px}
.upl-tiles .tile .delta{font-size:10.5px}
.upl-jump{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.upl-jump button{font:inherit; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:99px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink2); cursor:pointer}
.upl-jump button:hover{color:var(--accent); border-color:var(--accent)}
.upl-jump button b{color:var(--ink); font-weight:750}
.upl-body{flex:1; overflow-y:auto; padding:6px 20px 44px}
.upl-sec{margin-top:22px; scroll-margin-top:10px}
.upl-sec .sh{display:flex; align-items:center; gap:9px; margin-bottom:8px; flex-wrap:wrap}

.upl-sec .sh .sub{font-size:11.5px; color:var(--muted)}

.upl-sub.bad{color:var(--critical)}
.upl-row{display:flex; gap:10px; align-items:flex-start; padding:9px 7px; border-bottom:1px solid var(--grid);
  cursor:pointer; border-radius:8px; transition:.1s}
.upl-row:hover{background:var(--surface-2)}

.upl-row .t{font-size:13px; font-weight:600; color:var(--ink); line-height:1.3}
.upl-row .s{font-size:11.5px; color:var(--muted); margin-top:2px}
.upl-row .meta{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; align-items:center}
.upl-row .meta .bd{font-size:10.5px; color:var(--muted)}
.upl-row.done-row .t{text-decoration:line-through; color:var(--muted)}
.upl-empty{font-size:12.5px; color:var(--muted); padding:11px 8px; border:1.5px dashed var(--grid); border-radius:10px}
.upl-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:8px}
.upl-note{display:flex; gap:10px; align-items:flex-start; padding:8px 7px; border-bottom:1px solid var(--grid); font-size:12.5px}

.upl-note .c{font-size:11px; color:var(--muted)}
.chip.sameday{background:color-mix(in srgb,var(--good) 14%, var(--surface)); color:var(--good-text); font-weight:700}
/* My Day — the same lists, with the buttons that move your own tasks */
.md-wrap{max-width:1040px}
.md-wrap .upl-tiles{margin-top:0}
.md-wrap .upl-sec{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px 16px 10px; margin-top:16px}
.md-wrap .upl-sec .sh{margin-bottom:6px}
.md-acts{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
.md-acts .act{font:inherit; font-size:11.5px; font-weight:650; padding:4px 10px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink2); cursor:pointer; line-height:1.4; transition:.12s}
.md-acts .act:hover{color:var(--ink); border-color:var(--accent); box-shadow:var(--shadow)}
.md-acts .act.done{color:var(--good-text); border-color:color-mix(in srgb,var(--good) 45%, transparent)}
.md-acts .act.done:hover{background:color-mix(in srgb,var(--good) 12%, var(--surface))}
.md-acts .act.pause{color:#8a6206; border-color:color-mix(in srgb,var(--warning) 50%, transparent)}
[data-theme="dark"] .md-acts .act.pause{color:var(--warning)}
.md-note{display:flex; gap:6px; margin-top:7px; align-items:center}
.md-note input{flex:1; min-width:0; padding:7px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); font:inherit; font-size:12.5px; color:var(--ink)}
.md-logform{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; padding:10px; align-items:center;
  border:1.5px dashed var(--grid); border-radius:10px; background:var(--surface-2)}
.md-logform select,.md-logform input{padding:7px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); font:inherit; font-size:12.5px; color:var(--ink)}
.md-logform input{flex:1; min-width:180px}
.uc .md-acts{margin-top:9px; padding-top:8px; border-top:1px dashed var(--border)}
/* a task opened from inside the layer must sit above it, not behind it */
body.layer-open .overlay{z-index:90}
.uc{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:10px 11px;
  border-left:3px solid var(--pc,var(--baseline)); cursor:pointer; transition:.12s}

.uc .tt{font-weight:600; font-size:13px; line-height:1.32}
.uc .tt .hd{font-size:11.5px}
.uc.done-card .tt{text-decoration:line-through; color:var(--muted)}

.uc .meta{display:flex; align-items:center; gap:5px; margin-top:7px; flex-wrap:wrap}

  color:var(--accent); margin-bottom:5px}
.uc .upd .l{display:flex; gap:7px; font-size:11.5px; color:var(--ink2); line-height:1.42; margin-bottom:3px}
.uc .upd .l:last-child{margin-bottom:0}
.uc .upd .l .tm{color:var(--muted); font-variant-numeric:tabular-nums; flex:none; min-width:52px}
.uc .upd .l i{color:var(--muted); font-style:normal}

<script>
"use strict";
/* ================================================================
   WeVois Daily Activity Tracker — LIVE build (Supabase).
   Hierarchy: CEO → VP → Manager → Team Member.
   Job roles and accounts are created by an Admin; CEO/VP raise requests.
   Config lives in supabase-config.js. Schema: TRACKER-SETUP.sql.
   ================================================================ */

/* ---------------- date helpers ---------------- */
const DAY = 864e5;
const todayD = new Date(); todayD.setHours(0,0,0,0);
const iso = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const dOff = n => iso(new Date(todayD.getTime()+n*DAY));           // n days from today
const TODAY = dOff(0);
const fmtDate = s => { if(!s) return "—"; const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); };
const fmtDateLong = s => new Date(s+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
const relDay = s => s===TODAY?"Today": s===dOff(-1)?"Yesterday": s===dOff(1)?"Tomorrow": fmtDate(s);
const dueState = t => { if(t.done) return "done"; if(!t.due) return "none";
  return t.due<TODAY?"overdue": t.due===TODAY?"today":"later"; };

/* ---------------- the four stages ----------------
   Fixed for every board, deliberately. When "Pause" means the same thing on
   every team, "how many of my people are stuck?" has a real answer. Enforced
   by a check constraint in TRACKER-UPDATE-07.sql, not just here. */
const STAGES = ["Start","In Progress","Pause","Done"];
const STAGE_DONE = "Done", STAGE_PAUSE = "Pause", STAGE_WIP = "In Progress", STAGE_START = "Start";
let PAUSE_REASONS = [];

/* ---------------- org model ---------------- */
const LEVELS = { ceo:{label:"CEO",rank:4}, vp:{label:"VP",rank:3}, manager:{label:"Manager",rank:2}, member:{label:"Team Member",rank:1} };

/* ---------------- live data, loaded from Supabase ---------------- */
let DEPTS = [], ROLES = [], USERS = [], PIPES = [], TASKS = [],
    LOG_CATS = [], LOGS = [], REQS = [], EVENTS = [], DOCS = [],
    GROUPS = [], GMEMS = [], MSGS = [], KPIS = [], KTARGETS = [],
    LEGAL = [], LEGAL_FILES = [],
    TENDERS = [], TFILES = [], EMDS = [];
const U = id => USERS.find(u=>u.id===id);

/* ---------------- Supabase ---------------- */
const CFG = window.TRACKER_CONFIG || {};
const sb = window.supabase.createClient(CFG.url, CFG.anonKey);
/* A SECOND client, with its own storage key and no session persistence, so an
   admin can sign a new colleague up without being logged out of their own
   session. Provisioning writes go through here; nothing else does. */
const sbNew = window.supabase.createClient(CFG.url, CFG.anonKey, {
  auth:{ storageKey:"dat-provision", persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
});

const DB = {
  async sel(table, cols="*"){ const {data,error}=await sb.from(table).select(cols); if(error) throw error; return data||[]; },
  async ins(table, row){ const {data,error}=await sb.from(table).insert(row).select().single(); if(error) throw error; return data; },
  async upd(table, id, patch){ const {data,error}=await sb.from(table).update(patch).eq("id",id).select().single(); if(error) throw error; return data; },
  async del(table, id){ const {error}=await sb.from(table).delete().eq("id",id); if(error) throw error; },
};
/* A request that never reached Supabase at all - the browser's own network
   error - is not the same as the database refusing it, and should not read
   like one. Deliberately not auto-retried here: an update or delete is safe
   to repeat, but an insert is not, and guard() covers all three. */
function isNetworkError(e){
  const m = (e && (e.message||e.error_description)) || String(e||"");
  return /failed to fetch|networkerror|network request failed|load failed|network connection was lost/i.test(m);
}
/* Any DB call that fails surfaces to the user instead of silently doing nothing. */
async function guard(fn, okMsg){
  try { const r = await fn(); if(okMsg) toast(okMsg); return r; }
  catch(e){
    console.error(e);
    if(isNetworkError(e)){
      toast("Could not reach the server \u2014 check your connection and try again.");
      return null;
    }
    const m = (e && (e.message||e.error_description)) || "Something went wrong";
    toast(/row-level security|permission/i.test(m) ? "You do not have permission to do that." : m);
    return null;
  }
}

/* ================= roles, hierarchy & permissions ================= */
const roleOf   = u => ROLES.find(r=>r.id===u?.role) || null;
const titleOf  = u => roleOf(u)?.name || "No job role";
const isAdmin  = u => !!u?.admin;

   CEO, VP and Admins only. Managers and team members never see the Team tab. */
const canSeeTeam = u => !!u && (u.level==="ceo" || u.level==="vp" || !!u.admin);
/* ---- the guarded screens, in ONE place --------------------------------
   Every screen that is not for everybody is named by a key. The Admin hands a
   key to a JOB ROLE (Admin → Job roles → What this role can see); a bare key
   lets them look, key+":edit" lets them change things. The CEO and every VP
   hold every key, always. Two departments carry their own keys so a new hire
   works the moment their department is right: Legal gets legal, Tender gets
   tender and emd. Mirrors dat_can() / dat_can_edit() in TRACKER-UPDATE-10.sql
   — the database is what actually enforces this, these two only decide what
   the screen offers to draw. */
const ACCESS_MODULES = [
  {key:"docs_all", label:"Everyone's documents",
   hint:"All documents company-wide, and the Documents panel on the Dashboard. This is what AVP and DGM need."},
  {key:"legal", label:"Legal repository",
   hint:"Contracts, cases, notices and licences."},
  {key:"tender", label:"Tender documents",
   hint:"The tender register, tender papers and work orders — without the EMD figures."},
  {key:"emd", label:"EMD details",
   hint:"Amount, site and whether it has come back. Sits inside a tender, but is hidden separately."},
  {key:"ulbmap", label:"ULB map (Business Development)",
   hint:"Every Rajasthan ULB on a map with its officers' contacts, and the BD team's visits. The Sales department has it automatically."},
];
const deptKeys = d => { d=(d||"").toLowerCase();
  return d==="legal" ? ["legal"] : d==="tender" ? ["tender","emd"] : d==="sales" ? ["ulbmap"] : []; };
function can(u, key){
  if(!u) return false;
  if(u.level==="ceo" || u.level==="vp") return true;
  const r = roleOf(u);
  if(r && r.active!==false){
    const a = r.access || [];
    if(a.includes(key) || a.includes(key+":edit")) return true;
    if(key==="docs_all" && r.leadership) return true;
    if(deptKeys(r.dept).includes(key)) return true;
  }
  return deptKeys(u.dept).includes(key);
}
function canEdit(u, key){
  if(!u) return false;
  if(u.level==="ceo" || u.level==="vp") return true;
  const r = roleOf(u);
  if(r && r.active!==false){
    if((r.access||[]).includes(key+":edit")) return true;
    if(deptKeys(r.dept).includes(key)) return true;
  }
  return deptKeys(u.dept).includes(key);
}
const isLeadership = u => can(u, "docs_all");

const isLive   = u => u.active !== false;
const liveUsers = () => USERS.filter(isLive);

const rolePipeIds = u => { const r=roleOf(u); return (r && r.active) ? (r.pipes||[]) : []; };

const childrenOf = id => USERS.filter(u=>u.mgr===id && isLive(u));
function subtree(id){ const out=[id]; childrenOf(id).forEach(c=>out.push(...subtree(c.id))); return out; }
function visibleUserIds(viewer){                       // whose work can I see?
  if(viewer.level==="ceo") return liveUsers().map(u=>u.id);
  if(viewer.level==="member") return [viewer.id];
  return subtree(viewer.id);                            // vp / manager: self + everyone below
}

   a document you attach is visible to you, to everyone above you in the
   reporting line, and to leadership — the CEO, every VP, and any role carrying
   the leadership switch (AVP, DGM) — company-wide, not just your branch.
   Mirrors dat_can_see_docs() in TRACKER-UPDATE-09.sql exactly; the
   database is what actually enforces it, this is only so the screen matches. */
function docVisibleUserIds(viewer){
  if(!viewer) return [];
  if(isLeadership(viewer)) return liveUsers().map(u=>u.id);
  if(viewer.level==="manager") return subtree(viewer.id);
  return [viewer.id];
}

/* Anyone with an account may build a pipeline - a team member organising their
   own work is a normal thing to want. */
const canCreatePipeline = v => !!v;
/* Who a person may hand work to: a manager covers their own team, a VP or the
   CEO can reach anyone in the company, a team member only themselves. */
function assignableUsers(v){
  if(!v) return [];
  if(v.level==="ceo" || v.level==="vp") return liveUsers();
  if(v.level==="manager") { const t=new Set(subtree(v.id)); return liveUsers().filter(u=>t.has(u.id)); }
  return [v];
}
const canAssignOthers = v => assignableUsers(v).length > 1;
/* supervisory views (team workload table, team snapshot) */
const canManage = v => v.level!=="member";
/* A job role can be marked "pipelines stay private" (Admin -> Job roles).
   For such a role, department-wide sharing is off in both directions — that is
   what stops two Billing Managers, who sit in the same department, from
   opening each other's boards. Mirrors dat_pipe_read in TRACKER-UPDATE-04.sql;
   the database is what enforces it. */
const rolePrivatePipes = u => !!roleOf(u)?.privatePipes;
function chainUp(id){ const out=[]; let p=U(id)?.mgr, hops=0;
  while(p && hops++ < 12){ out.push(p); p=U(p)?.mgr; } return out; }
function visiblePipes(v){
  const extra = new Set(rolePipeIds(v));
  let base;
  if(v.level==="ceo") base = PIPES.slice();
  else {
    const mine = new Set(visibleUserIds(v));            // people whose work I oversee
    const up   = new Set(chainUp(v.id));                // my manager, their manager, …
    const iAmPrivate = rolePrivatePipes(v);
    const depts = new Set(USERS.filter(u=>mine.has(u.id)).map(u=>u.dept));
    depts.add(v.dept);
    base = PIPES.filter(p=>{
      if(p.createdBy === v.id) return true;                       // mine
      if(p.createdBy && mine.has(p.createdBy)) return true;       // my people's
      const ownerPrivate = p.createdBy ? rolePrivatePipes(U(p.createdBy)) : false;
      if(ownerPrivate) return up.has(p.createdBy);                // only their own reports
      if(iAmPrivate) return false;                                // I opt out of dept sharing
      return !p.dept || depts.has(p.dept);
    });
  }
  PIPES.forEach(p=>{ if(extra.has(p.id) && !base.includes(p)) base.push(p); });
  /* Any pipeline holding work you can see is itself visible - otherwise a task
     assigned to you from another part of the company would have nowhere to show. */
  const fromWork = new Set(visibleTasks(v).map(t=>t.pipe));
  PIPES.forEach(p=>{ if(fromWork.has(p.id) && !base.includes(p)) base.push(p); });
  return base;
}
function visibleTasks(v){
  const ids = new Set(visibleUserIds(v));
  const rp  = new Set(rolePipeIds(v));
  return TASKS.filter(t=>ids.has(t.assignee) || t.createdBy===v.id || rp.has(t.pipe));
}

const canEditPipe = (v,p) => v.level==="ceo" || p.createdBy===v.id
  || (v.level==="vp" && visiblePipes(v).includes(p));

function validMgrOptions(userId){
  const banned = userId ? new Set(subtree(userId)) : new Set();

async function toggleNotifications(){
  const s = notifStatus();
  if(s === "unsupported"){ toast("This browser cannot show desktop notifications."); return; }
  if(s === "insecure"){
    openInfoModal("Notifications need https",
      `Desktop notifications only work on a secure connection. Open the app on its
       <b>https://</b> address (your Vercel URL) rather than a plain file or http address.`);
    return;
  }
  if(s === "blocked"){
    openInfoModal("Notifications are blocked",
      `Your browser has blocked notifications for this site, so the app cannot ask again.<br><br>
       Click the <b>padlock</b> (or the sliders icon) at the left of the address bar &rarr;
       <b>Notifications</b> &rarr; <b>Allow</b>, then reload the page.<br><br>
       Also worth checking on Windows: <b>Settings &rarr; System &rarr; Notifications</b>, and turn
       <b>Do not disturb</b> off &mdash; with it on, notifications are collected silently instead of
       appearing on screen.`);
    return;
  }
  if(s === "on"){ openNotifPanel(); return; }        // already on: show what is going on instead

  let perm = Notification.permission;
  if(perm !== "granted"){
    try { perm = await Notification.requestPermission(); }
    catch(_){ perm = Notification.permission; }
  }
  if(perm !== "granted"){ paintNotifBtn(); toast("Notifications were not allowed."); return; }
  setNotifPref(true); paintNotifBtn();
  toast("Desktop notifications on ✓");
  showNotify("Notifications are on",
    "Updates to your team's tasks will appear here, even when this tab is in the background.",
    null, true);

/* Show one. Skipped while the tab is in front - you can already see the change,
   so a popup would only be noise; a toast is shown instead. */
async function showNotify(title, body, taskId, force){
  if(!notifOn()) return false;
  if(!force && document.visibilityState === "visible" && document.hasFocus()){ toast(body); return false; }
  const opts = {body, icon:NOTIF_ICON, badge:NOTIF_ICON, tag:"dat-"+(taskId||"app"),
                renotify:true, data:{taskId:taskId||null}};
  try{
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if(reg && reg.showNotification){ await reg.showNotification(title, opts); return true; }
  }catch(_){}
  try{ new Notification(title, opts); return true; }catch(_){ return false; }
}

    <div class="m-actions">
      <button type="button" class="btn danger sm" id="notifOff">Turn off</button>
      <div class="grow"></div>
      <button type="button" class="btn" onclick="closeModal()">Close</button>
      <button type="button" class="btn primary" id="notifTest">Send a test notification</button>
    </div>
  </div>`);
  $("#notifOff").addEventListener("click",()=>{
    setNotifPref(false); paintNotifBtn(); closeModal(); toast("Desktop notifications turned off"); });
  $("#notifTest").addEventListener("click", async ()=>{
    const out = $("#notifTestOut");
    out.innerHTML = `<span style="color:var(--muted)">Sending…</span>`;
    const tag = "dat-test-" + Date.now();
    let listed = null;            // true / false / null = the browser could not tell us
    try{
      const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
      if(reg && reg.showNotification){
        await reg.showNotification("WeVois Tracker — test", {
          body:"If you can read this on your screen, notifications are working.",
          icon:NOTIF_ICON, badge:NOTIF_ICON, tag, data:{taskId:null},
          requireInteraction:true});     // stay on screen, so "did you see it" is a fair question
        await new Promise(r=>setTimeout(r,400));
        if(typeof reg.getNotifications === "function"){
          try{ listed = (await reg.getNotifications({tag})).length > 0; }catch(_){ listed = null; }
          setTimeout(()=>{ try{ reg.getNotifications({tag})
            .then(ns=>ns.forEach(n=>n.close())).catch(()=>{}); }catch(_){} }, 25000);
        }
      } else {
        new Notification("WeVois Tracker — test",
          {body:"Notifications are working.", icon:NOTIF_ICON, tag});
      }
    }catch(err){
      out.innerHTML = `<div style="color:var(--critical)">The browser refused it outright:
        <code>${esc(err.message||String(err))}</code></div>`;
      return;
    }

    /* The browser accepted it - showNotification did not throw and permission is
       granted. Whether it actually reached the screen is a question only you can
       answer: Windows can swallow a notification silently, and Chrome on Windows
       does not always list a native notification back to us. So ask, instead of
       guessing - the old version guessed, and guessed wrong. */
    out.innerHTML = `
      <div style="background:var(--surface-2);border-radius:10px;padding:12px 14px">
        <b>Sent — the browser accepted it${listed===true?" and is still showing it":""}.</b>
        <div style="margin-top:6px">Did a notification box appear on your screen just now?</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button type="button" class="btn sm" id="nSaw">Yes, I saw it</button>
          <button type="button" class="btn sm" id="nNope">No, nothing appeared</button>
        </div>
      </div>`;
    $("#nSaw").addEventListener("click",()=>{
      out.innerHTML = `<div style="background:color-mix(in srgb,var(--good) 12%, var(--surface));
        border-radius:10px;padding:12px 14px">
        <b>✅ Notifications are working properly.</b><br>
        Nothing is wrong with the setup. If you saw nothing earlier when a task changed, it was one of
        these two, and both are deliberate:<br><br>
        • <b>You were looking at the tracker</b> when it happened — a popup for something already on
        your screen would be noise, so you get a small toast instead.<br>
        • <b>You made the change yourself</b> — nobody is notified about their own action. Test it with
        a second account: have a team member move a card while your tab sits in the background.</div>`;
    });
    $("#nNope").addEventListener("click",()=>{
      out.innerHTML = `<div style="background:color-mix(in srgb,var(--warning) 14%, var(--surface));
        border-radius:10px;padding:12px 14px">
        <b>Then Windows is holding it back, not the browser.</b><br>
        Every check above is green and the browser accepted the notification, so the block is at the
        operating-system level. In order of likelihood:<br><br>
        <b>1. Do not disturb / Focus assist.</b> Right-click the bell in the system tray (bottom-right)
        → <b>Turn off do not disturb</b>. With it on, notifications are collected silently in the
        notification centre instead of appearing.<br>
        <b>2. Chrome is not allowed to notify.</b> Windows <b>Settings → System → Notifications</b> →
        make sure notifications are on, and that <b>Google Chrome</b> is switched on in the app list.<br>
        <b>3. Chrome's own setting.</b> Paste <code>chrome://settings/content/notifications</code> into
        the address bar and check this site is under <i>Allowed</i>. While you are there, if
        <i>"Use quieter messaging"</i> is on, turn it off.<br><br>
        Check the notification centre now (Windows key + N) — if the test message is sitting in there,
        that confirms it: the notification arrived, Windows just did not show it on screen.</div>`;
    });
  });
}

/* Who hears about a change: the people the actor reports up to.
   - never yourself, about your own action
   - only if that person's work is yours to oversee (dat_visible_users, i.e.
     your own branch; everyone, for the CEO)
   A team member oversees nobody, so they are never notified by this rule. */
function shouldNotify(ev){
  const me = state.me;
  if(!me || !ev || !ev.actor) return false;
  if(ev.actor === me.id) return false;
  if(me.level === "member") return false;
  return visibleUserIds(me).includes(ev.actor);
}
function evPlain(e, who){
  switch(e.kind){
    case "created":  return `${who} created this task in ${e.to||"the first stage"}`;
    case "moved":    return `${who} moved it: ${e.from||"—"} → ${e.to||"—"}`;
    case "assigned": return `${who} reassigned it to ${e.to||"someone else"}`;
    case "priority": return `${who} changed priority: ${e.from||"—"} → ${e.to||"—"}`;
    case "due":      return e.to ? `${who} set the due date to ${fmtDate(e.to)}` : `${who} removed the due date`;
    case "renamed":  return `${who} renamed it`;
    case "edited":   return `${who} edited the notes`;
    case "paused":   return `${who} paused it${e.note?` — ${e.note}`:""}`;
    case "resumed":  return `${who} resumed it`;
    case "done":     return `${who} marked it done`;
    case "reopened": return `${who} reopened it`;
    case "comment":  return `${who}: ${e.note}`;
    default:         return `${who} updated this task`;
  }
}
const notifSeen = new Set();
async function onTaskEventLive(payload){
  const row = payload && payload.new; if(!row) return;
  /* Before anything else: the Daily Update screen caches a day's history, and
     this row is history. Drop that day so it cannot go stale behind them. */
  upCacheDrop(row.created_at);
  if(notifSeen.has(row.id)) return;                 // realtime can deliver twice
  notifSeen.add(row.id);
  if(notifSeen.size > 400) notifSeen.clear();
  if(!shouldNotify(row)) return;
  const ev = mapTEv(row);
  const who = U(ev.actor)?.name || "A colleague";
  let t = TASKS.find(x=>x.id===ev.task);
  if(!t){                                            // a task created since the last load
    try{ const {data} = await sb.from("dat_tasks").select("*").eq("id",ev.task).single();
         if(data) t = mapTask(data); }catch(_){}
  }
  showNotify(t?.title ? trunc(t.title) : "Task updated", evPlain(ev, who), ev.task);
}
/* A new message in a group you are in. Never your own, and never a group you
   are only managing rather than a member of. */
async function onMessageLive(payload){
  const row = payload && payload.new; if(!row) return;
  if(notifSeen.has("m"+row.id)) return;
  notifSeen.add("m"+row.id);
  const m = mapMsg(row);
  if(!MSGS.some(x=>x.id===m.id)) MSGS.push(m);
  const me = state.me;
  const g = GROUPS.find(x=>x.id===m.group);
  if(state.view==="groups") render();                 // the open chat updates live
  else if(g && me && inGroup(m.group, me.id) && m.user!==me.id) render();  // refresh the unread badge
  if(!me || m.user===me.id || !inGroup(m.group, me.id)) return;
  const who = U(m.user)?.name || "Someone";
  const body = m.body ? m.body : m.file ? `📎 ${m.file}` : "sent a message";
  showNotify(`${who} · ${g?.name || "Group"}`, body, "grp-"+m.group);
}

/* Clicking the notification asks the service worker to focus this tab; it
   messages us back with the task to open. */
function wireNotifBridge(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.addEventListener("message", e=>{
    const d = e.data || {};
    if(d.type !== "open-task") return;
    window.focus();
    if(!d.taskId || !state.me) return;
    if(String(d.taskId).startsWith("grp-")){          // a group message notification
      state.view = "groups"; state.group = String(d.taskId).slice(4); render(); return;
    }
    const t = TASKS.find(x=>x.id===d.taskId);
    if(t){ state.view = "pipelines"; state.pipe = t.pipe; render(); openTaskModal(t.id); }
  });
}

/* ================= what is new since you last looked =================
   Every screen remembers the moment this person last had it open, and the
   sidebar shows how many things have appeared or changed there since. The
   moment is kept in this browser, not the database: it is a reading position,
   it is different on the office PC and the phone, and it is nobody else's
   business. Opening a screen marks it read straight away, so your own work
   never shows up as news to you. A browser that has never run this before
   starts from "now" — nobody wants to sign in to 400 unread documents. */
const FRESH_VIEWS = ["pipelines","kpis","documents","legal","tenders"];
let SEEN = {}, SEEN_FOR = null;
const seenKey = () => "dat-seen-views-" + (state.me ? state.me.id : "anon");

/* The marks live in dat_seen, so opening Documents on the phone clears the
   count on the desktop too. localStorage stays on as a same-instant cache —
   it paints the badges before the first query comes back, and it is the whole
   story on a project where TRACKER-UPDATE-11.sql has not been run. */
function saveSeen(){ try{ localStorage.setItem(seenKey(), JSON.stringify(SEEN)); }catch(_){} }
/* Take the later of what we hold and what arrived — from the database, or from
   this browser's cache. A mark only ever moves forward. */
function mergeSeen(other){
  if(!other) return;
  Object.keys(other).forEach(v=>{
    const t = Number(other[v]) || 0;
    if(t > (Number(SEEN[v]) || 0)) SEEN[v] = t;
  });
}
function ensureSeen(){
  if(!state.me || SEEN_FOR === state.me.id) return;
  SEEN_FOR = state.me.id;
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(seenKey()) || "null"); }catch(_){ raw = null; }
  if(raw && typeof raw === "object") mergeSeen(raw);
  if(!Object.keys(SEEN).length){
    /* first time on this account anywhere — start from now. Nobody wants to
       sign in to four hundred unread documents. */
    const now = Date.now();
    FRESH_VIEWS.forEach(v=>{ SEEN[v] = now; pushSeen(v); });
  }
  saveSeen();
}

/* Rendering happens far more often than reading does — a realtime change
   repaints the screen you are already sitting on — so the write is debounced
   and only the last value of a burst reaches the database. */
const seenTimers = {};
function pushSeen(view){
  if(!SEEN_DB || !state.me) return;
  clearTimeout(seenTimers[view]);
  seenTimers[view] = setTimeout(async ()=>{
    const at = SEEN[view]; if(!at) return;
    try{
      const {error} = await sb.from("dat_seen")
        .upsert({user_id:state.me.id, view, seen_at:new Date(at).toISOString()},
                {onConflict:"user_id,view"});
      if(error) throw error;
    }catch(e){
      /* a missing table or a refused write must never cost anybody their work,
         so the marks quietly go back to being this browser's business */
      SEEN_DB = false; console.warn("Could not save the read position:", e.message||e);
    }
  }, 1200);
}
/* The newest thing on a screen, whoever put it there. Timestamps come from the
   database clock and this runs on the browser clock; if the two disagree by a
   few seconds a brand-new row can look like it is in the future, and a badge
   that will not clear is worse than no badge. Marking a screen read therefore
   moves the marker past the newest row on it, not merely to "now". */
function latestTs(view){
  let x = 0; const M = t => { if(t && t > x) x = t; };
  if(view === "pipelines") TASKS.forEach(t=>{ M(t.createdAt); M(t.closedAt); });
  if(view === "kpis")      KTARGETS.forEach(k=>M(k.updatedAt));
  if(view === "documents") DOCS.forEach(d=>M(d.ts));
  if(view === "legal"){ LEGAL.forEach(m=>{ M(m.ts); M(m.updatedAt); }); LEGAL_FILES.forEach(f=>M(f.ts)); }
  if(view === "tenders"){ TENDERS.forEach(t=>{ M(t.ts); M(t.updatedAt); });
    TFILES.forEach(f=>M(f.ts)); EMDS.forEach(e=>M(e.ts)); }
  return x;
}
/* markViewSeen, not markSeen — the groups module already owns that name, and a
   second function declaration of it would quietly replace this one. */
function markViewSeen(view){
  if(!FRESH_VIEWS.includes(view)) return;
  const at = Math.max(Date.now(), latestTs(view));
  if(SEEN[view] === at) return;
  SEEN[view] = at; saveSeen(); pushSeen(view);
}
const seenAt = v => Number(SEEN[v]) || 0;
const after  = (ts, t) => !!ts && ts > t;

/* Counts only what SOMEBODY ELSE did — a document you filed yourself is not
   news. Each item counts once however many ways it changed. */
function freshCount(view){
  const me = state.me; if(!me) return 0;
  const t = seenAt(view);
  if(!t) return 0;
  if(view === "pipelines")
    return visibleTasks(me).filter(x =>
      (after(x.createdAt, t) && x.createdBy !== me.id) ||
      (after(x.closedAt,  t) && x.assignee  !== me.id)).length;
  if(view === "kpis"){
    const mine = new Set(visibleUserIds(me));
    return KTARGETS.filter(k => mine.has(k.user) && k.setBy !== me.id && after(k.updatedAt, t)).length;
  }
  if(view === "documents"){
    const ids = new Set(docVisibleUserIds(me));
    return DOCS.filter(d => ids.has(d.user) && d.user !== me.id && after(d.ts, t)).length;
  }
  if(view === "legal"){
    const hit = new Set();
    LEGAL.forEach(m=>{ if(m.createdBy !== me.id && (after(m.ts,t) || after(m.updatedAt,t))) hit.add(m.id); });
    LEGAL_FILES.forEach(f=>{ if(f.by !== me.id && after(f.ts,t)) hit.add(f.legal); });
    return hit.size;
  }
  if(view === "tenders"){
    const hit = new Set();
    TENDERS.forEach(x=>{ if(x.createdBy !== me.id && (after(x.ts,t) || after(x.updatedAt,t))) hit.add(x.id); });
    TFILES.forEach(f=>{ if(f.by !== me.id && after(f.ts,t)) hit.add(f.tender); });
    EMDS.forEach(e=>{ if(e.createdBy !== me.id && after(e.ts,t)) hit.add(e.tender); });
    return hit.size;
  }
  return 0;
}

/* ================= shell ================= */
const NAVS = [
  {id:"dashboard", label:"Dashboard", ic:IC.dash},
  {id:"pipelines", label:"Daily Tasks", ic:IC.pipe},
  {id:"kpis",      label:"KPIs",      ic:IC.kpi},
  {id:"documents", label:"Documents", ic:IC.doc},
];
const VIEW_TITLES = {dashboard:"Dashboard", pipelines:"Daily Tasks", daily:"Daily Log", myday:"My Day",
  dailyup:"Daily Update", ulbmap:"ULB Map", kpis:"KPIs", documents:"Documents", legal:"Legal repository",
  tenders:"Tenders",
  groups:"Groups", team:"Team",
  review:"Employee review", admin:"Admin console", requests:"My requests"};
function navsFor(me){
  const n=[...NAVS];
  /* My Day sits straight after the board, for everyone: your own day in the
     same four lists a manager reads, with the buttons to update it. */
  n.splice(2, 0, {id:"myday", label:"My Day", ic:IC.log});
  /* Daily Update follows it, and only for people who have somebody under
     them - it is a leadership read-out, not a personal screen. */
  if(teamPeople().length){
    n.splice(3, 0, {id:"dailyup", label:"Daily Update", ic:IC.day});
    n.push({id:"review", label:"Review", ic:IC.review});
  }
  /* Legal sits with Documents — a register, not a personal screen. Only the
     CEO, the VPs and the Legal department ever see the tab at all. */
  if(canLegal(me)) n.push({id:"legal", label:"Legal", ic:IC.legal, count:legalAlerts().length});
  if(can(me,"tender")) n.push({id:"tenders", label:"Tenders", ic:IC.tender, count:tenderAlerts().length});
  if(can(me,"ulbmap")) n.push({id:"ulbmap", label:"ULB Map", ic:IC.map});
  if(GROUPS_READY && (myGroups().length || canRunGroups(me)))
    n.push({id:"groups", label:"Groups", ic:IC.chat, count:unreadTotal()});
  if(canSeeTeam(me)) n.push({id:"team", label:"Team", ic:IC.team});
  if(isAdmin(me)) n.push({id:"admin", label:"Admin", ic:IC.admin, count:pendingReqs().length});
  else if(canRequest(me)) n.push({id:"requests", label:"Requests", ic:IC.inbox,
    count:REQS.filter(r=>r.by===me.id&&r.status==="pending").length});
  n.forEach(x=>{ x.fresh = freshCount(x.id); });
  return n;
}

async function boot(){
  applyTheme();
  if(!CFG.url || !CFG.anonKey || /YOUR_/.test(CFG.url+CFG.anonKey)){
    authShell("Not configured yet",
      "The app cannot reach a database.",
      `<div style="font-size:13.5px;color:var(--ink2);line-height:1.6">
        Open <code>supabase-config.js</code> and paste your project URL and anon key from
        Supabase &rarr; Project Settings &rarr; API.</div>`);
    return;
  }
  const {data:{session}} = await sb.auth.getSession();
  if(session) return afterLogin();
  let needs=false;
  try{ const {data} = await sb.rpc("dat_needs_setup"); needs = data===true; }catch(_){}
  needs ? renderFirstRun() : renderSignIn();
}
async function afterLogin(){
  $("#login").innerHTML = `<div class="login-card" style="text-align:center;color:var(--ink2)">Loading your workspace...</div>`;
  const {data:{user}} = await sb.auth.getUser();
  try { await loadAll(); }
  catch(e){
    console.error(e);
    /* loadAll() is all reads, so a network blip - common right after a laptop
       wakes up or Wi-Fi reconnects - is safe to quietly retry once before
       showing anyone an error screen. */
    if(isNetworkError(e)){
      await new Promise(r=>setTimeout(r,1500));
      try{ await loadAll(); }
      catch(e2){
        console.error(e2);
        authShell("Could not connect", "Your connection dropped before the workspace could load.",
          `<div style="font-size:13.5px;color:var(--ink2)">Check your internet connection, then
            <a href="#" id="retryLoad" style="color:var(--accent)">try again</a>.</div>
           <button class="btn" id="soBtn" style="justify-content:center;margin-top:16px">Sign out</button>`);
        $("#retryLoad").addEventListener("click", ev=>{ ev.preventDefault(); location.reload(); });
        $("#soBtn").addEventListener("click", logout); return;
      }
    } else {
      authShell("Could not load your data", "The database rejected the request.",
        `<div style="font-size:13.5px;color:var(--critical)">${esc(e.message||String(e))}</div>
         <button class="btn" id="soBtn" style="justify-content:center;margin-top:16px">Sign out</button>`);
      $("#soBtn").addEventListener("click", logout); return;
    }
  }
  state.me = USERS.find(u=>u.id===user.id);
  if(!state.me || !state.me.active){ renderNoProfile(user.email); return; }
  state.view="dashboard"; state.logWho=null; state.docWho=null; state.adminTab="accounts";
  state.kpiMonth = THIS_MONTH; state.upDate = TODAY; state.mdDate = TODAY;
  state.fAssignee="all"; state.fPriority="all"; state.fSearch="";
  state.pipeOwners = state.me.level==="manager" ? [state.me.id] : null;
  state.pipeOwnerFilterOpen = false;
  const vp = visiblePipes(state.me).filter(p=>state.me.level!=="manager" || state.pipeOwners.includes(p.createdBy));
  state.pipe = vp[0]?.id || null;
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  render();
  subscribeRealtime();
}
async function logout(){
  if(chan){ sb.removeChannel(chan); chan=null; }
  ULB_READY = null; ULB_LOADING = null; ULBS = []; ULB_VISITS = []; um.district = null; um.ulb = null; um.VB = null;
