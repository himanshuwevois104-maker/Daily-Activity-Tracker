/* live refresh when a colleague changes something */
let chan=null, reloadTimer=null, REALTIME_STATE="not connected";
function subscribeRealtime(){
  if(chan) return;
  chan = sb.channel("dat-live");
  ["dat_tasks","dat_logs","dat_pipelines","dat_profiles","dat_job_roles","dat_requests","dat_departments","dat_log_categories","dat_docs"]
    .forEach(t=>chan.on("postgres_changes",{event:"*",schema:"public",table:t},queueReload));
  /* Task history drives the desktop notifications. Realtime only delivers rows
     the signed-in person is allowed to read, so this cannot leak another
     branch's work even before shouldNotify() looks at it. */
  chan.on("postgres_changes",{event:"INSERT",schema:"public",table:"dat_task_events"}, onTaskEventLive);
  /* group chat: realtime only delivers messages from groups you belong to */
  chan.on("postgres_changes",{event:"INSERT",schema:"public",table:"dat_messages"}, onMessageLive);
  /* ULB map: a colleague's visit or status change repaints the map in place */
  ["dat_ulbs","dat_ulb_visits"].forEach(t=>chan.on("postgres_changes",{event:"*",schema:"public",table:t}, onUlbLive));
  ["dat_groups","dat_group_members","dat_kpis","dat_kpi_targets","dat_legal","dat_legal_files","dat_tenders","dat_tender_files","dat_tender_emd"].forEach(t=>
    chan.on("postgres_changes",{event:"*",schema:"public",table:t}, queueReload));
  chan.subscribe(status=>{ REALTIME_STATE = status || "unknown"; });
}
function queueReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async ()=>{
    if(!state.me || $("#overlayHost").innerHTML) return;   // never yank a form out from under someone
    try{ await loadAll(); const me=USERS.find(u=>u.id===state.me.id);
      if(!me || !me.active){ return logout(); }
      state.me=me; render(); }catch(_){}
  }, 700);
}

/* ================= tooltip ================= */
function showTip(html,x,y){ const tt=$("#tooltip"); tt.innerHTML=html; tt.style.opacity="1";
  const w=tt.offsetWidth,h=tt.offsetHeight;
  tt.style.left=Math.min(x+14, innerWidth-w-10)+"px";
  tt.style.top=Math.max(8, Math.min(y-h-12, innerHeight-h-10))+"px"; }
function hideTip(){ $("#tooltip").style.opacity="0"; }

/* ================= weekly activity chart (2 series, grouped columns) ================= */
function weekChart(){
  const ids = new Set(visibleUserIds(state.me));
  const days=[]; for(let i=6;i>=0;i--) days.push(dOff(-i));
  const doneS = days.map(d=>TASKS.filter(t=>t.done&&t.doneOn===d&&ids.has(t.assignee)).length);
  const logS  = days.map(d=>LOGS.filter(l=>l.date===d&&ids.has(l.user)).length);
  const W=680,H=230,mL=34,mR=10,mT=14,mB=28, iw=W-mL-mR, ih=H-mT-mB;
  const maxV = Math.max(2, ...doneS, ...logS);
  const yMax = Math.ceil(maxV/2)*2;                       // clean even ceiling
  const y = v => mT + ih - (v/yMax)*ih;
  const slot = iw/7, bw = Math.min(22, (slot-18)/2);
  let g = "";
  const ticks = [0, yMax/2, yMax];
  ticks.forEach(v=>{ g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${mL-7}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-variant-numeric="tabular-nums">${v}</text>`; });
  days.forEach((d,i)=>{
    const cx = mL + slot*i + slot/2;
    const lbl = new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short"});
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="${d===TODAY?"var(--ink2)":"var(--muted)"}" ${d===TODAY?'font-weight="700"':""}>${lbl}</text>`;
    [[doneS[i],"var(--s1)"],[logS[i],"var(--s2)"]].forEach(([v,c],si)=>{
      const bx = cx - bw - 1 + si*(bw+2);
      const bh = Math.max(v>0?3:0,(v/yMax)*ih);
      g+=`<path d="M${bx} ${y(0)} v${-Math.max(0,bh-4)} q0 -4 4 -4 h${bw-8} q4 0 4 4 v${Math.max(0,bh-4)} z"
           fill="${c}" opacity="${v>0?1:0}" pointer-events="none" class="wbar"/>`;
    });
    g+=`<rect x="${cx-bw-2}" y="${mT}" width="${bw*2+6}" height="${ih}" fill="transparent" class="whit" data-i="${i}"/>`;
  });
  g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--baseline)" stroke-width="1"/>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:100%; display:block" role="img" aria-label="Team activity, last 7 days">${g}</svg>`,
    days, doneS, logS};
}
function wireWeekChart(host, data){
  host.querySelectorAll(".whit").forEach(r=>{
    r.addEventListener("mousemove",e=>{
      const i=+r.dataset.i;
      const dd=data.days[i], wd=new Date(dd+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long"});
      showTip(`<div class="tt-t">${dd===TODAY?"Today":dd===dOff(-1)?"Yesterday":wd} · ${fmtDate(dd)}</div>
        <div class="tt-row"><span class="sw" style="background:var(--s1)"></span>Tasks completed<b>${data.doneS[i]}</b></div>
        <div class="tt-row"><span class="sw" style="background:var(--s2)"></span>Log entries<b>${data.logS[i]}</b></div>`, e.clientX,e.clientY);
    });

}

/* ================= team summary =================
   One row per person instead of a wall of cards: what they finished, what is
   still open, what is late, and whether they have gone quiet. Everything here
   is worked out from data already loaded — no extra queries. */
const PERIODS = {
  today:   {label:"Today",        from:()=>TODAY},
  week:    {label:"This week",    from:()=>iso(new Date(todayD.getTime()-(todayD.getDay()===0?6:todayD.getDay()-1)*DAY))},
  month:   {label:"This month",   from:()=>iso(new Date(todayD.getFullYear(), todayD.getMonth(), 1))},
  quarter: {label:"This quarter", from:()=>iso(new Date(todayD.getFullYear(), Math.floor(todayD.getMonth()/3)*3, 1))},
  year:    {label:"This year",    from:()=>iso(new Date(todayD.getFullYear(), 0, 1))},
};
const periodFrom = () => (PERIODS[state.period]||PERIODS.month).from();
const periodLabel = () => (PERIODS[state.period]||PERIODS.month).label;
const inPeriod = d => !!d && d >= periodFrom() && d <= TODAY;

function personStats(uid){
  const from = periodFrom();
  const mine = TASKS.filter(t=>t.assignee===uid);
  const done = mine.filter(t=>t.done && inPeriod(t.doneOn||iso(new Date(t.closedAt||Date.now()))));
  const open = mine.filter(t=>!t.done);
  const overdue = open.filter(t=>t.due && t.due<TODAY);
  const spans = done.map(t=>(t.closedAt&&t.startedAt)?(t.closedAt-t.startedAt):null).filter(x=>x!=null);
  const avg = spans.length ? (spans.reduce((a,b)=>a+b,0)/spans.length/DAY) : null;
  const docs = DOCS.filter(d=>d.user===uid && inPeriod(d.date));
  const paused  = open.filter(t=>t.stage===STAGE_PAUSE);
  const working = open.filter(t=>t.stage===STAGE_WIP);
  const notStarted = open.filter(t=>t.stage===STAGE_START);
  /* calendar time minus time the task sat paused - a week waiting on a client
     is not a week of slow work, and the report should not read as if it were */
  const workSpans = done.map(t=>(t.closedAt&&t.startedAt)
      ? Math.max(0,(t.closedAt-t.startedAt)-(t.pausedMs||0)) : null).filter(x=>x!=null);
  const avgWork = workSpans.length ? (workSpans.reduce((a,b)=>a+b,0)/workSpans.length/DAY) : null;
  const lastDates = [...done.map(t=>t.doneOn).filter(Boolean), ...docs.map(d=>d.date),
    ...mine.filter(t=>t.startedAt).map(t=>iso(new Date(t.startedAt)))];
  const last = lastDates.sort().slice(-1)[0] || null;
  const quietDays = last ? Math.round((todayD - new Date(last+"T00:00:00"))/DAY) : null;
  return {done:done.length, open:open.length, overdue:overdue.length, avg, avgWork,
          paused:paused.length, working:working.length, notStarted:notStarted.length,
          pausedTasks:paused, workingTasks:working,
          docs:docs.length, last, quietDays};
}
function personStatus(s){
  if(s.overdue >= 3)         return {cls:"overdue", text:`${s.overdue} overdue`};
  if(s.quietDays === null)   return {cls:"", text:"No activity yet"};
  if(s.quietDays >= 5)       return {cls:"", text:`Quiet ${s.quietDays} days`};
  if(s.overdue > 0)          return {cls:"today", text:`${s.overdue} overdue`};
  if(s.paused > 0 && s.working === 0) return {cls:"today", text:`All ${s.paused} paused`};
  if(s.working > 0)          return {cls:"done", text:"Working"};
  return {cls:"done", text:"On track"};
}
/* what someone is on right now, for the live strip */
function nowState(uid){
  const open = TASKS.filter(t=>t.assignee===uid && !t.done);
  const wip = open.filter(t=>t.stage===STAGE_WIP);
  const pz  = open.filter(t=>t.stage===STAGE_PAUSE);
  if(wip.length) return {kind:"working", cls:"done", label:"Working", task:wip[0], extra:wip.length>1?`+${wip.length-1} more`:""};
  if(pz.length)  return {kind:"paused",  cls:"today", label:"Paused",
                         task:pz[0], extra:pz[0].pauseReason||"no reason given"};
  if(open.length)return {kind:"idle",    cls:"", label:"Not started", task:open[0], extra:`${open.length} waiting`};
  return {kind:"clear", cls:"", label:"Nothing open", task:null, extra:""};
}
/* how long a task has sat where it is */
const daysInStage = t => {
  const since = t.stage===STAGE_PAUSE ? (t.pausedAt || t.startedAt || t.createdAt)
                                      : (t.startedAt || t.createdAt);
  return since ? Math.floor((Date.now()-since)/DAY) : null;
};
/* Only the things a manager should act on. Everything healthy stays off screen -
   that is the whole point of the redesign. */
function attentionItems(){
  const ids = new Set(teamPeople().map(p=>p.id));
  const out = [];
  TASKS.filter(t=>ids.has(t.assignee) && !t.done).forEach(t=>{
    const who = U(t.assignee)?.name || "Someone";
    const d = daysInStage(t);
    if(t.due && t.due < TODAY)
      /* overdue AND paused is the worst combination and the most actionable:
         say both, or the manager cannot tell a slow task from a blocked one */
      out.push({sev:3, who, task:t, icon:"⏰",
        text:`Overdue since ${fmtDate(t.due)} — ${who}${t.stage===STAGE_PAUSE?", paused":""}`,
        sub:t.stage===STAGE_PAUSE ? `${t.title} · ${t.pauseReason||"no reason given"}` : t.title});
    else if(t.stage===STAGE_PAUSE && d!=null && d>=2)
      out.push({sev:2, who, task:t, icon:"⏸",
        text:`Paused ${d} day${d===1?"":"s"} — ${who}`, sub:`${t.title} · ${t.pauseReason||"no reason given"}`});
    else if(t.stage===STAGE_WIP && d!=null && d>=7)
      out.push({sev:1, who, task:t, icon:"🐌",
        text:`In progress ${d} days with no move — ${who}`, sub:t.title});
  });
  /* someone well behind the pace of the month, with the month still running */
  const pace = monthPace(THIS_MONTH);
  teamPeople().forEach(u=>{
    targetsFor(u.id, THIS_MONTH).forEach(t=>{
      const p = pct(t);
      if(pace >= 25 && p < pace - 25)
        out.push({sev:2, who:u.name, person:u.id, icon:"🎯",
          text:`Behind on ${kpiOf(t.kpi)?.name || "a KPI"} — ${u.name}`,
          sub:`${fmtNum(t.achieved)} of ${fmtNum(t.target)} (${p}%) with the month ${pace}% gone`});
    });
  });
  teamPeople().forEach(u=>{
    const s = personStats(u.id);
    if(s.quietDays !== null && s.quietDays >= 5)
      out.push({sev:2, who:u.name, person:u.id, icon:"💤",
        text:`No activity for ${s.quietDays} days — ${u.name}`, sub:`${s.open} task${s.open===1?"":"s"} still open`});
    if(s.quietDays === null && s.open > 0)
      out.push({sev:2, who:u.name, person:u.id, icon:"💤",
        text:`Has never started anything — ${u.name}`, sub:`${s.open} task${s.open===1?"":"s"} assigned`});
  });
  return out.sort((a,b)=>b.sev-a.sev || a.who.localeCompare(b.who));
}

/* ================= KPIs =================
   A KPI is a number to reach in a month. Someone above you sets it; you move
   the achieved figure; everyone above you watches the bar fill. Nobody sets
   their own target — the database refuses it (TRACKER-UPDATE-08.sql). */
const monthKey = d => iso(new Date(d.getFullYear(), d.getMonth(), 1));
const THIS_MONTH = monthKey(todayD);
const monthName = k => new Date(k+"T00:00:00").toLocaleDateString("en-IN",{month:"long", year:"numeric"});
const kpiOf = id => KPIS.find(k=>k.id===id);
const canSetKpiFor = uid => !!state.me && uid !== state.me.id && visibleUserIds(state.me).includes(uid);
const canSetAnyKpi = () => teamPeople().length > 0;
const targetsFor = (uid, month) => KTARGETS.filter(t=>t.user===uid && t.period===(month||state.kpiMonth))
  .sort((a,b)=>(kpiOf(a.kpi)?.name||"").localeCompare(kpiOf(b.kpi)?.name||""));
const pct = t => t.target>0 ? Math.min(999, Math.round(t.achieved/t.target*100)) : 0;
/* ---------------- KRA / appraisal review ---------------- */
const kraCyclesFor = uid => KRA_CYCLES.filter(c=>c.user===uid).sort((a,b)=>b.start.localeCompare(a.start));
const kraOf = cid => KRAS.filter(k=>k.cycle===cid).sort((a,b)=>a.seq-b.seq || a.name.localeCompare(b.name));
const kraItemsOf = kid => KRA_ITEMS.filter(i=>i.kra===kid).sort((a,b)=>a.seq-b.seq);
const kraScoreOf = iid => KRA_SCORES.find(s=>s.item===iid) || null;
/* same rule as a KPI target: never yourself, only someone you oversee */
const canReviewFor = uid => canSetKpiFor(uid);
const PERIOD_TYPE_LABEL = {monthly:"Monthly", quarterly:"Quarterly", annual:"Annual"};
/* the one number that summarises a finished cycle: KRA weight x item weight,
   weighted-averaged into a single 1-5. Items with no weight of their own
   split whatever is left of their KRA's 100% evenly. */
function kraCycleScore(cid){
  const kras = kraOf(cid);
  if(!kras.length) return null;
  let total = 0, sawAny = false;
  for(const k of kras){
    const items = kraItemsOf(k.id);
    if(!items.length) continue;
    const named = items.filter(i=>i.itemWeight!=null);
    const namedSum = named.reduce((a,i)=>a+i.itemWeight,0);
    const rest = items.filter(i=>i.itemWeight==null);
    const restEach = rest.length ? Math.max(0,100-namedSum)/rest.length : 0;
    let kraTotal = 0, kraSaw = false;
    for(const it of items){
      const sc = kraScoreOf(it.id);
      if(!sc || sc.score==null) continue;
      const w = (it.itemWeight!=null ? it.itemWeight : restEach) / 100;
      kraTotal += sc.score * w; kraSaw = true;
    }
    if(kraSaw){ total += kraTotal * (k.weight/100); sawAny = true; }
  }
  return sawAny ? Math.round(total*100)/100 : null;
}
/* how far through the month we are - the fair yardstick for "behind" */
function monthPace(month){
  const start = new Date((month||state.kpiMonth)+"T00:00:00");
  const days  = new Date(start.getFullYear(), start.getMonth()+1, 0).getDate();
  if(month && month !== THIS_MONTH) return 100;          // a past month is fully elapsed
  return Math.round(todayD.getDate() / days * 100);
}
/* the one number that summarises a person: average attainment across their KPIs */
function kpiScore(uid, month){
  const ts = targetsFor(uid, month);
  if(!ts.length) return null;
  return Math.round(ts.reduce((a,t)=>a+Math.min(100,pct(t)),0)/ts.length);
}
const fmtNum = n => (Math.round(n*100)/100).toLocaleString("en-IN");
function kpiBar(t){
  const p = pct(t), pace = monthPace(t.period);
  const cls = p>=100 ? "good" : p>=pace-10 ? "ok" : "behind";
  return `<div class="kpi-bar"><i class="${cls}" style="width:${Math.min(100,p)}%"></i>
    ${t.period===THIS_MONTH?`<b class="pace" style="left:${Math.min(100,pace)}%" title="Where you should be by today"></b>`:""}</div>`;
}

async function saveProgress(t, achieved, note){
  const patch = {achieved, note:note||""};
  const saved = await guard(()=>DB.upd("dat_kpi_targets", t.id, patch));
  if(!saved) return false;
  Object.assign(t, mapKTgt(saved));
  return true;
}

/* one card, used both on the Review tab (reviewer, full edit) and on the
   KPIs tab (the person themselves - read the KRA/target, self-report Actual,
   see the score only once their reviewer finalizes). Which one a given
   viewer gets follows straight from canReviewFor(uid): a manager viewing a
   report is always true, a person viewing themselves is always false. */
function renderKraCard(uid){
  const isReviewer = canReviewFor(uid);
  const cycles = kraCyclesFor(uid);
  if(!state.kraCycle || !cycles.some(c=>c.id===state.kraCycle)) state.kraCycle = cycles[0]?.id || null;
  const cycle = cycles.find(c=>c.id===state.kraCycle) || null;
  const kras = cycle ? kraOf(cycle.id) : [];
  const totalWeight = kras.reduce((a,k)=>a+k.weight,0);
  const overall = cycle && cycle.finalized ? kraCycleScore(cycle.id) : null;

  return `<div class="card card-pad" data-kra-uid="${uid}" style="margin-top:16px">
    <div class="card-head" style="align-items:flex-start">
      <div><h3>Appraisal${cycle?` &middot; ${esc(cycle.label)}`:""}</h3>
        <div class="sub">${cycle
          ? `${esc(PERIOD_TYPE_LABEL[cycle.type]||cycle.type)} &middot; ${esc(fmtDate(cycle.start))} &ndash; ${esc(fmtDate(cycle.end))}${
              cycle.finalized?` &middot; finalized${cycle.finalizedAt?" "+esc(fmtWhen(cycle.finalizedAt)):""}`:" &middot; in progress"}`
          : (isReviewer?"No review cycle set up yet":"Your reviewer hasn't set up a review cycle yet.")}</div></div>
      <div class="spacer"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${cycles.length>1?`<select id="kraCycleSel" style="padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:12.5px">
          ${cycles.map(c=>`<option value="${c.id}" ${c.id===state.kraCycle?"selected":""}>${esc(c.label)}</option>`).join("")}</select>`:""}
        ${isReviewer?`<button class="btn sm" id="kraNewCycle">＋ New cycle</button>`:""}
      </div>
    </div>
    ${!cycle ? "" : `
    ${overall!=null?`<div class="chip done" style="margin-bottom:10px;font-size:13px">Overall score: <b>${overall.toFixed(2)} / 5</b></div>`
      :(cycle.finalized?`<div class="sub" style="margin-bottom:10px">Not every item has a score yet.</div>`:"")}
    ${kras.map(k=>{
      const items = kraItemsOf(k.id);
      return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <b style="font-size:13.5px">${esc(k.name)}</b>
          ${isReviewer?`<input type="number" min="0" max="100" step="0.5" value="${k.weight}" data-krawt="${k.id}"
             style="width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px" title="Weight %">`
           :`<span class="chip">${fmtNum(k.weight)}%</span>`}
          <span class="spacer"></span>
          ${isReviewer?`<button class="mini-btn" data-kraadditem="${k.id}">＋ Item</button>
            <button class="mini-btn" data-kradelkra="${k.id}">Remove</button>`:""}
        </div>
        <div style="overflow-x:auto"><table class="simple">
          <thead><tr><th>Measure</th><th>Standard</th><th>Target</th><th>Actual</th><th style="width:150px">Score</th>${isReviewer?"<th></th>":""}</tr></thead>
          <tbody>${items.map(it=>{
            const sc = kraScoreOf(it.id);
            const canSeeScore = isReviewer || cycle.finalized;
            return `<tr>
              <td style="min-width:160px">${esc(it.measure)}${it.itemWeight!=null?`<div class="sub">${fmtNum(it.itemWeight)}%</div>`:""}</td>
              <td style="min-width:170px;color:var(--ink2);font-size:12.5px">${esc(it.standard||"")}</td>
              <td style="min-width:120px;font-size:12.5px">${it.targetValue!=null?`${fmtNum(it.targetValue)}${it.targetUnit?" "+esc(it.targetUnit):""}${it.cadence?` / ${esc(it.cadence)}`:""}`:"—"}</td>
              <td style="min-width:170px">
                <div style="display:flex;gap:4px;flex-wrap:wrap">
                <input data-kraav="${it.id}" type="number" step="0.01" placeholder="value" value="${it.actualValue??""}"
                  style="width:76px;padding:5px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px">
                <input data-kraan="${it.id}" placeholder="note" value="${esc(it.actualNote)}"
                  style="width:110px;padding:5px 7px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px">
                <button class="mini-btn" data-krasaveactual="${it.id}">Save</button>
                </div>
                ${it.actualAt?`<div class="sub" style="margin-top:2px">by ${esc(U(it.actualBy)?.name||"—")} &middot; ${esc(relDay(iso(new Date(it.actualAt))))}</div>`:""}
              </td>
              <td>${!canSeeScore?`<span class="sub">Awaiting review</span>`
                : isReviewer
                  ? `<div style="display:flex;gap:4px;flex-wrap:wrap">
                       <select data-krascore="${it.id}" style="padding:5px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px">

      </div>`;}).join("")}
    ${isReviewer?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn sm" id="kraAddKra">＋ Add KRA</button>
        <span class="sub">${fmtNum(totalWeight)}% of 100% weighted so far</span>
        <span class="spacer"></span>
        <button class="btn sm ${cycle.finalized?"":"primary"}" id="kraFinalize">${cycle.finalized?"Reopen":"Finalize review"}</button>
      </div>`:""}
    `}
  </div>`;
}

function wireKraCard(){
  const card = document.querySelector("[data-kra-uid]"); if(!card) return;
  const uid = card.dataset.kraUid;
  const sel = $("#kraCycleSel"); if(sel) sel.addEventListener("change", e=>{ state.kraCycle=e.target.value; render(); });
  const nc = $("#kraNewCycle"); if(nc) nc.addEventListener("click", ()=>openKraCycleModal(uid));
  const ak = $("#kraAddKra"); if(ak) ak.addEventListener("click", ()=>{ if(state.kraCycle) openKraModal(state.kraCycle); });
  const fin = $("#kraFinalize"); if(fin) fin.addEventListener("click", ()=>{
    const c = KRA_CYCLES.find(x=>x.id===state.kraCycle); if(!c) return;
    if(c.finalized){ toggleKraFinalize(c); return; }
    const kras = kraOf(c.id);
    const allScored = kras.length && kras.every(k=>{ const items=kraItemsOf(k.id);
      return items.length && items.every(it=>{ const s=kraScoreOf(it.id); return s&&s.score!=null; }); });
    if(!allScored && !confirm("Not every item has a score yet. Finalize anyway?")) return;
    toggleKraFinalize(c);
  });
  document.querySelectorAll("[data-krawt]").forEach(el=>el.addEventListener("change", ()=>{
    const kra=KRAS.find(k=>k.id===el.dataset.krawt); if(kra) saveKraWeight(kra, parseFloat(el.value)||0); }));
  document.querySelectorAll("[data-kraadditem]").forEach(el=>el.addEventListener("click", ()=>openKraItemModal(el.dataset.kraadditem)));
  document.querySelectorAll("[data-kradelkra]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Remove this KRA and all its measures?")) deleteKra(el.dataset.kradelkra); }));
  document.querySelectorAll("[data-kradelitem]").forEach(el=>el.addEventListener("click", ()=>{
    if(confirm("Remove this measure?")) deleteKraItem(el.dataset.kradelitem); }));
  document.querySelectorAll("[data-krasaveactual]").forEach(el=>el.addEventListener("click", ()=>{
    const id=el.dataset.krasaveactual; const item=KRA_ITEMS.find(i=>i.id===id); if(!item) return;
    const vEl=document.querySelector(`[data-kraav="${id}"]`), nEl=document.querySelector(`[data-kraan="${id}"]`);
    const v=vEl.value.trim();
    saveKraActual(item, v===""?null:parseFloat(v), nEl.value.trim());
  }));
  document.querySelectorAll("[data-krasavescore]").forEach(el=>el.addEventListener("click", ()=>{
    const id=el.dataset.krasavescore;
    const sEl=document.querySelector(`[data-krascore="${id}"]`), nEl=document.querySelector(`[data-krascorenote="${id}"]`);
    saveKraScore(id, sEl.value, nEl.value.trim());
  }));
}

async function saveKraWeight(kra, weight){
  const saved = await guard(()=>DB.upd("dat_kras", kra.id, {weight}));
  if(saved){ Object.assign(kra, mapKra(saved)); render(); }
}
async function saveKraActual(item, value, note){
  const patch = {actual_value: (value===null||value===undefined||isNaN(value))?null:value, actual_note: note||""};
  const saved = await guard(()=>DB.upd("dat_kra_items", item.id, patch), "Saved ✓");
  if(saved){ Object.assign(item, mapKraItem(saved)); render(); }
}
async function saveKraScore(itemId, score, note){
  const row = await guard(()=>sb.from("dat_kra_scores")
    .upsert({item_id:itemId, score: score===""?null:parseInt(score,10), score_note:note||""})
    .select().single().then(x=>{ if(x.error) throw x.error; return x.data; }), "Score saved ✓");
  if(!row) return;
  const idx = KRA_SCORES.findIndex(s=>s.item===itemId);
  const mapped = mapKraScore(row);
  if(idx>=0) KRA_SCORES[idx]=mapped; else KRA_SCORES.push(mapped);
  render();
}
async function toggleKraFinalize(cycle){
  const saved = await guard(()=>DB.upd("dat_kra_cycles", cycle.id, {finalized: !cycle.finalized}),
    cycle.finalized?"Reopened":"Finalized ✓");
  if(saved) Object.assign(cycle, mapKraCycle(saved));
  render();
}
async function deleteKra(kraId){
  if(await guard(()=>DB.del("dat_kras", kraId).then(()=>true))===null) return;
  KRAS = KRAS.filter(k=>k.id!==kraId);
  KRA_ITEMS = KRA_ITEMS.filter(i=>i.kra!==kraId);
  render();
}
async function deleteKraItem(itemId){
  if(await guard(()=>DB.del("dat_kra_items", itemId).then(()=>true))===null) return;
  KRA_ITEMS = KRA_ITEMS.filter(i=>i.id!==itemId);
  render();
}

/* Set one target across a whole team in one go, which is how targets actually
   get handed out — then adjust the odd individual afterwards. */
function openKpiModal(existing){
  const me=state.me, team=teamPeople();
  if(!team.length){ toast("Nobody reports to you yet."); return; }
  const editing = !!existing;
  const preUser = existing ? [existing.user] : team.map(u=>u.id);
  modal(`<div class="modal wide">
    <h3>${editing?"Edit target":"Set targets"}</h3>
    <div class="msub">${editing
      ? `Change the target or correct the achieved figure for ${esc(U(existing.user)?.name||"this person")}.`
      : "Pick the people, pick what is being measured, and give the number for the month. Everyone selected gets the same target — you can adjust individuals afterwards."}</div>
    <form id="kpiForm" class="f-grid">
      <div class="f-grid f-2">
        <div class="field"><label>What is being measured</label>
          <select id="kKpi" required>${KPIS.map(k=>`<option value="${k.id}" ${existing&&existing.kpi===k.id?"selected":""}>${esc(k.name)}${k.unit?` (${esc(k.unit)})`:""}</option>`).join("")}
            <option value="__new">＋ Add a new KPI…</option></select></div>
        <div class="field"><label>Month</label>
          <select id="kMonth">${[0,1,2].map(i=>{const m=monthKey(new Date(todayD.getFullYear(),todayD.getMonth()-i+1,1));
            return `<option value="${m}" ${((existing?existing.period:THIS_MONTH)===m)?"selected":""}>${esc(monthName(m))}</option>`;}).join("")}</select></div>
      </div>
      <div class="f-grid f-2" id="kNewWrap" style="display:none">
        <div class="field"><label>New KPI name</label><input id="kNewName" maxlength="40" placeholder="e.g. Vehicles serviced"></div>
        <div class="field"><label>Unit</label><input id="kNewUnit" maxlength="16" placeholder="e.g. vehicles"></div>
      </div>
      <div class="f-grid f-2">
        <div class="field"><label>Target for the month</label>
          <input type="number" step="0.01" min="0.01" id="kTarget" required value="${existing?existing.target:""}" placeholder="e.g. 40"></div>
        ${editing?`<div class="field"><label>Achieved so far</label>
          <input type="number" step="0.01" min="0" id="kAch" value="${existing.achieved}"></div>`:`<div></div>`}
      </div>
      ${editing?"":`<div class="field"><label>Who gets this target</label>
        <div style="display:flex;gap:8px;margin-bottom:6px">
          <button type="button" class="mini-btn" id="kAll">Select all</button>
          <button type="button" class="mini-btn" id="kNone">Clear</button></div>
        <div class="check-list" style="max-height:200px;overflow-y:auto">
          ${team.map(u=>`<label><input type="checkbox" class="kWho" value="${u.id}" ${preUser.includes(u.id)?"checked":""}>
            ${esc(u.name)} <span style="color:var(--muted);font-size:11.5px">— ${esc(titleOf(u))}</span></label>`).join("")}
        </div></div>`}
      <div class="m-actions">
        ${editing?`<button type="button" class="btn danger sm" id="kDel">Remove target</button>`:""}
        <div class="grow"></div>
        <button type="button" class="btn" id="kCancel">Cancel</button>
        <button class="btn primary" type="submit">${editing?"Save":"Set targets"}</button></div>
    </form></div>`);
  $("#kKpi").addEventListener("change",()=>{
    $("#kNewWrap").style.display = $("#kKpi").value==="__new" ? "grid" : "none"; });
  const all=$("#kAll"), none=$("#kNone");
  if(all)  all.addEventListener("click",()=>document.querySelectorAll(".kWho").forEach(c=>c.checked=true));
  if(none) none.addEventListener("click",()=>document.querySelectorAll(".kWho").forEach(c=>c.checked=false));
  $("#kCancel").addEventListener("click",closeModal);
  const del=$("#kDel"); if(del) del.addEventListener("click", async ()=>{
    if(await guard(()=>DB.del("dat_kpi_targets", existing.id).then(()=>true))===null) return;
    const i=KTARGETS.findIndex(x=>x.id===existing.id); if(i>-1) KTARGETS.splice(i,1);
    closeModal(); toast("Target removed"); render();
  });
  $("#kpiForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const target = parseFloat($("#kTarget").value);
    if(!(target>0)){ toast("The target has to be more than zero."); return; }
    const month = $("#kMonth").value;

    let kpiId = $("#kKpi").value;
    if(kpiId === "__new"){
      const nm=$("#kNewName").value.trim();
      if(!nm){ toast("Give the new KPI a name."); return; }
      const made = await guard(()=>DB.ins("dat_kpis",{name:nm, unit:$("#kNewUnit").value.trim(), created_by:me.id}));
      if(!made) return;
      KPIS.push(mapKpi(made)); KPIS.sort((a,b)=>a.name.localeCompare(b.name));
      kpiId = made.id;
    }

    if(editing){
      const patch = {target, achieved: parseFloat($("#kAch").value)||0};
      const saved = await guard(()=>DB.upd("dat_kpi_targets", existing.id, patch));
      if(!saved) return;
      Object.assign(existing, mapKTgt(saved));
      closeModal(); toast("Target updated ✓"); render(); return;
    }

    const who=[...document.querySelectorAll(".kWho:checked")].map(c=>c.value);
    if(!who.length){ toast("Pick at least one person."); return; }
    let made=0, skipped=0;
    for(const uid of who){
      const already = KTARGETS.find(t=>t.user===uid && t.kpi===kpiId && t.period===month);
      if(already){
        const saved = await guard(()=>DB.upd("dat_kpi_targets", already.id, {target}));
        if(saved){ Object.assign(already, mapKTgt(saved)); made++; } else skipped++;
      } else {
        const saved = await guard(()=>DB.ins("dat_kpi_targets",
          {kpi_id:kpiId, user_id:uid, period:month, target, set_by:me.id}));
        if(saved){ KTARGETS.push(mapKTgt(saved)); made++; } else skipped++;
      }
    }
    closeModal();
    toast(made ? `Target set for ${made} ${made===1?"person":"people"} ✓${skipped?` (${skipped} refused)`:""}`
               : "Nothing could be set — check you oversee those people.");
    render();
  });
}

/* ================= employee review =================
   Everything known about one person in one place, for the period you pick:
   what they finished, what is stuck, how they work, their KPIs, their files.
   Built for the conversation you have WITH them, so every number is one they
   can check for themselves. */
function reviewFor(id){
  const s = personStats(id);
  const from = periodFrom();
  const mine = TASKS.filter(t=>t.assignee===id);
  const closedIn = mine.filter(t=>t.done && inPeriod(t.doneOn));
  const addedIn  = mine.filter(t=>t.createdAt && iso(new Date(t.createdAt)) >= from);
  const pausedNow = mine.filter(t=>!t.done && t.stage===STAGE_PAUSE);
  const everPaused = closedIn.filter(t=>t.pausedMs>0);
  const pausedDays = (everPaused.reduce((a,t)=>a+t.pausedMs,0)
    + pausedNow.reduce((a,t)=>a+(t.pausedAt?Date.now()-t.pausedAt:0)+(t.pausedMs||0),0)) / DAY;
  const onTime = closedIn.filter(t=>t.due && t.doneOn && t.doneOn <= t.due).length;
  const hadDue = closedIn.filter(t=>t.due).length;
  return {s, mine, closedIn, addedIn, pausedNow, pausedDays,
          onTime, hadDue, onTimePct: hadDue ? Math.round(onTime/hadDue*100) : null};
}
/* a small bar per day, so a quiet stretch is visible rather than inferred */
function activityStrip(id, days){
  const n = days || 30;
  const cells = [];
  let max = 1;
  for(let i=n-1;i>=0;i--){
    const d = dOff(-i);
    const done = TASKS.filter(t=>t.assignee===id && t.done && t.doneOn===d).length;
    const started = TASKS.filter(t=>t.assignee===id && t.startedAt && iso(new Date(t.startedAt))===d).length;
    const v = done*2 + started;
    max = Math.max(max, v);
    cells.push({d, v, done, started});
  }
  return `<div class="act-strip">${cells.map(c=>`
    <i style="height:${c.v?Math.max(12, Math.round(c.v/max*100))+"%":"3px"};
       background:${c.v?"var(--accent)":"var(--grid)"}"
       title="${esc(fmtDate(c.d))} — ${c.done} done, ${c.started} started"></i>`).join("")}</div>
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:3px">
      <span>${esc(fmtDate(dOff(-(n-1))))}</span><span>today</span></div>`;
}

      <td>${(t.closedAt&&t.startedAt)?((Math.max(0,(t.closedAt-t.startedAt)-(t.pausedMs||0))/DAY).toFixed(1)):""}</td>
      <td>${t.stage===STAGE_PAUSE?esc(t.pauseReason||"not given"):""}</td></tr>`).join("")}</tbody></table>`
      :`<div class="none">No open tasks and nothing closed in this period.</div>`}
  </section>`;
}
/* open a print window and hand it to the browser's Save as PDF */
function printHtml(title, css, body){
  const w = window.open("", "_blank");
  if(!w){ toast("Allow pop-ups for this site to download the PDF."); return false; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8">
    <title>${esc(title)}</title><style>${css}</style></head><body>${body}</body></html>`);
  w.document.close();
  let printed = false;
  const go = () => { if(printed) return; printed = true; try{ w.focus(); w.print(); }catch(_){} };
  w.onload = go;
  setTimeout(go, 700);
  toast("Choose “Save as PDF” in the print box");
  return true;
}

/* ================= the downloadable report =================
   Everyone below you, for the chosen period, in one file. Built here in the
   browser from data already loaded, so it needs no server and no extra
   permissions — you can only ever export what you can already see. */
const XLSX_CDN = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=XLSX_CDN;
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("Spreadsheet library did not load"));
    s.onerror=()=>rej(new Error("Could not reach the spreadsheet library — check the internet connection"));
    document.head.appendChild(s);
  });
}
function reportData(){
  const from = periodFrom(), people = teamPeople();
  const ids = new Set(people.map(p=>p.id));
  const nameOf = id => U(id)?.name || "—";
  const pipeName = pid => PIPES.find(p=>p.id===pid)?.name || "—";

  const summary = people.map(u=>{ const s=personStats(u.id), st=personStatus(s);
    return {"Name":u.name, "Job role":titleOf(u), "Department":u.dept, "Level":LEVELS[u.level].label,
      "Reports to":u.mgr?nameOf(u.mgr):"—",
      "Tasks completed":s.done, "Still open":s.open, "In progress":s.working,
      "Paused":s.paused, "Not started":s.notStarted, "Overdue":s.overdue,
      "Avg working days": s.avgWork!=null ? Number(s.avgWork.toFixed(1)) : "",
      "Avg calendar days": s.avg!=null ? Number(s.avg.toFixed(1)) : "",
      "KPI attainment %": kpiScore(u.id, monthKey(new Date(TODAY+"T00:00:00"))) ?? "",
      "Documents":s.docs,
      "Last active": s.last || "never", "Status":st.text}; });

  const tasks = TASKS.filter(t=>ids.has(t.assignee))
    .filter(t=>t.done ? inPeriod(t.doneOn) : true)
    .sort((a,b)=>nameOf(a.assignee).localeCompare(nameOf(b.assignee)) || (a.due||"9").localeCompare(b.due||"9"))
    .map(t=>({"Person":nameOf(t.assignee), "Task":t.title, "Pipeline":pipeName(t.pipe), "Stage":t.stage,
      "Priority":t.pr, "Due":t.due||"", "Done":t.done?"Yes":"No", "Completed on":t.doneOn||"",
      "Started":t.startedAt?iso(new Date(t.startedAt)):"",
      "Calendar days": (t.closedAt&&t.startedAt) ? Number(((t.closedAt-t.startedAt)/DAY).toFixed(1)) : "",
      "Paused days": t.pausedMs ? Number((t.pausedMs/DAY).toFixed(1)) : 0,
      "Working days": (t.closedAt&&t.startedAt)
        ? Number((Math.max(0,(t.closedAt-t.startedAt)-(t.pausedMs||0))/DAY).toFixed(1)) : "",
      "Pause reason": t.stage===STAGE_PAUSE ? (t.pauseReason||"not given") : "",
      "Created by":nameOf(t.createdBy)}));

  /* KPI attainment for the month the period ends in */
  const kmonth = monthKey(new Date(TODAY+"T00:00:00"));
  const kpiRows = people.flatMap(u=>targetsFor(u.id, kmonth).map(t=>{
    const k = kpiOf(t.kpi);
    return {"Person":u.name, "KPI":k?.name||"", "Unit":k?.unit||"",
      "Target":t.target, "Achieved":t.achieved,
      "Attainment %": t.target>0 ? Number((t.achieved/t.target*100).toFixed(1)) : 0,
      "Month should be % gone": monthPace(kmonth),
      "Set by": nameOf(t.setBy), "Their note": t.note,
      "Last updated": t.updatedAt ? iso(new Date(t.updatedAt)) : ""};
  }));

  /* everything currently stuck, so the report answers "what is blocked?" */
  const blocked = TASKS.filter(t=>ids.has(t.assignee) && !t.done && t.stage===STAGE_PAUSE)
    .sort((a,b)=>(daysInStage(b)||0)-(daysInStage(a)||0))
    .map(t=>({"Person":nameOf(t.assignee), "Task":t.title, "Board":pipeName(t.pipe),
      "Paused for (days)": daysInStage(t) ?? "", "Reason": t.pauseReason||"not given",
      "Due":t.due||"", "Priority":t.pr}));

  const daily = blocked;   // the "what is stuck" sheet replaced the daily log

  const docs = DOCS.filter(d=>ids.has(d.user) && inPeriod(d.date))
    .sort((a,b)=>b.ts-a.ts)
    .map(d=>({"Date":d.date, "Person":nameOf(d.user), "Title":d.title||"", "File":d.file,
      "Size (KB)":Math.round(d.size/1024), "Note":d.note||""}));

  /* day by day, so a quiet stretch is impossible to miss */
  const days=[]; for(let d=from; d<=TODAY; d=iso(new Date(new Date(d+"T00:00:00").getTime()+DAY))){
    if(days.length>400) break; days.push(d); }
  const perDay = days.map(d=>{ const row={"Date":d};
    people.forEach(u=>{
      const done  = TASKS.filter(t=>t.assignee===u.id && t.done && t.doneOn===d).length;
      const start = TASKS.filter(t=>t.assignee===u.id && t.startedAt && iso(new Date(t.startedAt))===d).length;
      row[u.name] = (done||start) ? `${done} done / ${start} started` : "";
    });
    return row; });

  return {summary, tasks, daily, docs, perDay, kpiRows, people,
          from, to:TODAY, label:periodLabel()};
}
async function downloadReport(kind){
  const me = state.me;
  const data = reportData();
  if(!data.people.length){ toast("Nobody reports to you yet — nothing to report on."); return; }
  const stamp = `${data.from}_to_${data.to}`;
  const base  = `WeVois-team-report_${stamp}`;

  if(kind === "xlsx"){
    toast("Building the spreadsheet…");
    let XLSX;
    try{ XLSX = await loadXLSX(); }
    catch(e){ openInfoModal("Could not build the Excel file", esc(e.message||String(e))); return; }
    const wb = XLSX.utils.book_new();
    const add = (rows, name) => {
      if(!rows.length) rows = [{" ":"Nothing in this period"}];
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = Object.keys(rows[0]).map(k=>({wch:Math.min(42,
        Math.max(k.length+2, ...rows.slice(0,200).map(r=>String(r[k]??"").length+2)))}));
      ws["!autofilter"] = {ref: ws["!ref"]};
      ws["!freeze"] = {xSplit:0, ySplit:1};
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    add(data.summary, "Summary");
    add(data.tasks,   "Tasks");
    add(data.kpiRows, "KPIs");
    add(data.daily,   "Paused & blocked");
    add(data.docs,    "Documents");
    add(data.perDay,  "Day by day");
    /* then one sheet per person - their own tasks for the period - so a
       manager can hand any one sheet to that person without filtering */
    const used = new Set(wb.SheetNames.map(n=>n.toLowerCase()));
    data.people.forEach(u=>{
      let nm = u.name.replace(/[\\\/\?\*\[\]:]/g," ").trim().slice(0,28) || "Person";
      let k = nm, i = 2;
      while(used.has(k.toLowerCase())) k = `${nm.slice(0,25)} ${i++}`;
      used.add(k.toLowerCase());
      add(data.tasks.filter(r=>r.Person===u.name).map(({Person, ...r})=>r), k);
    });
    XLSX.writeFile(wb, base + ".xlsx");
    toast("Report downloaded ✓");
    return;
  }

  /* PDF: the whole team in one file — a summary page first, then every
     person's full review on its own page, so nobody has to be downloaded
     one at a time from the Review screen. */
  const tbl = (title, rows, cols) => !rows.length ? "" : `
    <h2>${esc(title)}</h2>
    <table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(String(r[c]??""))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const body = `
    <section class="person">
    <h1>WeVois — team activity report</h1>
    <div class="meta">${esc(data.label)} · ${esc(fmtDateLong(data.from))} to ${esc(fmtDateLong(data.to))}
      &nbsp;|&nbsp; ${data.people.length} people &nbsp;|&nbsp; prepared for ${esc(me.name)} (${esc(titleOf(me))})
      &nbsp;|&nbsp; generated ${esc(new Date().toLocaleString("en-IN"))}</div>
    ${tbl("Summary — one row per person", data.summary,
      ["Name","Job role","Department","Reports to","Tasks completed","Still open","Paused","Overdue","Avg working days","KPI attainment %","Last active","Status"])}
    ${tbl("Paused & blocked right now", data.daily, ["Person","Task","Board","Paused for (days)","Reason","Due","Priority"])}
    <div class="none" style="margin-top:14px">Each person's full review follows — one page per person, in the order above.</div>
    </section>
    ${data.people.map(u=>reviewSectionHtml(u.id)).join("")}`;
  printHtml(base, REVIEW_CSS.replace("@page{size:A4;margin:13mm}","@page{size:A4 landscape;margin:12mm}"), body);
}

/* ================= Daily Update — one day, who moved what =================
   Leadership asked to see the day's work day by day: on 20 August this screen
   shows 20 August; the next morning it opens on 21 August, and 20 August is
   one click back. It reads dat_task_events — the history the database already
   writes on every change — for the chosen day only. So there is nothing extra
   to fill in, and nothing anybody can forget to fill in. Row-level security
   decides what comes back: a manager sees their own branch, a VP theirs, the
   CEO everyone. The browser does no filtering the database has not already done. */
const UPCACHE = {};                    // date -> that day's events, so stepping back is instant
let upToken = 0, upTimer = null;

async function loadDayEvents(date){
  if(UPCACHE[date]) return UPCACHE[date];
  const from = new Date(date+"T00:00:00");            // local midnight, not UTC midnight
  const to   = new Date(from.getTime()+DAY);
  const {data,error} = await sb.from("dat_task_events").select("*")
    .gte("created_at", from.toISOString()).lt("created_at", to.toISOString())
    .order("created_at",{ascending:true}).limit(3000);
  if(error) throw error;
  const rows = (data||[]).map(mapTEv).sort((a,b)=>a.ts-b.ts || a.seq-b.seq);
  UPCACHE[date] = rows;
  return rows;
}
/* A colleague changing something while this screen is open makes the cached
   day wrong. Drop it, and repaint if that is the day being looked at. */
function upCacheDrop(createdAt){
  if(!createdAt) return;
  const d = iso(new Date(createdAt));
  delete UPCACHE[d];
  if(state.me && state.view==="dailyup" && (state.upDate||TODAY)===d && !$("#overlayHost").innerHTML){
    clearTimeout(upTimer);
    upTimer = setTimeout(()=>{ if(state.view==="dailyup") upFill(state.upDate||TODAY); }, 900);
  }
  if(state.me && state.view==="myday" && (state.mdDate||TODAY)===d && !$("#overlayHost").innerHTML){
    clearTimeout(upTimer);
    upTimer = setTimeout(()=>{ if(state.view==="myday") myDayFill(state.mdDate||TODAY); }, 900);
  }
}

const upDayWord = d => d===TODAY ? "Today" : d===dOff(-1) ? "Yesterday"
  : (n => n>1 ? n+" days ago" : fmtDate(d))(Math.round((todayD - new Date(d+"T00:00:00"))/DAY));
const upTime = ts => new Date(ts).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});

function upSet(d){ if(!d) return; state.upDate = d > TODAY ? TODAY : d; renderDailyUp(); }
function upGo(step){
  const base = new Date((state.upDate||TODAY)+"T00:00:00");
  upSet(iso(new Date(base.getTime()+step*DAY)));
}

/* one line per change, written for someone reading a person's day - so no name
   in front of it, unlike the timeline on the task itself */
function upLine(e){
  const b = s => `<b style="color:var(--ink)">${esc(s??"—")}</b>`;
  switch(e.kind){
    case "created":  return `Created it in ${b(e.to)}`;
    case "moved":    return `Moved ${b(e.from)} → ${b(e.to)}`;
    case "assigned": return `Reassigned ${e.from?`from ${b(e.from)} `:""}to ${b(e.to)}`;
    case "priority": return `Changed priority ${b(e.from)} → ${b(e.to)}`;
    case "due":      return e.to ? `Set the due date to ${b(fmtDate(e.to))}` : "Removed the due date";
    case "renamed":  return `Renamed it from ${b(e.from)}`;
    case "edited":   return "Edited the notes";
    case "paused":   return `Paused it — ${b(e.note||"no reason given")}`;
    case "resumed":  return `Resumed it → ${b(e.to)}`;
    case "done":     return "Marked it done";
    case "reopened": return "Reopened it";
    case "comment":  return `Added a note${e.note?`: ${esc(e.note.length>110?e.note.slice(0,110)+"…":e.note)}`:""}`;
    default:         return "Made a change";
  }
}
const upIcon = evs =>
    evs.some(e=>e.kind==="done")     ? "✅"
  : evs.some(e=>e.kind==="reopened") ? "↩️"
  : evs.some(e=>e.kind==="paused")   ? "⏸️"
  : evs.some(e=>e.kind==="created")  ? "✨"
  : evs.some(e=>e.kind==="moved"||e.kind==="resumed") ? "➡️"
  : evs.some(e=>e.kind==="comment")  ? "💬" : "✏️";

/* The day's changes, keyed by the task they happened to. Two tidying rules,
   both deliberate:
   - an event whose actor no longer exists is dropped, so the counts on the
     tiles match the lines actually on screen;
   - moving a card Pause -> Done writes 'resumed' AND 'done' in one transaction.
     One action by one person; printing both reads like two. */
function upByTask(evs){
  const rows = evs.filter((e,i)=>{
    if(!e.actor) return false;
    if(e.kind!=="resumed") return true;
    const n = evs[i+1];
    return !(n && n.kind==="done" && n.task===e.task && n.actor===e.actor && n.ts-e.ts < 3000);
  });
  const m = new Map();
  rows.forEach(e=>{ if(!m.has(e.task)) m.set(e.task,[]); m.get(e.task).push(e); });
  return m;
}
/* One update card: the task as it stands, and underneath it whatever happened
   to it on the day being looked at. Used inside the person layer. */
function upCard(t, evs, colUser, dayWord, actsHTML=""){
  const p = PIPES.find(x=>x.id===t.pipe);
  return `<div class="uc ${evs.length?"hot":""} ${t.done?"done-card":""}"
       style="--pc:var(--s${p?p.color:1})" data-upltask="${esc(t.id)}">
    <div class="tt">${evs.length?`<span class="hd">${upIcon(evs)}</span> `:""}${esc(t.title)}</div>
    ${t.stage===STAGE_PAUSE?`<div class="pz">⏸️ ${esc(t.pauseReason||"no reason given")}</div>`:""}
    <div class="meta">
      ${t.done?"":`<span class="stage-pill ${esc(t.stage.replace(/\s/g,""))}">${esc(t.stage)}</span>`}
      ${prChip(t.pr)}${dueChip(t)}
      ${p?`<span class="bd">${esc(p.name)}</span>`:""}
    </div>
    ${evs.length?`<div class="upd">
      <div class="uh">${evs.length} update${evs.length!==1?"s":""} ${esc(dayWord)}</div>
      ${evs.map(e=>`<div class="l"><span class="tm">${esc(upTime(e.ts))}</span>
        <span>${upLine(e)}${e.actor!==colUser?` <i>— by ${esc(U(e.actor)?U(e.actor).name:"someone")}</i>`:""}</span></div>`).join("")}
    </div>`:""}
    ${actsHTML}
  </div>`;
}

/* ---- one person, one day: the four lists a manager asked for ----
   1. LOGGED   - tasks that were put on the board that day (by anyone, for them)
   2. UPDATED  - tasks that moved: stage changes, pauses, due dates, notes…
   3. OPEN     - overdue, due today, and the rest still pending - as they stand
                 NOW, because the board has no memory of what was open on a
                 past date, only of what happened on it
   4. CLOSED   - tasks marked done that day, and which of them were logged the
                 very same day, so "what got finished" is one glance.
   Everything comes from TASKS, LOGS and the day's dat_task_events, which the
   database has already filtered to this person's branch. */
const taskDay = t => t.createdAt ? iso(new Date(t.createdAt)) : null;
const byDue   = (a,b) => (a.due||"9").localeCompare(b.due||"9") || (a.createdAt||0)-(b.createdAt||0);
function upPersonDay(uid, date, byTask){
  const mine  = TASKS.filter(t=>t.assignee===uid);
  const evsOf = t => byTask.get(t.id) || [];
  const logged  = mine.filter(t=>taskDay(t)===date).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const updated = mine.filter(t=>evsOf(t).some(e=>e.kind!=="created"))
    .sort((a,b)=>{ const ea=evsOf(a), eb=evsOf(b); return eb[eb.length-1].ts - ea[ea.length-1].ts; });
  const closed  = mine.filter(t=>t.done && t.doneOn===date).sort((a,b)=>(a.closedAt||0)-(b.closedAt||0));
  const sameDay = closed.filter(t=>taskDay(t)===date);
  const open    = mine.filter(t=>!t.done);
  const overdue = open.filter(t=>t.due && t.due<TODAY).sort(byDue);
  const dueToday= open.filter(t=>t.due===TODAY).sort(byDue);
  const pending = open.filter(t=>!t.due || t.due>TODAY).sort(byDue);
  const paused  = open.filter(t=>t.stage===STAGE_PAUSE);
  const notes   = LOGS.filter(l=>l.user===uid && l.date===date).sort((a,b)=>a.id.localeCompare(b.id));
  const evs     = mine.flatMap(evsOf);
  const last    = evs.reduce((m,e)=>e.ts>m?e.ts:m, 0);
  return {logged, updated, closed, sameDay, open, overdue, dueToday, pending, paused, notes,
          n:evs.length, last};
}

/* One person, one card on the team grid: the four numbers, the bell, and a
   line saying whether they went quiet. The whole card opens their day. */
function upPersonCard(u, d, dayWord, isMe){
  const quiet = d.n===0, idle = quiet && !d.open.length;
  const num = (v, lbl, cls) => `<div class="n ${v?cls||"":"zero"}"><b>${v}</b><span>${lbl}</span></div>`;
  const foot = idle ? `<span class="q">Nothing on the board</span>`
    : quiet ? `${d.open.length} open${d.paused.length?` · ${d.paused.length} paused`:""} · <span class="q">nothing logged ${esc(dayWord)}</span>`
    : `${d.open.length} open${d.paused.length?` · ${d.paused.length} paused`:""} · last update ${esc(upTime(d.last))}`;
  return `<button class="pcard ${idle?"idle":quiet?"quiet":""}" data-upwho="${esc(u.id)}" type="button">
    <div class="pcard-head">
      ${avatar(u,"md")}
      <div style="min-width:0">
        <div class="nm">${esc(u.name)}${isMe?" (you)":""}</div>
        <div class="rl">${esc(titleOf(u))}</div>
      </div>
      <span class="bell ${d.n?"":"none"}" title="${d.n?`${d.n} change${d.n===1?"":"s"} ${esc(dayWord)}`:`nothing logged ${esc(dayWord)}`}">${d.n?"🔔 "+d.n:"—"}</span>
    </div>
    <div class="pcard-nums">
      ${num(d.logged.length, "Logged", "")}
      ${num(d.updated.length, "Updated", "")}
      ${num(d.overdue.length, "Overdue", "bad")}
      ${num(d.closed.length, "Closed", "good")}
    </div>
    <div class="pcard-foot"><span style="min-width:0;flex:1;line-height:1.35">${foot}</span><span class="go">Open day ›</span></div>
  </button>`;
}

function upBodyHTML(date, evsAll){
  const me = state.me, people = teamPeople();
  const byTask = upByTask(evsAll);
  const flat = [...byTask.values()].flat();
  const dayWord = date===TODAY ? "so far today" : "on "+fmtDate(date);

  const built = people.map(u=>({u, d:upPersonDay(u.id, date, byTask)}));
  /* Busiest first, then whoever is carrying the most overdue work, then the
     most open work. Somebody with nothing on the board at all goes last,
     dimmed - still a name you can open, never a column of empty space. */
  built.sort((a,b)=> b.d.n-a.d.n || b.d.overdue.length-a.d.overdue.length
                  || b.d.open.length-a.d.open.length || a.u.name.localeCompare(b.u.name));
  /* your own work goes last, after the team you are reading about */
  const own = upPersonDay(me.id, date, byTask);
  const ownHasSomething = own.n > 0 || own.open.length > 0;

  const everyone = [...built.map(x=>x.d), ...(ownHasSomething?[own]:[])];
  const updatedN = built.filter(x=>x.d.n>0).length;
  const loggedN  = everyone.reduce((k,d)=>k+d.logged.length, 0);
  const doneN    = everyone.reduce((k,d)=>k+d.closed.length, 0);
  const sameN    = everyone.reduce((k,d)=>k+d.sameDay.length, 0);
  const pausedN  = flat.filter(e=>e.kind==="paused").length;
  const quietBusy = built.filter(x=>x.d.n===0 && x.d.open.length>0).length;

  const tiles = `<div class="grid g-kpis up-tiles">
    <div class="card tile"><div class="lbl">People who updated</div>
      <div class="val">${updatedN}<span style="font-size:15px;color:var(--muted)"> of ${people.length}</span></div>
      <div class="delta ${quietBusy?"down":""}">${quietBusy?`${quietBusy} with open work and nothing logged`:"nobody with open work went quiet"}</div></div>
    <div class="card tile"><div class="lbl">Updates</div><div class="val">${flat.length}</div>
      <div class="delta">changes on ${byTask.size} task${byTask.size===1?"":"s"} ${esc(dayWord)}</div></div>
    <div class="card tile"><div class="lbl">Logged</div><div class="val">${loggedN}</div>
      <div class="delta">new task${loggedN===1?"":"s"} put on the board ${esc(dayWord)}</div></div>
    <div class="card tile"><div class="lbl">Closed</div>
      <div class="val" style="${doneN?"color:var(--good)":""}">${doneN}</div>
      <div class="delta">${doneN?`${sameN} logged and closed the same day`:`nothing marked done ${esc(dayWord)}`}</div></div>
    <div class="card tile"><div class="lbl">Paused</div>
      <div class="val" style="${pausedN?"color:var(--warning)":""}">${pausedN}</div>
      <div class="delta">${pausedN?"a reason is on each one":"nothing blocked"}</div></div>
  </div>`;

  if(!people.length) return `${tiles}<div class="card card-pad" style="margin-top:16px">Nobody reports to you yet.</div>`;

  return `${tiles}
    <div class="sec-h"><h2>Your team</h2>
      <div class="sub">One card per person &middot; 🔔 counts what moved ${esc(dayWord)} &middot; click a name to open their day: logged, updated, overdue and closed</div></div>
    <div class="pgrid">
      ${built.map(x=>upPersonCard(x.u, x.d, dayWord, false)).join("")}
      ${ownHasSomething ? upPersonCard(me, own, dayWord, true) : ""}
    </div>`;
}

/* ================= the person layer =================
   Click a name on the team grid and their day slides in over it: the same
   drawer the profile uses, made wide. It is painted from the day already in
   UPCACHE, so stepping ‹ › through days inside it is instant once each day has
   been fetched, and a live change repaints it in place (upFill → upLayerPaint)
   without losing where you had scrolled to. */
function openUpLayer(uid){
  if(!U(uid)) return;
  state.upWho = uid;
  const dr = $("#drawer");
  dr.classList.add("wide","open"); $("#drawerScrim").classList.add("open");
  document.body.classList.add("layer-open");
  upLayerPaint();
}
/* ---- the four lists of one person's day, as HTML ----
   Shared by the manager's layer (read-out: click a row to open the task) and
   by My Day (the person's own screen, with the stage buttons, note box and
   activity-log form on the rows, so the day is updated from the same place it
   is read). `pfx` keeps the jump anchors distinct between the two hosts. */
function upDayParts(uid, date, evs, own, pfx){
  const u = U(uid), isToday = date===TODAY;
  const byTask = upByTask(evs);
  const d = upPersonDay(uid, date, byTask);
  const first = u ? u.name.split(" ")[0] : "them";
  const their = own ? "your" : "their";
  const dayWord = isToday ? "so far today" : "on "+fmtDate(date);
  const dayCap  = isToday ? "today" : "on "+fmtDate(date);
  /* the buttons that move a task, for the person's own screen only */
  const acts = t => { if(!own) return "";
    const b = (stage, cls, lbl) => `<button type="button" class="act ${cls}" data-move="${esc(stage)}" data-task="${esc(t.id)}">${lbl}</button>`;
    const parts = t.done ? [b(STAGE_WIP, "", "↩ Reopen")]
      : t.stage===STAGE_PAUSE ? [b(STAGE_WIP, "", "▶ Resume"), b(STAGE_DONE, "done", "✓ Done")]
      : t.stage===STAGE_START ? [b(STAGE_WIP, "", "▶ Start working"), b(STAGE_PAUSE, "pause", "⏸️ Pause"), b(STAGE_DONE, "done", "✓ Done")]
      : [b(STAGE_PAUSE, "pause", "⏸️ Pause"), b(STAGE_DONE, "done", "✓ Done")];
    parts.push(`<button type="button" class="act" data-note="${esc(t.id)}">💬 Note</button>`);
    return `<div class="md-acts">${parts.join("")}</div>
      <div class="md-note hidden" data-notebox="${esc(t.id)}"><input maxlength="400" placeholder="Add a progress note…">
        <button type="button" class="btn sm primary" data-noteadd="${esc(t.id)}">Add</button></div>`; };
  const row = (t, tm, extra="") => { const p = PIPES.find(x=>x.id===t.pipe);
    return `<div class="upl-row ${t.done?"done-row":""}" data-upltask="${esc(t.id)}">
      <span class="tm">${esc(tm)}</span>
      <div class="mid"><div class="t">${esc(t.title)}</div>
        ${t.stage===STAGE_PAUSE?`<div class="s" style="color:#8a6206">⏸️ ${esc(t.pauseReason||"no reason given")}</div>`:""}
        ${extra?`<div class="s">${extra}</div>`:""}
        <div class="meta">${t.done?"":`<span class="stage-pill ${esc(t.stage.replace(/\s/g,""))}">${esc(t.stage)}</span>`}
          ${prChip(t.pr)}${dueChip(t)}${p?`<span class="bd">${esc(p.name)}</span>`:""}</div>
        ${acts(t)}
      </div></div>`; };
  const by = t => t.createdBy && t.createdBy!==uid ? ` · by ${esc(U(t.createdBy)?.name||"someone")}` : "";
  const sec = (no, title, sub, body, id, extraHead="") => `<div class="upl-sec" id="${pfx}${id}">
    <div class="sh"><span class="no">${no}</span><h3>${title}</h3><span class="sub">${sub}</span>${extraHead}</div>${body}</div>`;
  const empty = s => `<div class="upl-empty">${s}</div>`;

  /* 1 · logged */
  const logForm = own && isToday ? `<form class="md-logform" id="mdLogForm">
      <select id="mdLogCat">${activeCats().map(c=>`<option value="${c.id}">${c.ic} ${esc(c.name)}</option>`).join("")}</select>
      <input id="mdLogNote" maxlength="400" required placeholder="Log an activity — e.g. Visited Ward 12 collection point, met the supervisor…">
      <button class="btn sm primary" type="submit">Add to today's log</button></form>` : "";
  const loggedBody = (d.logged.length ? d.logged.map(t=>row(t, upTime(t.createdAt),
      [t.createdBy && t.createdBy!==uid ? `Logged by ${esc(U(t.createdBy)?.name||"someone")}` : "",
       t.done&&t.doneOn===date ? `<b style="color:var(--good-text)">closed the same day${t.closedAt?` at ${esc(upTime(t.closedAt))}`:""}</b>` : ""
      ].filter(Boolean).join(" · "))).join("")
    : empty(own ? `You have not logged a task ${esc(dayCap)}.${isToday?" Use <b>New task</b> at the top to put one on the board.":""}`
                : `No task was logged for ${esc(first)} ${esc(dayCap)}.`))
    + (d.notes.length ? `<div class="upl-sub">Activity notes in the Daily Log (${d.notes.length})</div>
        ${d.notes.map(l=>{ const c=catOf(l.cat); return `<div class="upl-note"><div class="ic">${c.ic}</div>
          <div style="min-width:0"><div class="c">${esc(c.name)}</div><div>${esc(l.note)}</div></div></div>`;}).join("")}` : "")
    + logForm;

  /* 2 · updated */
  const updBody = d.updated.length
    ? `<div class="upl-cards">${d.updated.map(t=>upCard(t, byTask.get(t.id)||[], uid, dayWord, acts(t))).join("")}</div>`
    : empty(`Nothing moved ${esc(dayCap)} — no stage change, pause, due date or note on any of ${their} tasks.`);
  const updN = d.updated.reduce((k,t)=>k+(byTask.get(t.id)||[]).length, 0);

  /* 3 · open: overdue, due today, pending */
  const sinceTxt = t => { const n = daysInStage(t); return n==null ? "" : ` · ${n===0?`in ${esc(t.stage)} since today`:`${n} day${n===1?"":"s"} in ${esc(t.stage)}`}`; };
  const loggedOn = t => taskDay(t) ? `Logged ${esc(taskDay(t)===TODAY ? "today" : fmtDate(taskDay(t)))}` : "Logged earlier";
  const late = t => Math.round((todayD - new Date(t.due+"T00:00:00"))/DAY);
  const openBody = d.open.length ? `
    ${d.overdue.length ? `<div class="upl-sub bad">Overdue (${d.overdue.length})</div>${d.overdue.map(t=>row(t, "⚠ "+fmtDate(t.due),
        `Due ${esc(fmtDate(t.due))} — ${late(t)} day${late(t)===1?"":"s"} late${sinceTxt(t)}`)).join("")}` : ""}
    ${d.dueToday.length ? `<div class="upl-sub">Due today (${d.dueToday.length})</div>${d.dueToday.map(t=>row(t, "● today", `${loggedOn(t)}${sinceTxt(t)}`)).join("")}` : ""}
    ${d.pending.length ? `<div class="upl-sub">Pending (${d.pending.length})</div>${d.pending.map(t=>row(t, t.due?fmtDate(t.due):"no date", `${loggedOn(t)}${sinceTxt(t)}`)).join("")}` : ""}`
    : empty(`Nothing open — every task on ${their} board is done.`);

  /* 4 · closed */
  const closedBody = d.closed.length ? d.closed.map(t=>row(t, t.closedAt?upTime(t.closedAt):"—",
      `Logged ${esc(taskDay(t)===date ? upTime(t.createdAt) : (taskDay(t)?fmtDate(taskDay(t)):"earlier"))}${by(t)}${
        taskDay(t)===date ? ` <span class="chip sameday">✓ Logged &amp; closed ${esc(isToday?"today":"same day")}</span>` : ""}`)).join("")
    : empty(`Nothing was marked done ${esc(dayCap)}.`);

  const jump = (id, n, lbl) => `<button type="button" data-upljump="${pfx}${id}"><b>${n}</b> ${lbl}</button>`;
  const tiles = `<div class="upl-tiles">
      <div class="card tile"><div class="lbl">Logged ${esc(isToday?"today":"that day")}</div><div class="val">${d.logged.length}</div>
        <div class="delta">${d.logged.length?`${d.logged.filter(t=>t.done&&t.doneOn===date).length} already closed`:"no new task"}</div></div>
      <div class="card tile"><div class="lbl">Updates</div><div class="val">${updN}</div>
        <div class="delta">on ${d.updated.length} task${d.updated.length===1?"":"s"}</div></div>
      <div class="card tile"><div class="lbl">Overdue / pending</div>
        <div class="val"><span style="${d.overdue.length?"color:var(--critical)":""}">${d.overdue.length}</span><span style="font-size:14px;color:var(--muted)"> / ${d.open.length}</span></div>
        <div class="delta">${d.open.length?`${d.open.length} open${d.paused.length?` · ${d.paused.length} paused`:""}`:"nothing open"}</div></div>
      <div class="card tile"><div class="lbl">Closed ${esc(isToday?"today":"that day")}</div>
        <div class="val" style="${d.closed.length?"color:var(--good)":""}">${d.closed.length}</div>
        <div class="delta">${d.closed.length?`${d.sameDay.length} logged &amp; closed same day`:"nothing finished"}</div></div>
    </div>`;
  const jumps = `<div class="upl-jump">
      ${jump("Logged", d.logged.length, isToday?"Today's log":"Logged")}
      ${jump("Updated", updN, "Updates")}
      ${jump("Open", d.open.length, "Overdue / pending")}
      ${jump("Closed", d.closed.length, isToday?"Closed today":"Closed")}
    </div>`;
  const sections = `
    ${sec(1, isToday?"Today's log":"Logged "+esc(fmtDate(date)), `${d.logged.length} task${d.logged.length===1?"":"s"} put on the board ${esc(dayCap)}`, loggedBody, "Logged")}
    ${sec(2, "Updates", `${updN} change${updN===1?"":"s"} ${esc(dayWord)} — stage moves, pauses, due dates, priority, notes`, updBody, "Updated")}
    ${sec(3, "Overdue / pending", `${d.open.length} open task${d.open.length===1?"":"s"}${isToday?"":" as they stand now"} — overdue first`, openBody, "Open")}
    ${sec(4, isToday?"Closed today":"Closed "+esc(fmtDate(date)), `${d.closed.length} marked done${d.closed.length?` · ${d.sameDay.length} logged and closed the same day`:""}`, closedBody, "Closed")}`;
  return {d, updN, tiles, jumps, sections};
}

function upLayerPaint(){
  const uid = state.upWho, u = U(uid), dr = $("#drawer");
  if(!uid || !u){ closeDrawer(); return; }
  const date = state.upDate || TODAY, isToday = date===TODAY;
  const evs = UPCACHE[date];
  const keep = dr.querySelector(".upl-body")?.scrollTop || 0;
  const head = `<div class="upl-head">
    <div class="upl-who">${avatar(u,"lg")}
      <div style="min-width:0"><div class="nm">${esc(u.name)}${uid===state.me.id?" (you)":""}</div>
        <div class="rl">${esc(titleOf(u))}</div></div>
      <div class="acts">
        <button class="btn sm" id="uplProfile" type="button">Profile</button>
        ${teamPeople().some(p=>p.id===uid)?`<button class="btn sm" id="uplReview" type="button">📋 Review</button>`:""}
        <button class="icon-btn" id="uplX" title="Close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="upl-day">
      <button class="dnav" id="uplPrev" title="Previous day" aria-label="Previous day" style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;color:var(--ink2);font-family:inherit">‹</button>
      <div class="dttl">${esc(fmtDateLong(date))}<small>${esc(upDayWord(date))}</small></div>
      <button class="dnav" id="uplNext" title="Next day" aria-label="Next day" ${isToday?"disabled":""} style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;color:var(--ink2);font-family:inherit;${isToday?"opacity:.32;cursor:default":""}">›</button>
      ${isToday?"":`<button class="btn sm" id="uplToday" type="button">Jump to today</button>`}

  const body = dr.querySelector(".upl-body"); if(body && keep) body.scrollTop = keep;
}
function upLayerWire(){
  const dr = $("#drawer"), uid = state.upWho;
  const on = (sel, fn) => { const el = dr.querySelector(sel); if(el) el.addEventListener("click", fn); };
  on("#uplX", closeDrawer);
  on("#uplPrev", ()=>upGo(-1));
  on("#uplNext", ()=>upGo(1));
  on("#uplToday", ()=>upSet(TODAY));
  on("#uplProfile", ()=>{ closeDrawer(); openPerson(uid); });
  on("#uplReview", ()=>{ closeDrawer(); state.reviewOf=uid; state.view="review"; render(); });
  dr.querySelectorAll("[data-upljump]").forEach(b=>b.addEventListener("click", ()=>{
    const el = dr.querySelector("#"+b.dataset.upljump); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }));
  /* a task opens on top of the layer and the layer is still there when it closes */
  dr.querySelectorAll("[data-upltask]").forEach(el=>el.addEventListener("click", ()=>openTaskModal(el.dataset.upltask)));
}

/* ================= My Day — the same four lists, for yourself =================
   Every person gets this screen, team members included. It is the Daily
   Update layer turned inward: what you logged, what you moved, what is
   overdue or pending, what you closed - and the buttons to change it right
   there: Start working / Pause / Done / Reopen on each task, a note box, and
   the activity-log line. Everything it writes goes through the same calls the
   board and the task form use, so the history, the manager's Daily Update and
   the notifications all see it the same way. */
let mdToken = 0;
function mdSet(d){ if(!d) return; state.mdDate = d > TODAY ? TODAY : d; renderMyDay(); }
function mdGo(step){
  const base = new Date((state.mdDate||TODAY)+"T00:00:00");
  mdSet(iso(new Date(base.getTime()+step*DAY)));
}
function renderMyDay(){
  if(!state.mdDate) state.mdDate = TODAY;
  const date = state.mdDate, isToday = date===TODAY;
  $("#view").innerHTML = `
  <div class="day-bar">
    <button class="dnav" id="mdPrev" title="Previous day" aria-label="Previous day">‹</button>
    <div class="dttl">${esc(fmtDateLong(date))}<small>${esc(upDayWord(date))}</small></div>
    <button class="dnav" id="mdNext" title="Next day" aria-label="Next day" ${isToday?"disabled":""}>›</button>
    ${isToday?"":`<button class="btn sm" id="mdToday">Jump to today</button>`}
    <div class="spacer"></div>
    <label style="font-size:12px;color:var(--muted)">Pick a day
      <input type="date" id="mdPick" value="${date}" max="${TODAY}"></label>
  </div>
  <div id="mdBody" class="md-wrap"></div>`;
  $("#mdPrev").addEventListener("click", ()=>mdGo(-1));
  $("#mdNext").addEventListener("click", ()=>mdGo(1));
  const tb = $("#mdToday"); if(tb) tb.addEventListener("click", ()=>mdSet(TODAY));
  $("#mdPick").addEventListener("change", e=>mdSet(e.target.value));
  myDayFill(date);
}
async function myDayFill(date){
  const host = $("#mdBody"); if(!host) return;
  const my = ++mdToken;
  if(!UPCACHE[date])
    host.innerHTML = `<div class="card card-pad" style="color:var(--muted); font-size:13px">Loading ${esc(fmtDate(date))}…</div>`;
  let evs;
  try{ evs = await loadDayEvents(date); }
  catch(e){
    if(my!==mdToken || state.view!=="myday") return;
    console.error(e);
    host.innerHTML = `<div class="card card-pad"><b style="font-size:14px">Could not load that day.</b>
      <div style="color:var(--muted); font-size:13px; margin-top:6px">${esc(e.message||String(e))}</div></div>`;
    return;
  }
  if(my!==mdToken || state.view!=="myday") return;
  /* A live change repaints this screen a moment after your own move lands.
     Anything half-typed - a note box that is open, the activity line - is
     carried across the repaint, so the screen never eats your words. */
  const keep = window.scrollY;
  const openNotes = [...host.querySelectorAll("[data-notebox]:not(.hidden)")].map(b=>{
    const i = b.querySelector("input");
    return {sec:b.closest(".upl-sec")?.id, id:b.dataset.notebox, val:i.value, focus:document.activeElement===i}; });
  const logInp = $("#mdLogNote");
  const logKeep = logInp ? {val:logInp.value, focus:document.activeElement===logInp, cat:$("#mdLogCat")?.value} : null;
  const parts = upDayParts(state.me.id, date, evs, true, "md");
  host.innerHTML = `${parts.tiles}${parts.jumps}${parts.sections}`;
  myDayWire(date);
  openNotes.forEach(n=>{ const b = host.querySelector(`${n.sec?"#"+n.sec+" ":""}[data-notebox="${n.id}"]`); if(!b) return;
    b.classList.remove("hidden"); const i = b.querySelector("input"); i.value = n.val;
    if(n.focus){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
  if(logKeep && (logKeep.val || logKeep.focus)){ const i = $("#mdLogNote"), c = $("#mdLogCat");
    if(i){ i.value = logKeep.val; if(c && logKeep.cat) c.value = logKeep.cat;
      if(logKeep.focus){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } }
  if(keep) window.scrollTo(0, keep);
}
/* one click handler for the whole screen: buttons act, anything else on a
   row opens the task. Note boxes and the log form never open the task. */
function myDayWire(date){
  const host = $("#mdBody"); if(!host) return;
  const refresh = () => { delete UPCACHE[date]; if(state.view==="myday") myDayFill(date); };
  host.addEventListener("click", async e=>{
    const jump = e.target.closest("[data-upljump]");
    if(jump){ const el = host.querySelector("#"+jump.dataset.upljump); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
    const mv = e.target.closest("[data-move]");
    if(mv){ e.stopPropagation();
      const t = TASKS.find(x=>x.id===mv.dataset.task); if(!t) return;
      await moveTask(t, mv.dataset.move);       // asks for a pause reason itself; renders optimistically
      refresh(); return; }
    /* the same task can sit in two lists (logged today AND pending, say), so
       the note box is always the one beside the button that was pressed */
    const nb = e.target.closest("[data-note]");
    if(nb){ e.stopPropagation();
      const box = nb.closest("[data-upltask]")?.querySelector("[data-notebox]"); if(!box) return;
      box.classList.toggle("hidden"); if(!box.classList.contains("hidden")) box.querySelector("input").focus(); return; }
    const add = e.target.closest("[data-noteadd]");
    if(add){ e.stopPropagation(); await mdSendNote(add.closest("[data-notebox]"), refresh); return; }
    if(e.target.closest(".md-note, .md-logform")){ e.stopPropagation(); return; }
    const rowEl = e.target.closest("[data-upltask]");
    if(rowEl) openTaskModal(rowEl.dataset.upltask);
  });
  host.addEventListener("keydown", e=>{
    if(e.key!=="Enter") return;
    const box = e.target.closest(".md-note"); if(!box) return;
    e.preventDefault(); mdSendNote(box, refresh);
  });
  const lf = $("#mdLogForm"); if(lf) lf.addEventListener("submit", async e=>{
    e.preventDefault();
    const note = $("#mdLogNote").value.trim(); if(!note) return;
    const btn = lf.querySelector("button[type=submit]"); btn.disabled = true;
    const saved = await guard(()=>DB.ins("dat_logs",{user_id:state.me.id, log_date:TODAY,
      category_id:$("#mdLogCat").value, note}));
    btn.disabled = false;
    if(!saved) return;
    LOGS.push(mapLog(saved));
    addEvent("log","logged an activity");
    toast("Activity logged ✓");
    myDayFill(date);
  });
}
async function mdSendNote(box, refresh){
  if(!box) return;
  const taskId = box.dataset.notebox;
  const inp = box.querySelector("input"), btn = box.querySelector("button");
  const note = inp.value.trim(); if(!note){ inp.focus(); return; }
  btn.disabled = true;
  const row = await guard(()=>DB.ins("dat_task_events", {task_id:taskId, actor:state.me.id, kind:"comment", note}));
  btn.disabled = false;
  if(!row) return;
  toast("Note added ✓");
  refresh();
}
