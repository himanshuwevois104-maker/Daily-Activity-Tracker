/* ================= daily tasks (the board) ================= */
function boardOwnerFilter(pipes){
  const owners = [...new Set(pipes.map(p=>p.createdBy||""))];
  const selected = new Set(state.pipeOwners||[]);
  const names = owners.map(id=>id ? U(id)?.name||"Unknown owner" : "Unknown owner");
  const selectedOwners=owners.filter(id=>selected.has(id===""?null:id));
  const summary=selectedOwners.length===owners.length ? "All board owners"
    : selectedOwners.length===1 && selectedOwners[0]===state.me.id ? "My boards"
    : selectedOwners.length ? `${selectedOwners.length} selected` : "No owners selected";
  return `<details class="board-owner-filter" id="boardOwnerFilter" ${state.pipeOwnerFilterOpen?"open":""}>
    <summary class="btn sm">Board owners · ${esc(summary)}</summary>
    <div class="board-owner-menu">
      <div style="display:flex;gap:8px;padding:4px 8px 7px;border-bottom:1px solid var(--grid);margin-bottom:4px">
        <button type="button" class="mini-btn" data-owner-filter-action="all">Select all</button>
        <button type="button" class="mini-btn" data-owner-filter-action="mine">My boards</button>
      </div>
      ${owners.map((id,i)=>`<label class="board-owner-option"><input type="checkbox" data-board-owner="${esc(id)}" ${selected.has(id===""?null:id)?"checked":""}>${esc(names[i])}${id===state.me.id?" (you)":""}</label>`).join("")}
    </div>
  </details>`;
}
function wireBoardOwnerFilter(allPipes){
  const details=$("#boardOwnerFilter");
  if(!details) return;
  details.addEventListener("toggle",()=>{ state.pipeOwnerFilterOpen=details.open; });
  const apply = owners=>{
    state.pipeOwners=owners;
    state.pipeOwnerFilterOpen=true;
    const filtered=allPipes.filter(p=>owners.includes(p.createdBy||null));
    if(!filtered.some(p=>p.id===state.pipe)) state.pipe=filtered[0]?.id||null;
    renderPipelines();
    const reopened=$("#boardOwnerFilter"); if(reopened) reopened.open=true;
    state.pipeOwnerFilterOpen=true;
  };
  details.querySelectorAll("[data-board-owner]").forEach(input=>input.addEventListener("change",()=>{
    const owners=[...details.querySelectorAll("[data-board-owner]:checked")].map(item=>item.dataset.boardOwner||null);
    apply(owners);
  }));
  details.querySelectorAll("[data-owner-filter-action]").forEach(button=>button.addEventListener("click",()=>{
    const owners=button.dataset.ownerFilterAction==="mine" ? [state.me.id]
      : [...new Set(allPipes.map(p=>p.createdBy||null))];
    apply(owners);
  }));
}
function renderPipelines(){
  const me=state.me, allPipes=visiblePipes(me), manager=me.level==="manager";
  const pipes=manager ? allPipes.filter(p=>(state.pipeOwners||[me.id]).includes(p.createdBy||null)) : allPipes;
  if(!allPipes.length){
    $("#view").innerHTML = `<div class="card card-pad" style="text-align:center;padding:44px 24px">
      <div style="font-size:34px;margin-bottom:8px">\u{1F5C2}\uFE0F</div>
      <h3 style="font-size:16px">No task boards yet</h3>
      <div style="color:var(--ink2);font-size:13.5px;margin:6px auto 18px;max-width:430px">
        A board holds daily tasks for one area of work, and every task moves through the same four stages:
        Start &rarr; In Progress &rarr; Pause &rarr; Done. Create the first board and start adding tasks.</div>
      <button class="btn primary" data-act="newPipe" style="margin:0 auto">\uFF0B Create a task board</button>
    </div>`;
    wireCommon(); return; }
  if(manager && !pipes.length){
    $("#view").innerHTML = `<div class="board-head">${boardOwnerFilter(allPipes)}<div class="grow"></div></div>
      <div class="card card-pad" style="text-align:center;padding:38px 24px">
        <div style="font-size:30px;margin-bottom:8px">🗂️</div><h3 style="font-size:16px">No boards selected</h3>
        <div style="color:var(--ink2);font-size:13.5px;margin:6px auto 0;max-width:430px">Choose one or more board owners in the filter to view their boards. Your view starts with your own boards.</div>
      </div>`;
    wireBoardOwnerFilter(allPipes); wireCommon(); return;
  }
  if(!pipes.find(p=>p.id===state.pipe)) state.pipe=pipes[0].id;
  const pipe = pipes.find(p=>p.id===state.pipe);
  const people = liveUsers().filter(u=>visibleUserIds(me).includes(u.id));
  let tasks = visibleTasks(me).filter(t=>t.pipe===pipe.id);
  if(state.fAssignee!=="all") tasks=tasks.filter(t=>t.assignee===state.fAssignee);
  if(state.fPriority!=="all") tasks=tasks.filter(t=>t.pr===state.fPriority);
  if(state.fSearch) tasks=tasks.filter(t=>t.title.toLowerCase().includes(state.fSearch.toLowerCase()));
  if(!state.showDone) tasks=tasks.filter(t=>!t.done);

  /* One picker, always. The tab row it replaced changed shape the moment
     somebody made a fifth board, so the same screen looked different on two
     people's accounts. A dropdown naming the board, its department and its open
     count reads identically whether you have two boards or twenty. */
  const byDept = {};
  pipes.forEach(p=>{ (byDept[p.dept] = byDept[p.dept] || []).push(p); });
  const openN = pid => visibleTasks(me).filter(t=>t.pipe===pid && !t.done).length;
  const activeFilters = (state.fAssignee!=="all"?1:0) + (state.fPriority!=="all"?1:0)
                      + (state.fSearch?1:0) + (state.showDone?0:1);

  $("#view").innerHTML = `
  <div class="board-head">
    <select id="pipePick" class="board-pick">
      ${Object.keys(byDept).sort().map(dp=>`<optgroup label="${esc(dp)}">
        ${byDept[dp].map(p=>`<option value="${p.id}" ${p.id===state.pipe?"selected":""}>${esc(p.name)} — ${openN(p.id)} open</option>`).join("")}
      </optgroup>`).join("")}
    </select>
    ${manager?boardOwnerFilter(allPipes):""}
    <div class="grow"></div>
    <button class="btn sm" id="fToggle">⚙ Filters${activeFilters?` <span class="cnt">${activeFilters}</span>`:""}</button>
    ${canEditPipe(me,pipe)?`<button class="btn sm" data-act="editPipe">✏️ Edit board</button>`:""}
    ${canCreatePipeline(me)?`<button class="btn sm primary" data-act="newPipe">＋ New board</button>`:""}
  </div>
  <div class="board-sub">${esc(pipe.dept)} · ${openN(pipe.id)} open of ${visibleTasks(me).filter(t=>t.pipe===pipe.id).length}</div>
  <div class="filters" id="filterRow" style="display:${state.showFilters||activeFilters?"flex":"none"}">
    <input type="search" id="fSearch" placeholder="Search tasks…" value="${esc(state.fSearch)}">
    <select id="fAssignee"><option value="all">Everyone</option>
      ${people.map(u=>`<option value="${u.id}" ${state.fAssignee===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
    <select id="fPriority"><option value="all">Any priority</option>
      ${["urgent","high","medium","low"].map(p=>`<option value="${p}" ${state.fPriority===p?"selected":""}>${p[0].toUpperCase()+p.slice(1)}</option>`).join("")}</select>
    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)">
      <input type="checkbox" id="fDone" ${state.showDone?"checked":""}> Show done</label>
    ${activeFilters?`<button class="mini-btn" id="fClear" style="margin-left:auto">Clear filters</button>`:""}
  </div>
  <div class="board" id="board">
    ${pipe.stages.map((s,si)=>{
      const st = tasks.filter(t=>t.stage===s);
      return `<div class="col" data-stage="${esc(s)}">
        <div class="col-head">
          <span class="pdot" style="width:8px;height:8px;border-radius:50%;background:var(--ord${Math.min(si+1,6)})"></span>
          <span class="cnm">${esc(s)}</span><span class="cct">${st.length}</span>
          <button class="add" data-addtask="${esc(s)}" title="Add task here">＋</button>
        </div>
        <div class="col-body" data-drop="${esc(s)}">
          ${st.length?st.map(t=>taskCard(t,pipe)).join(""):`<div class="empty-col">Drop tasks here</div>`}
        </div>
      </div>`; }).join("")}
  </div>`;
  const pick=$("#pipePick");
  if(pick) pick.addEventListener("change",()=>{ state.pipe=pick.value; renderPipelines(); });
  if(manager) wireBoardOwnerFilter(allPipes);
  const ft=$("#fToggle");
  if(ft) ft.addEventListener("click",()=>{ state.showFilters=!state.showFilters; renderPipelines(); });
  const fc=$("#fClear");
  if(fc) fc.addEventListener("click",()=>{ state.fAssignee="all"; state.fPriority="all";
    state.fSearch=""; state.showDone=true; renderPipelines(); });
  wireBoard(pipe); wireCommon();
}
function taskCard(t,pipe){
  const u=U(t.assignee);
  return `<div class="tcard ${t.done?"done-card":""}" draggable="true" data-task="${t.id}" style="--pc:var(--s${pipe.color})">
    <div class="tt">${esc(t.title)}</div>
    ${t.stage===STAGE_PAUSE?`<div style="font-size:11px;color:#8a6206;margin:3px 0 1px">⏸ ${esc(t.pauseReason||"no reason given")}</div>`:""}
    <div class="meta">${prChip(t.pr)} ${dueChip(t)} ${u?avatar(u,"sm"):""}</div>
  </div>`;
}
function wireBoard(pipe){
  const me=state.me;
  $("#fSearch").addEventListener("input",e=>{state.fSearch=e.target.value; renderPipelines();});
  $("#fAssignee").addEventListener("change",e=>{state.fAssignee=e.target.value; renderPipelines();});
  $("#fPriority").addEventListener("change",e=>{state.fPriority=e.target.value; renderPipelines();});
  $("#fDone").addEventListener("change",e=>{state.showDone=e.target.checked; renderPipelines();});
  // drag & drop
  let dragId=null;
  document.querySelectorAll(".tcard").forEach(c=>{
    c.addEventListener("dragstart",e=>{ dragId=c.dataset.task; c.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId); });
    c.addEventListener("dragend",()=>{ c.classList.remove("dragging"); dragId=null;
      document.querySelectorAll(".col").forEach(x=>x.classList.remove("drag-over")); });
    c.addEventListener("click",()=>openTaskModal(c.dataset.task));
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave",e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("drag-over"); });
    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("drag-over");
      const id=dragId||e.dataTransfer.getData("text/plain"); const t=TASKS.find(x=>x.id===id); if(!t) return;
      if(!canEditTask(me,t)){ toast("You can't move this task."); return; }
      const stage=col.dataset.stage; if(t.stage===stage) return;
      moveTask(t, stage);
    });
  });

/* Pausing always asks why. A manager who can see "paused — waiting on the
   client" can act; one who only sees "paused" has to go and ask. */
function askPauseReason(taskTitle){
  return new Promise(resolve=>{
    modal(`<div class="modal">
      <h3>Pausing “${esc(trunc(taskTitle))}”</h3>
      <div class="msub">Why is it stopping? Your manager sees this, so they can unblock you without having to chase.</div>
      <form id="pauseForm" class="f-grid">
        <div class="field"><label>Reason</label><select id="pzWhy">
          ${PAUSE_REASONS.map(r=>`<option>${esc(r)}</option>`).join("")}</select></div>
        <div class="field"><label>Anything to add (optional)</label>
          <input id="pzNote" maxlength="120" placeholder="e.g. chased them on Tuesday, no reply yet"></div>
        <div class="m-actions"><div class="grow"></div>
          <button type="button" class="btn" id="pzCancel">Cancel</button>
          <button class="btn primary" type="submit">Pause the task</button></div>
      </form></div>`);
    let settled = false;
    const done = v => { if(settled) return; settled = true; closeModal(); resolve(v); };
    $("#pzCancel").addEventListener("click",()=>done(null));
    $("#pauseForm").addEventListener("submit", e=>{
      e.preventDefault();
      const why = $("#pzWhy").value, note = $("#pzNote").value.trim();
      done(note ? `${why} — ${note}` : why);
    });
  });
}
async function moveTask(t, stage, reasonGiven){
  const prev = {stage:t.stage, done:t.done, doneOn:t.doneOn, pauseReason:t.pauseReason};
  let reason = reasonGiven;
  if(stage === STAGE_PAUSE && reason === undefined){
    reason = await askPauseReason(t.title);
    if(reason === null) return;                                   // they backed out
  }
  const done = (stage === STAGE_DONE);
  const doneOn = done ? (t.doneOn||TODAY) : null;
  t.stage=stage; t.done=done; t.doneOn=doneOn;
  if(stage===STAGE_PAUSE) t.pauseReason = reason||"";
  render();                                                       // optimistic
  const patch = {stage, done, done_on:doneOn};
  if(stage === STAGE_PAUSE) patch.pause_reason = reason || null;
  const ok = await guard(()=>DB.upd("dat_tasks", t.id, patch));
  if(ok===null){ Object.assign(t, prev); render(); return; }      // rejected: put it back
  Object.assign(t, mapTask(ok));   // pick up started_at / closed_at / paused_ms
  addEvent(done?"done":"move", done?`completed “${t.title}”`
    : stage===STAGE_PAUSE ? `paused “${t.title}” — ${reason||"no reason given"}`
    : `moved “${t.title}” to ${stage}`);
  toast(done?`✓ “${trunc(t.title)}” completed`
    : stage===STAGE_PAUSE ? "Paused — your manager can see why" : `Moved to ${stage}`);
}

const DOC_BUCKET = "dat-docs";
const DOC_MAX = 25*1024*1024;                       // keep in step with the bucket limit in the SQL
const fmtBytes = n => !n ? "" : n<1024 ? n+" B"
  : n<1048576 ? (n/1024).toFixed(0)+" KB" : (n/1048576).toFixed(1)+" MB";
const docExt = d => ((d.file||"").split(".").pop()||"file").slice(0,4);
const docsOf = id => DOCS.filter(d=>d.user===id);

/* Upload the file, then record it. If the record fails, the orphaned file is
   removed again so the bucket never fills with things nothing points at. */
async function uploadDoc(file, title, note){
  const me = state.me;
  if(file.size > DOC_MAX){ toast(`"${file.name}" is ${fmtBytes(file.size)} — the limit is 25 MB.`); return null; }
  const safe = file.name.replace(/[^\w.\-]+/g,"_").slice(-80);
  const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
  const {error:upErr} = await sb.storage.from(DOC_BUCKET)
    .upload(path, file, {contentType:file.type||"application/octet-stream", upsert:false});
  if(upErr){
    console.error(upErr);
    toast(/bucket not found/i.test(upErr.message||"")
      ? "File storage is not set up yet — run TRACKER-UPDATE-02.sql."
      : (upErr.message || "Upload failed."));
    return null;
  }
  const row = await guard(()=>DB.ins("dat_docs",{user_id:me.id, title, note, path,
    file_name:file.name, mime:file.type||"", size_bytes:file.size, log_date:TODAY}));
  if(!row){ await sb.storage.from(DOC_BUCKET).remove([path]).catch(()=>{}); return null; }
  return row;
}
/* Private bucket: every download is a fresh short-lived signed link. The blank
   tab is opened before the await so the browser does not treat it as a popup. */
async function openDoc(d, asDownload, win){
  const {data,error} = await sb.storage.from(DOC_BUCKET)
    .createSignedUrl(d.path, 120, asDownload ? {download: d.file||true} : {});
  if(error||!data){ if(win) win.close(); console.error(error);
    toast("Could not open that file — it may have been removed."); return; }
  if(win) win.location.href = data.signedUrl; else window.open(data.signedUrl,"_blank","noopener");
}
async function deleteDoc(d){
  if(await guard(()=>DB.del("dat_docs", d.id).then(()=>true)) === null) return false;
  await sb.storage.from(DOC_BUCKET).remove([d.path]).catch(()=>{});
  const i = DOCS.findIndex(x=>x.id===d.id); if(i>-1) DOCS.splice(i,1);
  return true;
}

/* ================= tender register =================
   One row per tender, with two things hanging off it that are NOT equally
   visible. The papers — the tender documents and the work orders — are open to
   the CEO, the VPs, AVP, DGM and the Tender team. The EMD figures are open to
   the CEO, the VPs and the Tender team alone. That is why EMD lives in its own
   table, dat_tender_emd, under its own rule: row-level security hides rows,
   not columns, so the only way an AVP can read a tender without reading its
   EMD is for the EMD to be somewhere else. Everything here mirrors dat_can()
   and dat_can_edit() in TRACKER-UPDATE-10.sql; the database enforces it. */
const TENDER_BUCKET = "dat-tender";

const T_LIVE     = ["preparing","submitted"];

const tenderOf   = id => TENDERS.find(t=>t.id===id);
const tFilesOf   = (id,kind) => TFILES.filter(f=>f.tender===id && (!kind || f.kind===kind));
const emdOf      = id => EMDS.filter(e=>e.tender===id);
const inr        = v => (v===null||v===undefined||v==="") ? "—"
  : "₹" + Number(v).toLocaleString("en-IN",{maximumFractionDigits:0});
/* days until the last date of submission — negative once it is past */
function tenderDays(t){ if(!t.submit) return null;
  return Math.round((new Date(t.submit+"T00:00:00") - todayD) / DAY); }

function tenderRows(){
  const q = state.tenderQ.trim().toLowerCase();

      <div class="delta">${EMDS.filter(e=>e.status==="not_received").length} line${EMDS.filter(e=>e.status==="not_received").length===1?"":"s"} outstanding</div></div>`:""}
  </div>

  <div class="card card-pad" style="margin-bottom:16px">
    <div class="qa-form" style="grid-template-columns:1fr 200px${wr?" auto":""}">
      <input id="tdQ" placeholder="Search tender, site, reference, authority or note" value="${esc(state.tenderQ)}">
      <select id="tdStatus">
        <option value="open"   ${state.tenderStatus==="open"?"selected":""}>Live tenders</option>
        <option value="alerts" ${state.tenderStatus==="alerts"?"selected":""}>Closing in 7 days</option>
        <option value="all"    ${state.tenderStatus==="all"?"selected":""}>Everything</option>
        ${Object.entries(T_STATUS).map(([k,v])=>`<option value="${k}" ${state.tenderStatus===k?"selected":""}>${esc(v)} only</option>`).join("")}</select>
      ${wr?`<button class="btn primary" id="tdNew">＋ New tender</button>`:""}
    </div>
  </div>

  ${rows.length?`<div class="card card-pad" style="padding-top:6px">
    <div style="overflow-x:auto"><table class="simple">
      <thead><tr><th>Tender</th><th>Site</th><th>Authority</th><th>Submission</th>
        <th>Status</th><th>Owner</th><th>Papers</th>${seeEmd?"<th>EMD</th>":""}</tr></thead>
      <tbody>${rows.map(t=>{ const u=U(t.owner);
        const nt=tFilesOf(t.id,"tender").length, nw=tFilesOf(t.id,"work_order").length;
        const es=emdOf(t.id), got=es.filter(e=>e.status==="received").length;
        return `<tr class="click" data-tender="${t.id}">
          <td><b>${esc(t.title)}</b>${t.ref?`<div style="font-size:11.5px;color:var(--muted)">${esc(t.ref)}</div>`:""}</td>
          <td>${esc(t.site||"—")}</td>
          <td>${esc(t.authority||"—")}</td>
          <td>${tenderDateChip(t)}</td>
          <td>${tStatusChip(t)}</td>
          <td>${u?esc(u.name):`<span style="color:var(--muted)">unassigned</span>`}</td>
          <td style="white-space:nowrap">${nt||nw?`${nt?`📄 ${nt}`:""}${nt&&nw?" · ":""}${nw?`🧾 ${nw}`:""}`:`<span style="color:var(--muted)">—</span>`}</td>
          ${seeEmd?`<td style="white-space:nowrap">${es.length
            ? `${inr(es.reduce((a,e)=>a+e.amount,0))}<div style="font-size:11.5px;color:${got===es.length?"var(--good-text)":"var(--muted)"}">${got}/${es.length} received</div>`
            : `<span style="color:var(--muted)">—</span>`}</td>`:""}
        </tr>`;}).join("")}</tbody></table></div></div>`
  :`<div class="card card-pad" style="text-align:center;color:var(--muted)">
      ${TENDERS.length?"Nothing matches those filters.":`No tenders on file yet.${wr?" Add the first one above.":""}`}</div>`}`;

  const q=$("#tdQ");
  q.addEventListener("input",()=>{ state.tenderQ=q.value; const at=q.selectionStart; renderTenders();
    const nq=$("#tdQ"); nq.focus(); try{ nq.setSelectionRange(at,at); }catch(_){} });
  $("#tdStatus").addEventListener("change",e=>{ state.tenderStatus=e.target.value; renderTenders(); });
  const nb=$("#tdNew"); if(nb) nb.addEventListener("click",()=>openTenderModal(null));
  document.querySelectorAll("[data-tender]").forEach(tr=>tr.addEventListener("click",()=>openTenderModal(tr.dataset.tender)));
}

/* One tender: its fields, its papers in two groups, and its EMD lines.
   Everything is held locally and written on save, so a tender that is still
   being typed never leaves a stray file or a half EMD line behind. */
function openTenderModal(id){
  const me = state.me;
  if(!can(me,"tender")){ toast("The tender register is for the CEO, the VPs and the Tender team."); return; }
  const t  = id ? tenderOf(id) : null;
  const wr = canEdit(me,"tender");
  if(!t && !wr){ toast("You can read tenders but not add them."); return; }
  const seeEmd = can(me,"emd"), wrEmd = canEdit(me,"emd");
  const canDelete = t && wr && (t.createdBy===me.id || isAdmin(me));
  const dis = wr ? "" : "disabled";
  let pending = {tender:[], work_order:[]};          // files chosen, not yet uploaded
  let emdRows = t ? emdOf(t.id).map(e=>({...e})) : [];
  let emdGone = [];                                  // ids to delete on save

  function fileBox(kind){
    const fs = t ? tFilesOf(t.id, kind) : [];
    const total = fs.length + pending[kind].length;
    return `<div class="file-box">
      <div class="fb-h">${kind==="work_order"?"🧾":"📄"} ${esc(T_KINDS[kind])}<span>${total||"none"}</span></div>
      ${wr?`<div class="drop-mini" data-drop="${kind}"><b>Choose a file</b> or drag it here</div>`:""}
      ${fs.map(f=>`<div class="log-entry">
        <div class="file-ic">${esc(((f.file||"").split(".").pop()||"file").slice(0,4))}</div>
        <div style="min-width:0"><div class="doc-name" data-tdopen="${f.id}">${esc(f.file||"file")}</div>
          <div class="lmeta">${esc(U(f.by)?.name||"Someone")}${f.size?` · ${fmtBytes(f.size)}`:""}</div></div>
        <div class="acts" style="opacity:1"><button type="button" class="mini-btn" data-tdget="${f.id}">↓</button>
          ${wr?`<button type="button" class="mini-btn" data-tddel="${f.id}" style="color:var(--critical)">✕</button>`:""}</div>
      </div>`).join("")}
      ${pending[kind].map((f,i)=>`<div class="log-entry" style="opacity:.7">
        <div class="file-ic">${esc(((f.name||"").split(".").pop()||"file").slice(0,4))}</div>
        <div style="min-width:0"><div class="doc-name">${esc(f.name)}</div>
          <div class="lmeta">on save · ${fmtBytes(f.size)}</div></div>
        <div class="acts" style="opacity:1"><button type="button" class="mini-btn" data-tddrop="${kind}:${i}">✕</button></div>
      </div>`).join("")}
      ${!total?`<div style="font-size:12px;color:var(--muted);padding:2px">Nothing yet.</div>`:""}</div>`;
  }

  function emdHTML(){
    if(!seeEmd) return "";
    const total = emdRows.reduce((a,e)=>a+Number(e.amount||0),0);
    const got   = emdRows.filter(e=>e.status==="received").length;
    return `<div class="fsec">
      <div class="fsec-h"><b>EMD</b><span class="fsec-n">${emdRows.length
        ? `${inr(total)} · ${got} of ${emdRows.length} received`
        : "one line per site — CEO, VPs and the Tender team only"}</span></div>
      <div class="emd-wrap"><table class="simple">
        <colgroup><col style="width:23%"><col style="width:13%"><col style="width:13%"><col style="width:15%">
          <col style="width:19%"><col style="width:17%">${wrEmd?`<col style="width:34px">`:""}</colgroup>
        <thead><tr><th>Site</th><th>Amount ₹</th><th>Mode</th><th>Reference</th><th>Status</th><th>Received on</th>${wrEmd?"<th></th>":""}</tr></thead>
        <tbody>${emdRows.length?emdRows.map((e,i)=>wrEmd?`<tr>
          <td><input class="emdf" data-i="${i}" data-f="site" value="${esc(e.site||"")}" placeholder="Site / ULB"></td>
          <td><input class="emdf" data-i="${i}" data-f="amount" type="number" min="0" step="1" value="${e.amount||0}"></td>
          <td><select class="emdf" data-i="${i}" data-f="mode">${Object.entries(EMD_MODE).map(([k,v])=>`<option value="${k}" ${e.mode===k?"selected":""}>${esc(v)}</option>`).join("")}</select></td>
          <td><input class="emdf" data-i="${i}" data-f="ref" value="${esc(e.ref||"")}" placeholder="DD / UTR"></td>
          <td><select class="emdf" data-i="${i}" data-f="status">
            <option value="not_received" ${e.status!=="received"?"selected":""}>Not received</option>
            <option value="received" ${e.status==="received"?"selected":""}>Received</option></select></td>
          <td><input class="emdf" data-i="${i}" data-f="receivedOn" type="date" value="${esc(e.receivedOn||"")}"></td>
          <td><button type="button" class="mini-btn" data-emddel="${i}" style="color:var(--critical)">✕</button></td>
        </tr>`:`<tr>
          <td>${esc(e.site||"—")}</td><td style="text-align:right">${inr(e.amount)}</td><td>${esc(EMD_MODE[e.mode]||e.mode)}</td>
          <td>${esc(e.ref||"—")}</td>
          <td><span class="chip ${e.status==="received"?"done":"today"}">${e.status==="received"?"Received":"Not received"}</span></td>
          <td>${e.receivedOn?esc(fmtDate(e.receivedOn)):"—"}</td>
        </tr>`).join("")
        :`<tr><td colspan="${wrEmd?7:6}" style="color:var(--muted)">No EMD recorded for this tender.</td></tr>`}</tbody></table></div>
      ${wrEmd?`<button type="button" class="btn sm" id="emdAdd" style="margin-top:9px">＋ Add an EMD line</button>`:""}</div>`;
  }

  const people = liveUsers().sort((a,b)=>a.name.localeCompare(b.name))
    .map(u=>`<option value="${u.id}" ${t?.owner===u.id?"selected":""}>${esc(u.name)} · ${esc(titleOf(u))}</option>`).join("");
  modal(`<div class="modal wide tall">
    <div class="m-head">
      <h3>${t?esc(t.title):"New tender"}</h3>
      <div class="msub">${t
        ? `${t.site?esc(t.site)+" · ":""}${esc(T_STATUS[t.status]||t.status)}${t.createdBy?` · filed by ${esc(U(t.createdBy)?.name||"someone")}`:""}${t.updatedAt?` · changed ${timeAgo(t.updatedAt)}`:""}`
        : "Tender papers and work orders, and the EMD against them."}${wr?"":" — read only"}</div>
    </div>
    <form id="tenderForm">
      <div class="m-body">
        <div class="fsec">
          <div class="fsec-h"><b>The tender</b></div>
          <div class="f-grid f-3">
            <div class="field span3"><label>Tender name</label>
              <input id="tdTitle" required maxlength="160" ${dis} value="${esc(t?.title||"")}" placeholder="e.g. D2D collection &amp; transportation — Losal"></div>
            <div class="field"><label>Site / ULB / cluster</label>
              <input id="tdSite" maxlength="120" ${dis} value="${esc(t?.site||"")}" placeholder="e.g. Losal Nagar Palika"></div>
            <div class="field"><label>Authority</label>
              <input id="tdAuth" maxlength="120" ${dis} value="${esc(t?.authority||"")}" placeholder="DLB, ULB, GeM"></div>
            <div class="field"><label>Reference number</label>
              <input id="tdRef" maxlength="80" ${dis} value="${esc(t?.ref||"")}" placeholder="NIT / bid / GeM no."></div>
          </div>
        </div>

        <div class="fsec">
          <div class="fsec-h"><b>Dates &amp; value</b><span class="fsec-n">still preparing, inside 7 days → it shows on the Tenders badge</span></div>
          <div class="f-grid f-3">
            <div class="field"><label>Status</label><select id="tdMStatus" ${dis}>
              ${Object.entries(T_STATUS).map(([k,v])=>`<option value="${k}" ${(t?.status||"preparing")===k?"selected":""}>${esc(v)}</option>`).join("")}</select></div>
            <div class="field"><label>Last date of submission</label><input type="date" id="tdSubmit" ${dis} value="${esc(t?.submit||"")}"></div>
            <div class="field"><label>Opening date</label><input type="date" id="tdOpen" ${dis} value="${esc(t?.opening||"")}"></div>
            <div class="field"><label>Estimated value (₹)</label>
              <input type="number" min="0" step="1" id="tdValue" ${dis} value="${t?.value??""}" placeholder="optional">
              <div class="hint" id="tdValueEcho">${t?.value?esc(inr(t.value)):"&nbsp;"}</div></div>
            <div class="field span2"><label>Owner</label><select id="tdOwner" ${dis}>
              <option value="">— nobody yet —</option>${people}</select></div>
            <div class="field span3"><label>Notes</label>
              <textarea id="tdNotes" rows="2" ${dis} placeholder="Scope, conditions, what is outstanding">${esc(t?.notes||"")}</textarea></div>
          </div>
        </div>

        <div class="fsec">
          <div class="fsec-h"><b>Papers</b><span class="fsec-n">${wr?"drop a file into whichever tray it belongs in":"download only"}</span></div>
          <div class="file-cols" id="tdFiles">${fileBox("tender")}${fileBox("work_order")}</div>
          <input type="file" id="tdFile" multiple style="display:none">
        </div>

        <div id="tdEmd">${emdHTML()}</div>
      </div>
      <div class="m-actions">
        ${canDelete?`<button type="button" class="btn" id="tdDelete" style="color:var(--critical)">Delete</button>`:""}
        <div class="grow"></div>
        <button type="button" class="btn" id="tdCancel">${wr?"Cancel":"Close"}</button>
        ${wr?`<button class="btn primary" type="submit">${t?"Save changes":"File this tender"}</button>`:""}</div>
    </form></div>`);

  let dropKind = "tender";
  function wireFiles(){
    $("#tdFiles").innerHTML = fileBox("tender") + fileBox("work_order");
    document.querySelectorAll("[data-tdopen],[data-tdget]").forEach(el=>el.addEventListener("click",()=>{
      const f = TFILES.find(x=>x.id===(el.dataset.tdopen||el.dataset.tdget)); if(!f) return;
      const w = window.open("", "_blank");
      openTenderFile(f, !!el.dataset.tdget, w);
    }));
    document.querySelectorAll("[data-tddel]").forEach(el=>el.addEventListener("click", async ()=>{
      const f = TFILES.find(x=>x.id===el.dataset.tddel); if(!f) return;
      el.disabled=true; if(await deleteTenderFile(f)){ toast("File removed"); wireFiles(); } else el.disabled=false;
    }));
    document.querySelectorAll("[data-tddrop]").forEach(el=>el.addEventListener("click",()=>{
      const [k,i] = el.dataset.tddrop.split(":"); pending[k].splice(Number(i),1); wireFiles();
    }));
    document.querySelectorAll("[data-drop]").forEach(el=>{
      el.addEventListener("click",()=>{ dropKind = el.dataset.drop; $("#tdFile").click(); });
      ["dragenter","dragover"].forEach(ev=>el.addEventListener(ev,e=>{ e.preventDefault(); el.classList.add("hot"); }));
      ["dragleave","drop"].forEach(ev=>el.addEventListener(ev,e=>{ e.preventDefault(); el.classList.remove("hot"); }));
      el.addEventListener("drop",e=>{ dropKind = el.dataset.drop; take(e.dataTransfer&&e.dataTransfer.files); });
    });
  }
  function take(list){
    [...(list||[])].forEach(f=>{
      if(f.size > DOC_MAX){ toast(`"${f.name}" is ${fmtBytes(f.size)} — the limit is 25 MB.`); return; }
      pending[dropKind].push(f);
    });
    wireFiles();
  }
  $("#tdFile").addEventListener("change",e=>{ take(e.target.files); e.target.value=""; });
  wireFiles();
  /* 12500000 is unreadable at a glance; show it back as ₹1,25,00,000 */
  const vIn=$("#tdValue"), vEcho=$("#tdValueEcho");
  vIn.addEventListener("input",()=>{ vEcho.innerHTML = vIn.value==="" ? "&nbsp;" : esc(inr(vIn.value)); });

  function wireEmd(){
    if(!seeEmd) return;
    $("#tdEmd").innerHTML = emdHTML();
    document.querySelectorAll(".emdf").forEach(el=>el.addEventListener("input",()=>{
      const r = emdRows[Number(el.dataset.i)]; if(!r) return;
      const f = el.dataset.f;
      r[f] = f==="amount" ? Number(el.value||0) : el.value;
      r._dirty = true;
      if(f==="status" || f==="amount") wireEmd();      // the header total follows along
    }));
    document.querySelectorAll("[data-emddel]").forEach(el=>el.addEventListener("click",()=>{
      const r = emdRows[Number(el.dataset.emddel)];
      if(r && r.id && !r._new) emdGone.push(r.id);
      emdRows.splice(Number(el.dataset.emddel),1); wireEmd();
    }));
    const add = $("#emdAdd");
    if(add) add.addEventListener("click",()=>{
      emdRows.push({_new:true, site:$("#tdSite")?$("#tdSite").value.trim():"", amount:0,
        mode:"online", status:"not_received", ref:"", receivedOn:"", paidOn:"", note:""});
      wireEmd();
    });
  }
  wireEmd();

  $("#tdCancel").addEventListener("click",closeModal);
  const del = $("#tdDelete");
  if(del) del.addEventListener("click", async ()=>{
    if(!confirm("Delete this tender, its papers and its EMD lines? This cannot be undone.")) return;
    del.disabled = true;
    const files = tFilesOf(t.id);
    if(await guard(()=>DB.del("dat_tenders", t.id).then(()=>true)) === null){ del.disabled=false; return; }
    if(files.length) await sb.storage.from(TENDER_BUCKET).remove(files.map(f=>f.path)).catch(()=>{});
    TFILES = TFILES.filter(f=>f.tender!==t.id);
    EMDS   = EMDS.filter(e=>e.tender!==t.id);
    const i = TENDERS.findIndex(x=>x.id===t.id); if(i>-1) TENDERS.splice(i,1);
    toast("Tender deleted"); closeModal(); render();
  });

  const form = $("#tenderForm");
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    if(!wr) return;
    const title = $("#tdTitle").value.trim(); if(!title) return;
    const vals = {title, site_name:$("#tdSite").value.trim(), authority:$("#tdAuth").value.trim(),
      ref_no:$("#tdRef").value.trim(), status:$("#tdMStatus").value,
      submit_date:$("#tdSubmit").value || null, opening_date:$("#tdOpen").value || null,
      value_amount:$("#tdValue").value===""?null:Number($("#tdValue").value),
      owner:$("#tdOwner").value || null, notes:$("#tdNotes").value.trim()};
    const btn = form.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="Saving…";
    let row;
    if(t) row = await guard(()=>DB.upd("dat_tenders", t.id, vals));
    else  row = await guard(()=>DB.ins("dat_tenders", {...vals, created_by:me.id}));
    if(!row){ btn.disabled=false; btn.textContent = t?"Save changes":"File this tender"; return; }
    const saved = mapTender(row);
    if(t) Object.assign(t, saved); else TENDERS.unshift(saved);

    const nPending = pending.tender.length + pending.work_order.length;
    if(nPending){
      btn.textContent = `Attaching ${nPending} file${nPending===1?"":"s"}…`;
      for(const kind of ["tender","work_order"])
        for(const f of pending[kind]) await uploadTenderFile(saved.id, kind, f);
      pending = {tender:[], work_order:[]};
    }

    if(wrEmd){
      btn.textContent = "Saving EMD…";
      for(const gid of emdGone){
        if(await guard(()=>DB.del("dat_tender_emd", gid).then(()=>true)) !== null){
          const i = EMDS.findIndex(x=>x.id===gid); if(i>-1) EMDS.splice(i,1);
        }
      }
      emdGone = [];
      for(const r of emdRows){
        const body = {tender_id:saved.id, site_name:r.site||"", amount:Number(r.amount)||0,
          mode:r.mode||"online", status:r.status||"not_received",
          paid_on:r.paidOn||null, received_on:r.receivedOn||null,
          ref_no:r.ref||"", note:r.note||""};
        if(r._new){
          const er = await guard(()=>DB.ins("dat_tender_emd", {...body, created_by:me.id}));
          if(er) EMDS.push(mapEmd(er));
        } else if(r._dirty){
          const er = await guard(()=>DB.upd("dat_tender_emd", r.id, body));
          if(er){ const i=EMDS.findIndex(x=>x.id===r.id); if(i>-1) EMDS[i]=mapEmd(er); }
        }
      }
    }

    TENDERS.sort((a,b)=>(a.submit||"9999").localeCompare(b.submit||"9999") || b.ts-a.ts);
    if(!t) addEvent("move",`filed a tender — ${title}`);
    toast(t?"Tender updated ✓":"Tender filed ✓");
    closeModal(); render();
  });
}

/* ================= legal repository =================
   A register of legal matters — contracts, cases, notices, licences — each
   with its own fields and its own attached files. Who may read it, add to it
   and edit it is decided by dat_can_legal() in TRACKER-UPDATE-09.sql: the CEO,
   every VP, and anyone in the Legal department. Everyone else gets nothing
   back from the database at all, Admins included. Deleting a matter stays with
   whoever filed it (or an Admin), the same rule the Documents tab follows. */
const LEGAL_BUCKET = "dat-legal";
const LEGAL_TYPES  = {contract:"Contract", agreement:"Agreement", case:"Case",
                      notice:"Notice", licence:"Licence", other:"Other"};
const LEGAL_STATUS = {draft:"Draft", active:"Active", pending:"Pending",
                      expired:"Expired", closed:"Closed"};
const LEGAL_OPEN   = ["draft","active","pending","expired"];   // everything but closed
const legalFilesOf = id => LEGAL_FILES.filter(f=>f.legal===id);
const legalOf      = id => LEGAL.find(m=>m.id===id);
/* days until expiry — negative once it is past, null when there is no date */
function legalDays(m){ if(!m.expiry) return null;
  return Math.round((new Date(m.expiry+"T00:00:00") - todayD) / DAY); }
/* what leadership actually needs chasing: anything still open, with an expiry
   date inside the next 30 days or already behind us */
function legalAlerts(){
  if(!canLegal(state.me)) return [];
  return LEGAL.filter(m=>m.status!=="closed" && legalDays(m)!==null && legalDays(m) <= 30);
}
function legalExpiryChip(m){
  const d = legalDays(m);
  if(d===null) return `<span style="color:var(--muted)">—</span>`;
  if(m.status==="closed") return `<span style="color:var(--muted)">${esc(fmtDate(m.expiry))}</span>`;
  if(d < 0)  return `<span class="chip overdue">${esc(fmtDate(m.expiry))} · ${Math.abs(d)}d ago</span>`;
  if(d <= 30) return `<span class="chip today">${esc(fmtDate(m.expiry))} · ${d}d left</span>`;
  return esc(fmtDate(m.expiry));
}
const legalStatusChip = m => `<span class="chip ${m.status==="closed"?"done":m.status==="expired"?"overdue":m.status==="pending"?"today":"p-low"}">${esc(LEGAL_STATUS[m.status]||m.status)}</span>`;

async function uploadLegalFile(matterId, file){
  if(file.size > DOC_MAX){ toast(`"${file.name}" is ${fmtBytes(file.size)} — the limit is 25 MB.`); return null; }
  const safe = file.name.replace(/[^\w.\-]+/g,"_").slice(-80);
  const path = `${matterId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
  const {error:upErr} = await sb.storage.from(LEGAL_BUCKET)
    .upload(path, file, {contentType:file.type||"application/octet-stream", upsert:false});
  if(upErr){
    console.error(upErr);
    toast(/bucket not found/i.test(upErr.message||"")
      ? "Legal file storage is not set up yet — run TRACKER-UPDATE-09.sql."
      : (upErr.message || "Upload failed."));
    return null;
  }
  const row = await guard(()=>DB.ins("dat_legal_files",{legal_id:matterId, path,
    file_name:file.name, mime:file.type||"", size_bytes:file.size, uploaded_by:state.me.id}));
  if(!row){ await sb.storage.from(LEGAL_BUCKET).remove([path]).catch(()=>{}); return null; }
  const mapped = mapLegalFile(row); LEGAL_FILES.unshift(mapped); return mapped;
}
async function openLegalFile(f, asDownload, win){
  const {data,error} = await sb.storage.from(LEGAL_BUCKET)
    .createSignedUrl(f.path, 120, asDownload ? {download: f.file||true} : {});
  if(error||!data){ if(win) win.close(); console.error(error);
    toast("Could not open that file — it may have been removed."); return; }
  if(win) win.location.href = data.signedUrl; else window.open(data.signedUrl,"_blank","noopener");
}
async function deleteLegalFile(f){
  if(await guard(()=>DB.del("dat_legal_files", f.id).then(()=>true)) === null) return false;
  await sb.storage.from(LEGAL_BUCKET).remove([f.path]).catch(()=>{});
  const i = LEGAL_FILES.findIndex(x=>x.id===f.id); if(i>-1) LEGAL_FILES.splice(i,1);
  return true;
}

function legalRows(){
  const q = state.legalQ.trim().toLowerCase();
  return LEGAL.filter(m=>{
    if(state.legalType!=="all" && m.type!==state.legalType) return false;
    if(state.legalStatus==="open"   && m.status==="closed") return false;
    if(state.legalStatus==="alerts" && !(m.status!=="closed" && legalDays(m)!==null && legalDays(m)<=30)) return false;
    if(!["all","open","alerts"].includes(state.legalStatus) && m.status!==state.legalStatus) return false;
    if(!q) return true;
    return [m.title, m.party, m.project, m.ref, m.notes, LEGAL_TYPES[m.type]||"", U(m.owner)?.name||""]
      .join(" ").toLowerCase().includes(q);
  });
}

/* One matter: its fields, and the files hanging off it. Files picked while the
   matter is still new are held back and uploaded once it has an id — so a
   half-created matter never leaves an orphaned file in the bucket. */
function openLegalModal(id){
  const me = state.me;
  if(!canLegal(me)){ toast("The legal repository is for the CEO, the VPs and the Legal department."); return; }
  const m  = id ? legalOf(id) : null;
  const wr = canEdit(me, "legal");
  if(!m && !wr){ toast("You can read the legal repository but not add to it."); return; }
  const mine = wr && (!m || m.createdBy===me.id || isAdmin(me));
  const dis  = wr ? "" : "disabled";
  let pending = [];

  function filesHTML(){
    const fs = m ? legalFilesOf(m.id) : [];
    return `<div class="file-box">
      <div class="fb-h">📎 Attached<span>${(fs.length+pending.length)||"none"}</span></div>
      ${wr?`<div class="drop-mini" id="lgDrop"><b>Choose a file</b> or drag it here — up to 25 MB each</div>`:""}
      ${fs.map(f=>`<div class="log-entry">
        <div class="file-ic">${esc(((f.file||"").split(".").pop()||"file").slice(0,4))}</div>
        <div style="min-width:0"><div class="doc-name" data-lgopen="${f.id}">${esc(f.file||"file")}</div>
          <div class="lmeta">${esc(U(f.by)?.name||"Someone")} · ${esc(relDay(new Date(f.ts).toISOString().slice(0,10)))}${f.size?` · ${fmtBytes(f.size)}`:""}</div></div>
        <div class="acts" style="opacity:1">
          <button type="button" class="mini-btn" data-lgget="${f.id}">↓</button>
          ${wr?`<button type="button" class="mini-btn" data-lgdel="${f.id}" style="color:var(--critical)">✕</button>`:""}</div>
      </div>`).join("")}
      ${pending.map((f,i)=>`<div class="log-entry" style="opacity:.7">
        <div class="file-ic">${esc(((f.name||"").split(".").pop()||"file").slice(0,4))}</div>
        <div style="min-width:0"><div class="doc-name">${esc(f.name)}</div>
          <div class="lmeta">on save · ${fmtBytes(f.size)}</div></div>
        <div class="acts" style="opacity:1"><button type="button" class="mini-btn" data-lgdrop="${i}">✕</button></div>
      </div>`).join("")}
      ${(!fs.length && !pending.length)?`<div style="font-size:12px;color:var(--muted);padding:2px">Nothing attached yet.</div>`:""}</div>`;
  }

  const lgPeople = liveUsers().sort((a,b)=>a.name.localeCompare(b.name))
    .map(u=>`<option value="${u.id}" ${m?.owner===u.id?"selected":""}>${esc(u.name)} · ${esc(titleOf(u))}</option>`).join("");
  modal(`<div class="modal wide tall">
    <div class="m-head">
      <h3>${m?esc(m.title):"New legal matter"}</h3>
      <div class="msub">${m
        ? `${esc(LEGAL_TYPES[m.type]||m.type)}${m.party?" · "+esc(m.party):""} · ${esc(LEGAL_STATUS[m.status]||m.status)}${m.createdBy?` · filed by ${esc(U(m.createdBy)?.name||"someone")}`:""}${m.updatedAt?` · changed ${timeAgo(m.updatedAt)}`:""}`
        : "Contracts, cases, notices and licences. Only the CEO, the VPs and the Legal department can ever see this."}${wr?"":" — read only"}</div>
    </div>
    <form id="legalForm">
      <div class="m-body">
        <div class="fsec">
          <div class="fsec-h"><b>The matter</b></div>
          <div class="f-grid f-3">
            <div class="field span3"><label>Title</label>
              <input id="lgTitle" required maxlength="140" ${dis} value="${esc(m?.title||"")}" placeholder="e.g. D2D collection agreement — Sikar Nagar Parishad"></div>
            <div class="field"><label>Type</label><select id="lgMType" ${dis}>
              ${Object.entries(LEGAL_TYPES).map(([k,v])=>`<option value="${k}" ${(m?.type||"contract")===k?"selected":""}>${esc(v)}</option>`).join("")}</select></div>
            <div class="field"><label>Counterparty</label>
              <input id="lgParty" maxlength="120" ${dis} value="${esc(m?.party||"")}" placeholder="ULB, vendor, client, opposing party"></div>
            <div class="field"><label>Project / site</label>
              <input id="lgProject" maxlength="120" ${dis} value="${esc(m?.project||"")}" placeholder="e.g. Vidisha MSW, Cluster 1"></div>

            <div class="field"><label>Status</label><select id="lgMStatus" ${dis}>
              ${Object.entries(LEGAL_STATUS).map(([k,v])=>`<option value="${k}" ${(m?.status||"active")===k?"selected":""}>${esc(v)}</option>`).join("")}</select></div>

        <div class="fsec">

        ${wr?`<button class="btn primary" type="submit">${m?"Save changes":"File this matter"}</button>`:""}</div>
    </form></div>`);

  function wireFiles(){
    $("#lgFiles").innerHTML = filesHTML();
    document.querySelectorAll("[data-lgopen],[data-lgget]").forEach(el=>el.addEventListener("click",()=>{
      const f = LEGAL_FILES.find(x=>x.id===(el.dataset.lgopen||el.dataset.lgget)); if(!f) return;
      const w = window.open("", "_blank");
      openLegalFile(f, !!el.dataset.lgget, w);
    }));
    document.querySelectorAll("[data-lgdel]").forEach(el=>el.addEventListener("click", async ()=>{
      const f = LEGAL_FILES.find(x=>x.id===el.dataset.lgdel); if(!f) return;
      el.disabled=true; if(await deleteLegalFile(f)){ toast("File removed"); wireFiles(); } else el.disabled=false;
    }));
    document.querySelectorAll("[data-lgdrop]").forEach(el=>el.addEventListener("click",()=>{
      pending.splice(Number(el.dataset.lgdrop),1); wireFiles();
    }));
    const drop = $("#lgDrop");
    if(drop){
      drop.addEventListener("click",()=>$("#lgFile").click());
      ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add("hot"); }));
      ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove("hot"); }));
      drop.addEventListener("drop",e=>take(e.dataTransfer&&e.dataTransfer.files));
    }
  }
  function take(list){
    [...(list||[])].forEach(f=>{
      if(f.size > DOC_MAX){ toast(`"${f.name}" is ${fmtBytes(f.size)} — the limit is 25 MB.`); return; }
      pending.push(f);
    });
    wireFiles();
  }
  const inp=$("#lgFile");
  inp.addEventListener("change",()=>{ take(inp.files); inp.value=""; });
  wireFiles();

  $("#lgCancel").addEventListener("click",closeModal);

  if(del) del.addEventListener("click", async ()=>{
    if(!confirm("Delete this matter and every file attached to it? This cannot be undone.")) return;
    del.disabled = true;
    const files = legalFilesOf(m.id);
    if(await guard(()=>DB.del("dat_legal", m.id).then(()=>true)) === null){ del.disabled=false; return; }
    if(files.length) await sb.storage.from(LEGAL_BUCKET).remove(files.map(f=>f.path)).catch(()=>{});
    LEGAL_FILES = LEGAL_FILES.filter(f=>f.legal!==m.id);
    const i = LEGAL.findIndex(x=>x.id===m.id); if(i>-1) LEGAL.splice(i,1);
    toast("Matter deleted"); closeModal(); render();
  });

  $("#legalForm").addEventListener("submit", async e=>{

    if(!wr) return;
    const title = $("#lgTitle").value.trim(); if(!title) return;
    const vals = {title,
      matter_type:$("#lgMType").value, status:$("#lgMStatus").value,
      counterparty:$("#lgParty").value.trim(), project:$("#lgProject").value.trim(),
      ref_no:$("#lgRef").value.trim(), owner:$("#lgOwner").value || null,
      start_date:$("#lgStart").value || null, expiry_date:$("#lgExpiry").value || null,
      notes:$("#lgNotes").value.trim()};
    const btn = $("#legalForm button[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
    let row;
    if(m) row = await guard(()=>DB.upd("dat_legal", m.id, vals));
    else   row = await guard(()=>DB.ins("dat_legal", {...vals, created_by:me.id}));
    if(!row){ btn.disabled=false; btn.textContent = m?"Save changes":"File this matter"; return; }
    const saved = mapLegal(row);
    if(m) Object.assign(m, saved); else LEGAL.unshift(saved);
    if(pending.length){
      btn.textContent = `Attaching ${pending.length} file${pending.length===1?"":"s"}…`;
      for(const f of pending) await uploadLegalFile(saved.id, f);
      pending = [];
    }
    LEGAL.sort((a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999") || b.ts-a.ts);
    if(!m) addEvent("move",`filed a legal matter — ${title}`);
    toast(m?"Matter updated ✓":"Matter filed ✓");
    closeModal(); render();
  });
}

/* ================= team groups =================
   A group ignores the reporting hierarchy on purpose: a tender needs Legal, a
   Field Manager and Accounts in one room, and those three sit in three
   different branches. Membership decides everything, and the database enforces
   it — see TRACKER-UPDATE-06.sql. */
const GBUCKET = "dat-group-files";
const canRunGroups = u => !!u && (isAdmin(u) || u.level==="ceo" || u.level==="vp");
const memberActive = m => !m.until || m.until >= TODAY;
const groupMembers = gid => GMEMS.filter(m=>m.group===gid);
const inGroup = (gid, uid) => groupMembers(gid).some(m=>m.user===uid && memberActive(m));
const myGroups = () => GROUPS.filter(g=>g.active && inGroup(g.id, state.me.id))
  .sort((a,b)=>a.name.localeCompare(b.name));
/* the people who run groups also need to see groups they are not in, to manage them */
const manageableGroups = () => canRunGroups(state.me)
  ? GROUPS.filter(g=>g.active).sort((a,b)=>a.name.localeCompare(b.name)) : myGroups();
const msgsOf = gid => MSGS.filter(m=>m.group===gid).sort((a,b)=>a.seq-b.seq || a.ts-b.ts);

/* unread = messages newer than the last one you saw, remembered per browser */
function seenSeq(gid){ try{ return Number(localStorage.getItem("dat-seen-"+gid))||0; }catch(_){ return 0; } }
function markSeen(gid){
  const last = msgsOf(gid).slice(-1)[0]; if(!last) return;
  try{ localStorage.setItem("dat-seen-"+gid, String(last.seq)); }catch(_){}
}
const unreadIn = gid => msgsOf(gid).filter(m=>m.seq > seenSeq(gid) && m.user !== state.me.id).length;
const unreadTotal = () => myGroups().reduce((n,g)=>n+unreadIn(g.id), 0);

async function sendMessage(gid, body, file){
  const me = state.me;
  let extra = {};
  if(file){
    if(file.size > DOC_MAX){ toast(`That file is ${fmtBytes(file.size)} — the limit is 25 MB.`); return null; }
    const safe = file.name.replace(/[^\w.\-]+/g,"_").slice(-80);
    const path = `${gid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
    const {error} = await sb.storage.from(GBUCKET)
      .upload(path, file, {contentType:file.type||"application/octet-stream", upsert:false});
    if(error){
      console.error(error);
      toast(/bucket not found/i.test(error.message||"")
        ? "Group file storage is not set up — run TRACKER-UPDATE-06.sql."
        : (error.message||"Could not attach that file."));
      return null;
    }
    extra = {path, file_name:file.name, mime:file.type||"", size_bytes:file.size};
  }
  const row = await guard(()=>DB.ins("dat_messages",{group_id:gid, user_id:me.id, body:body||"", ...extra}));
  if(!row && extra.path) await sb.storage.from(GBUCKET).remove([extra.path]).catch(()=>{});
  return row;
}
async function openGroupFile(m, win){
  const {data,error} = await sb.storage.from(GBUCKET).createSignedUrl(m.path, 120, {download:m.file||true});
  if(error||!data){ if(win) win.close(); console.error(error);
    toast("Could not open that file."); return; }
  if(win) win.location.href = data.signedUrl; else window.open(data.signedUrl,"_blank","noopener");
}

        <button class="btn primary" id="gSend">Send</button>
      </div>`}
    </div>

    <div class="card card-pad">
      <div class="card-head" style="margin-bottom:6px"><div><h3 style="font-size:14px">Members</h3></div>
        <div class="spacer"></div>
        ${canRunGroups(me)?`<button class="mini-btn" id="addMember">＋ Add</button>`:""}</div>
      ${mems.length?mems.map(m=>{ const u=U(m.user); if(!u) return "";
        const expired=!memberActive(m);
        return `<div class="g-member" style="${expired?"opacity:.5":""}">
          ${avatar(u,"sm")}
          <div style="min-width:0">
            <div style="font-weight:600">${esc(u.name)}${m.user===me.id?" (you)":""}</div>
            <div style="font-size:11px;color:var(--muted)">${esc(titleOf(u))}</div>
            ${m.until?`<span class="chip ${expired?"overdue":"today"}" style="margin-top:3px">
              ${expired?"expired":"guest"} · ${expired?"was until":"until"} ${esc(fmtDate(m.until))}</span>`:""}
          </div>
          ${canRunGroups(me)?`<button class="mini-btn x" data-delmem="${m.user}" title="Remove" style="color:var(--critical)">✕</button>`:""}
        </div>`;}).join("")
      :`<div style="color:var(--muted);font-size:13px">Nobody in this group yet.</div>`}
      ${canRunGroups(me)?`<div style="font-size:11.5px;color:var(--muted);margin-top:10px">
        Add someone with an <b>until</b> date and they drop out on their own the day after. Their messages stay.</div>`:""}
    </div>
  </div>`}`;

  /* ---- wiring ---- */
  document.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{
    markSeen(state.group); state.group=b.dataset.group; markSeen(state.group); render(); }));
  const ng=$("#newGroup"); if(ng) ng.addEventListener("click",()=>openGroupModal(null));
  const eg=$("#editGroup"); if(eg) eg.addEventListener("click",()=>openGroupModal(g.id));
  const am=$("#addMember"); if(am) am.addEventListener("click",()=>openMemberModal(g.id));
  document.querySelectorAll("[data-delmem]").forEach(b=>b.addEventListener("click", async ()=>{
    const uid=b.dataset.delmem, u=U(uid);
    if(await guard(()=>sb.from("dat_group_members").delete()
        .eq("group_id",g.id).eq("user_id",uid).then(x=>{ if(x.error) throw x.error; return true; }))===null) return;
    const i=GMEMS.findIndex(m=>m.group===g.id&&m.user===uid); if(i>-1) GMEMS.splice(i,1);
    toast(`${u?.name||"They"} removed from ${g.name}`); render();
  }));
  document.querySelectorAll("[data-gfile]").forEach(el=>el.addEventListener("click",()=>{
    const m=MSGS.find(x=>x.id===el.dataset.gfile); if(!m) return;
    const w=window.open("","_blank"); openGroupFile(m, w); }));
  document.querySelectorAll("[data-delmsg]").forEach(el=>el.addEventListener("click", async ()=>{
    const m=MSGS.find(x=>x.id===el.dataset.delmsg); if(!m) return;
    if(await guard(()=>DB.del("dat_messages", m.id).then(()=>true))===null) return;
    if(m.path) await sb.storage.from(GBUCKET).remove([m.path]).catch(()=>{});
    const i=MSGS.findIndex(x=>x.id===m.id); if(i>-1) MSGS.splice(i,1);
    render();
  }));

  const log=$("#chatLog"); if(log) log.scrollTop = log.scrollHeight;
  if(g && iAmIn) markSeen(g.id);

  const fileIn=$("#gFile"), box=$("#gPickBox"), txt=$("#gText"), send=$("#gSend");
  const at=$("#gAttach"); if(at) at.addEventListener("click",()=>fileIn.click());
  function showPick(){
    if(!box) return;
    box.innerHTML = picked ? `<div class="doc-pick"><span>📎 ${esc(picked.name)}</span>
      <span style="color:var(--muted)">${fmtBytes(picked.size)}</span>
      <button class="mini-btn x" id="gClear">Remove</button></div>` : "";
    const c=$("#gClear"); if(c) c.addEventListener("click",()=>{ picked=null; fileIn.value=""; showPick(); });
  }
  if(fileIn) fileIn.addEventListener("change",()=>{
    const f=fileIn.files&&fileIn.files[0]; if(!f) return;
    if(f.size>DOC_MAX){ toast(`That file is ${fmtBytes(f.size)} — the limit is 25 MB.`); return; }
    picked=f; showPick();
  });
  async function doSend(){
    if(!g || !txt) return;
    const body=txt.value.trim();
    if(!body && !picked){ return; }
    send.disabled=true; send.textContent="Sending…";
    const row = await sendMessage(g.id, body, picked);
    send.disabled=false; send.textContent="Send";
    if(!row) return;
    MSGS.push(mapMsg(row)); picked=null; txt.value="";
    markSeen(g.id); render();
    const l=$("#chatLog"); if(l) l.scrollTop=l.scrollHeight;
  }
  if(send) send.addEventListener("click", doSend);
  if(txt) txt.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); } });
  showPick();
}

    </form></div>`);
  document.querySelectorAll("[data-gc]").forEach(b=>b.addEventListener("click",()=>{
    color=+b.dataset.gc;
    document.querySelectorAll("[data-gc]").forEach(x=>x.style.border="2.5px solid transparent");
    b.style.border="2.5px solid var(--ink)"; }));
  $("#gCancel").addEventListener("click",closeModal);
  $("#grpForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const name=$("#gName").value.trim(); if(!name) return;
    const purpose=$("#gPurpose").value.trim();
    if(g){
      const saved = await guard(()=>DB.upd("dat_groups", g.id,
        {name, purpose, color, active:$("#gActive").checked}));
      if(!saved) return;
      Object.assign(g, mapGroup(saved)); toast("Group updated ✓");
    } else {
      const saved = await guard(()=>DB.ins("dat_groups",{name, purpose, color, created_by:me.id}));
      if(!saved) return;
      GROUPS.push(mapGroup(saved));
      const picks=[...document.querySelectorAll(".gMem:checked")].map(c=>c.value);
      if(picks.length){
        const rows = picks.map(uid=>({group_id:saved.id, user_id:uid, added_by:me.id}));
        const ok = await guard(()=>sb.from("dat_group_members").insert(rows).select()
          .then(x=>{ if(x.error) throw x.error; return x.data||[]; }));
        if(ok) ok.forEach(r=>GMEMS.push(mapGMem(r)));

}

function renderTeam(){
  const me=state.me;
  /* leadership only — anyone else who lands here is sent back to their dashboard */
  if(!canSeeTeam(me)){ state.view="dashboard"; render(); return; }
  const rootId = me.level==="member" ? (me.mgr || me.id) : me.id;   // admin at member level: start from their own team
  const readOnlyNote = me.level==="member" ? `<div class="sub">Your team — tap a person to view their public profile</div>` : `<div class="sub">Your reporting line — click anyone to see their work</div>`;
  const chainUp = [];
  let p = U(rootId)?.mgr; while(p){ chainUp.unshift(U(p)); p=U(p).mgr; }

  $("#view").innerHTML = `
  <div class="card card-pad">
    <div class="card-head"><div><h3>Hierarchy</h3>${readOnlyNote}</div>
      <div class="spacer"></div>
      ${chainUp.length?`<div style="font-size:12px;color:var(--muted)">Reports up to: ${chainUp.map(u=>esc(u.name)).join(" → ")}</div>`:""}

    <div class="org"><ul>${orgNode(rootId)}</ul></div>
  </div>
  ${canManage(me)?teamTable():""}`;
  wireCommon();
}
function orgNode(id){
  const u=U(id), kids=childrenOf(id);
  const open=TASKS.filter(t=>t.assignee===id&&!t.done).length;
  const logs=LOGS.filter(l=>l.user===id&&l.date===TODAY).length;
  return `<li>
    <button class="person" data-person="${id}">
      <div class="prow">${avatar(u,"md")}<div><div class="nm">${esc(u.name)}</div><div class="tt">${esc(titleOf(u))}</div></div></div>
      <div class="pstats">${lvlBadge(u)}<span class="pstat">${open} open</span><span class="pstat">${logs} log${logs!==1?"s":""} today</span></div>
    </button>
    ${kids.length?`<ul>${kids.map(k=>orgNode(k.id)).join("")}</ul>`:""}
  </li>`;
}
function teamTable(){
  const me=state.me;
  const rows=liveUsers().filter(u=>visibleUserIds(me).includes(u.id)&&u.id!==me.id);
  const wk=[]; for(let i=6;i>=0;i--) wk.push(dOff(-i));
  return `<div class="card card-pad" style="margin-top:16px">
    <div class="card-head"><div><h3>Team workload</h3><div class="sub">Last 7 days</div></div></div>
    <div style="overflow-x:auto"><table class="simple"><thead><tr>
      <th>Person</th><th>Role</th><th style="text-align:right">Open</th><th style="text-align:right">Overdue</th>
      <th style="text-align:right">Done (7d)</th><th style="text-align:right">Logs (7d)</th></tr></thead>
    <tbody>${rows.map(u=>{
      const ot=TASKS.filter(t=>t.assignee===u.id&&!t.done);
      const od=ot.filter(t=>t.due&&t.due<TODAY).length;
      const dn=TASKS.filter(t=>t.assignee===u.id&&t.done&&wk.includes(t.doneOn)).length;
      const lg=LOGS.filter(l=>l.user===u.id&&wk.includes(l.date)).length;
      return `<tr class="click" data-person="${u.id}">
        <td><div style="display:flex;align-items:center;gap:8px">${avatar(u,"sm")}<b>${esc(u.name)}</b></div></td>
        <td><span style="color:var(--ink2)">${esc(titleOf(u))}</span></td>
        <td style="text-align:right">${ot.length}</td>
        <td style="text-align:right;${od?'color:var(--critical);font-weight:700':''}">${od}</td>
        <td style="text-align:right">${dn}</td><td style="text-align:right">${lg}</td></tr>`;}).join("")}
    </tbody></table></div></div>`;
}

/* ================= task timeline =================
   Every change to a task is written by a database trigger (TRACKER-UPDATE-03.sql),
   so this only has to read it back and say it plainly. */
const STAGE_COLORS = ["--s1","--s4","--s3","--s7","--s2","--s5","--s6","--s8"];
const fmtWhen = ts => new Date(ts).toLocaleString("en-IN",
  {day:"numeric", month:"short", hour:"numeric", minute:"2-digit", hour12:true});
function fmtDur(ms){
  if(ms==null || ms<0) return "—";
  const m=Math.floor(ms/6e4), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return d+"d"+(h%24?" "+(h%24)+"h":"");
  if(h>0) return h+"h"+(m%60?" "+(m%60)+"m":"");
  return Math.max(m,1)+"m";
}
async function loadTaskEvents(taskId){
  const {data,error} = await sb.from("dat_task_events").select("*")
    .eq("task_id", taskId).order("seq",{ascending:true});
  if(error) throw error;
  return (data||[]).map(mapTEv).sort((a,b)=>a.seq-b.seq || a.ts-b.ts);
}
/* how long the card sat in each stage, from the move events */
function stageSpans(t, evs){
  const moves = evs.filter(e=>e.kind==="moved");
  const start = evs.find(e=>e.kind==="created")?.ts ?? t.createdAt ?? (moves[0]?.ts);
  if(start==null) return [];
  const end = t.closedAt || Date.now();
  const spans=[]; let at=start, stage=evs.find(e=>e.kind==="created")?.to || moves[0]?.from || t.stage;
  moves.forEach(m=>{ spans.push({stage, ms:Math.max(0,m.ts-at)}); at=m.ts; stage=m.to; });
  spans.push({stage, ms:Math.max(0,end-at)});
  const merged={};                                   // a stage revisited adds up
  spans.forEach(s=>{ merged[s.stage]=(merged[s.stage]||0)+s.ms; });
  return Object.entries(merged).map(([stage,ms])=>({stage,ms})).filter(s=>s.ms>0);
}
function evLine(e){
  const who = U(e.actor)?.name || "Someone";
  const b = s => `<b style="color:var(--ink)">${esc(s??"—")}</b>`;
  switch(e.kind){
    case "created":  return `${esc(who)} created this task in ${b(e.to)}`;
    case "moved":    return `${esc(who)} moved it ${b(e.from)} → ${b(e.to)}`;
    case "assigned": return `${esc(who)} reassigned it ${e.from?`from ${b(e.from)} `:""}to ${b(e.to)}`;
    case "priority": return `${esc(who)} changed priority ${b(e.from)} → ${b(e.to)}`;
    case "due":      return `${esc(who)} ${e.to?`set the due date to ${b(fmtDate(e.to))}`:"removed the due date"}`;
    case "renamed":  return `${esc(who)} renamed it from ${b(e.from)}`;
    case "edited":   return `${esc(who)} edited the notes`;
    case "paused":   return `${esc(who)} paused it${e.note?` — ${b(e.note)}`:""}`;
    case "resumed":  return `${esc(who)} resumed it`;
    case "done":     return `${esc(who)} marked it done`;
    case "reopened": return `${esc(who)} reopened it`;
    case "comment":  return `${esc(who)} added a note`;
    default:         return `${esc(who)} made a change`;
  }
}
function timelineHTML(t, evs, canComment){
  const created = evs.find(e=>e.kind==="created")?.ts || t.createdAt;
  const spans = stageSpans(t, evs);
  const total = spans.reduce((a,s)=>a+s.ms,0) || 1;
  const cycle = t.startedAt ? ((t.closedAt||Date.now()) - t.startedAt) : null;
  return `
  <div class="tl-sum">
    <div class="b"><div class="k">Created</div><div class="v">${created?esc(fmtWhen(created)):"—"}</div></div>
    <div class="b"><div class="k">Started</div><div class="v">${t.startedAt?esc(fmtWhen(t.startedAt)):"Not started yet"}</div></div>
    <div class="b"><div class="k">Closed</div><div class="v">${t.closedAt?esc(fmtWhen(t.closedAt)):"Still open"}</div></div>
    <div class="b"><div class="k">${t.closedAt?"Start → close":"Open for"}</div><div class="v">${cycle!=null?esc(fmtDur(cycle)):"—"}</div></div>
    <div class="b"><div class="k">Age</div><div class="v">${created?esc(fmtDur((t.closedAt||Date.now())-created)):"—"}</div></div>
  </div>
  ${spans.length?`
  <div class="tl-bars">${spans.map((s,i)=>`<i style="width:${(s.ms/total*100).toFixed(2)}%;background:var(${STAGE_COLORS[i%STAGE_COLORS.length]})" title="${esc(s.stage)} — ${esc(fmtDur(s.ms))}"></i>`).join("")}</div>
  <div class="tl-key">${spans.map((s,i)=>`<span><i class="sw" style="background:var(${STAGE_COLORS[i%STAGE_COLORS.length]})"></i>${esc(s.stage)} · <b style="color:var(--ink2)">${esc(fmtDur(s.ms))}</b></span>`).join("")}</div>`:""}
  <div class="tl-list">
    ${evs.map(e=>`<div class="tl-row k-${esc(e.kind)}"><span class="dot"></span>
      <span>${evLine(e)}</span><span class="when">${esc(fmtWhen(e.ts))}</span>
      ${e.kind==="comment"&&e.note?`<div class="said">${esc(e.note)}</div>`:""}
    </div>`).join("")}
  </div>
  ${canComment?`<div class="tl-add">
    <input id="tlNote" maxlength="400" placeholder="Add a progress note…">
    <button class="btn sm" id="tlAdd" type="button">Add note</button></div>`:""}`;
}
/* Fills a host element with the timeline, and keeps the comment box working. */
async function mountTimeline(hostSel, t, canComment){
  const host = $(hostSel); if(!host) return;
  host.innerHTML = `<div class="tl-wrap"><div style="font-size:12px;color:var(--muted)">Loading history…</div></div>`;
  let evs;
  try { evs = await loadTaskEvents(t.id); }
  catch(err){
    console.warn("Task history unavailable:", err.message||err);
    host.innerHTML = `<div class="tl-wrap"><div style="font-size:12.5px;color:var(--muted)">
      Task history is not switched on yet — run <code>TRACKER-UPDATE-03.sql</code> in Supabase.</div></div>`;
    return;
  }
  const paint = () => {
    host.innerHTML = `<div class="tl-wrap">
      <div class="sec-h" style="margin:0 0 12px"><h2 style="font-size:14px">Timeline</h2>
        <div class="spacer"></div><span style="font-size:11.5px;color:var(--muted)">${evs.length} event${evs.length===1?"":"s"}</span></div>
      ${timelineHTML(t, evs, canComment)}</div>`;
    const btn=$("#tlAdd"), inp=$("#tlNote");
    if(!btn) return;
    const send = async () => {
      const note=inp.value.trim(); if(!note) return;
      btn.disabled=true;
      const row = await guard(()=>DB.ins("dat_task_events",
        {task_id:t.id, actor:state.me.id, kind:"comment", note}));
      btn.disabled=false;
      if(!row) return;
      evs.push(mapTEv(row)); inp.value=""; paint(); toast("Note added ✓");
    };
    btn.addEventListener("click", send);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  };
  paint();
}

function closeModal(){ $("#overlayHost").innerHTML=""; }

function openTaskModal(taskId, preset={}){
  const me=state.me;
  const t = taskId ? TASKS.find(x=>x.id===taskId) : null;
  if(t && !canEditTask(me,t)){ openTaskView(t); return; }
  const pipes = visiblePipes(me);
  if(!pipes.length){
    openInfoModal("You need a task board first",
      `A task lives on a board and moves through Start &rarr; In Progress &rarr; Pause &rarr; Done.
       There aren't any boards yet.<br><br>` +
      `Open <b>Daily Tasks</b> and create one, then come back and add tasks to it.`);
    return;
  }
  const people = assignableUsers(me);
  /* The board list follows the assignee: only boards that person owns are
     offered, so a manager can never drop work onto somebody else's board.
     The pool is every board this login loaded (not just visiblePipes) - a VP
     or the CEO can assign anyone in the company, and that person's boards
     must show even when they sit in another branch. */
  const ownPipesFor = assigneeId => PIPES.filter(p=>p.createdBy===assigneeId)
    .sort((a,b)=>a.name.localeCompare(b.name));
  /* "+ Add" on someone's board means "a task for the owner of this board" */
  const presetPipe = preset.pipe ? PIPES.find(p=>p.id===preset.pipe) : null;
  const presetOwner = presetPipe && people.some(u=>u.id===presetPipe.createdBy) ? presetPipe.createdBy : null;
  const initialAssignee = t?.assignee || preset.assignee || presetOwner || me.id;
  const initialPipes = ownPipesFor(initialAssignee);
  /* an older task can sit on a board its assignee does not own - keep that
     board selectable while editing, so saving a title fix doesn't force a move */
  const legacyPipe = t && !initialPipes.some(p=>p.id===t.pipe) ? PIPES.find(p=>p.id===t.pipe) : null;
  const requestedPipeId = t?.pipe || preset.pipe || state.pipe;
  const matchingInitialPipe = initialPipes.find(p=>p.id===requestedPipeId);
  const initialPipeId = legacyPipe ? legacyPipe.id : (matchingInitialPipe?.id || initialPipes[0]?.id || "");
  const whoName = id => esc(U(id)?.name||"this person");
  const pipeOpts = (list, sel, legacy) => list.length || legacy
    ? (legacy?`<option value="${legacy.id}" selected>${esc(legacy.name)} (current board)</option>`:"")
      + list.map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("")
    : "";
  modal(`<div class="modal${t?" wide":""}">
    <h3>${t?"Edit task":"New task"}</h3>
    <div class="msub">${t?"Update details, move stage, or reassign.":"Add a task to a board."}</div>
    <form id="taskForm" class="f-grid">
      <div class="field"><label>Title</label><input id="tTitle" required maxlength="120" value="${esc(t?.title||"")}" placeholder="e.g. Follow up with Kota South on revised pricing"></div>
      <div class="f-grid f-2">
        <div class="field"><label>Assign to</label><select id="tWho">
          ${people.map(u=>`<option value="${u.id}" ${initialAssignee===u.id?"selected":""}>${esc(u.name)} — ${esc(titleOf(u))}</option>`).join("")}</select></div>
        <div class="field"><label>Board</label><select id="tPipe" required>
          ${pipeOpts(initialPipes, initialPipeId, legacyPipe) || `<option value="">No board owned by ${whoName(initialAssignee)}</option>`}</select>
          <div id="tPipeHint" style="font-size:11.5px;color:${initialPipes.length||legacyPipe?"var(--muted)":"var(--critical)"};margin-top:5px">${initialPipes.length||legacyPipe
            ? `Showing only ${whoName(initialAssignee)}'s boards.`
            : `${whoName(initialAssignee)} has no board yet — ask them to create one in Daily Tasks first.`}</div></div>
      </div>
      <div class="f-grid f-2">
        <div class="field"><label>Stage</label><select id="tStage">
          ${STAGES.map(s=>`<option ${((t?.stage||preset.stage||STAGE_START)===s)?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
        <div class="field"><label>Priority</label><select id="tPr">
          ${["urgent","high","medium","low"].map(p=>`<option value="${p}" ${(t?.pr||"medium")===p?"selected":""}>${p[0].toUpperCase()+p.slice(1)}</option>`).join("")}</select></div>
      </div>
      <div class="f-grid f-2">
        <div class="field"><label>Due date</label><input type="date" id="tDue" value="${t?.due||""}"></div>
        <div class="field"><label>&nbsp;</label><div class="check-list"><label>
          <input type="checkbox" id="tDone" ${t?.done?"checked":""}> Mark as done</label></div></div>
      </div>
      <div class="field" id="tPauseWrap" style="display:${(t?.stage||preset.stage)===STAGE_PAUSE?"block":"none"}">
        <label>Why is it paused?</label>
        <select id="tPauseWhy">${PAUSE_REASONS.map(r=>`<option ${((t?.pauseReason||"").split(" — ")[0]===r)?"selected":""}>${esc(r)}</option>`).join("")}</select>
        <div style="font-size:11.5px;color:var(--muted);margin-top:5px">Your reporting line sees this on their dashboard.</div></div>
      <div class="field"><label>Notes</label><textarea id="tDesc" placeholder="Context, next step, links…">${esc(t?.desc||"")}</textarea></div>
      <div class="m-actions">
        ${t?`<button type="button" class="btn danger sm" id="tDel">Delete</button>`:""}
        <div class="grow"></div>
        <button type="button" class="btn" id="tCancel">Cancel</button>
        <button class="btn primary" type="submit">${t?"Save changes":"Create task"}</button>
      </div>
    </form>
    <div id="tlHost"></div>
  </div>`);
  if(t) mountTimeline("#tlHost", t, true);
  const whoPick=$("#tWho"), boardPick=$("#tPipe"), boardHint=$("#tPipeHint");
  whoPick.addEventListener("change",()=>{
    const assigneeId=whoPick.value, assigneePipes=ownPipesFor(assigneeId);
    /* going back to the original assignee of an old task brings its board back */
    const keepLegacy = legacyPipe && t && assigneeId===t.assignee ? legacyPipe : null;
    const preferred = assigneePipes.find(p=>p.id===state.pipe) || assigneePipes[0];
    boardPick.innerHTML = pipeOpts(assigneePipes, keepLegacy?keepLegacy.id:preferred?.id, keepLegacy)
      || `<option value="">No board owned by ${whoName(assigneeId)}</option>`;
    const has = assigneePipes.length || keepLegacy;
    boardHint.style.color = has ? "var(--muted)" : "var(--critical)";
    boardHint.textContent = has
      ? `Showing only ${U(assigneeId)?.name||"this person"}'s boards.`
      : `${U(assigneeId)?.name||"This person"} has no board yet — ask them to create one in Daily Tasks first.`;
  });
  $("#tStage").addEventListener("change",()=>{
    $("#tPauseWrap").style.display = $("#tStage").value===STAGE_PAUSE ? "block" : "none";
  });
  $("#tCancel").addEventListener("click",closeModal);
  const del=$("#tDel"); if(del) del.addEventListener("click", async ()=>{
    if(await guard(()=>DB.del("dat_tasks", t.id).then(()=>true))===null) return;
    TASKS.splice(TASKS.findIndex(x=>x.id===t.id),1);
    addEvent("move",`deleted “${t.title}”`); closeModal(); toast("Task deleted"); render();
  });
  $("#taskForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const vals={ title:$("#tTitle").value.trim(), pipe:$("#tPipe").value, stage:$("#tStage").value,
      assignee:$("#tWho").value, pr:$("#tPr").value, due:$("#tDue").value||null,
      desc:$("#tDesc").value.trim(), done:$("#tDone").checked };
    if(!vals.title) return;
    if(!vals.pipe){
      openInfoModal("No task board for this person", `${whoName($("#tWho").value)} doesn't own a board yet. Ask them to create one in <b>Daily Tasks</b>, then assign the task to it.`);
      return;
    }
    /* ticking done and choosing the Done stage are the same act - keep them in
       step here too, so the screen never disagrees with the database */
    if(vals.done) vals.stage = STAGE_DONE;
    if(vals.stage === STAGE_DONE) vals.done = true;
    const row = {pipeline_id:vals.pipe, stage:vals.stage, title:vals.title, description:vals.desc,
      assignee:vals.assignee, priority:vals.pr, due:vals.due, done:vals.done,
      done_on: vals.done ? (t?.doneOn||TODAY) : null,
      pause_reason: vals.stage===STAGE_PAUSE ? ($("#tPauseWhy")?.value || null) : null};
    if(t){
      const saved = await guard(()=>DB.upd("dat_tasks", t.id, row));
      if(!saved) return;
      const wasDone=t.done; Object.assign(t, mapTask(saved));
      if(!wasDone&&t.done) addEvent("done",`completed “${t.title}”`);
      toast("Task updated ✓");
    } else {
      const saved = await guard(()=>DB.ins("dat_tasks", {...row, created_by:me.id}));
      if(!saved) return;
      TASKS.push(mapTask(saved));
      addEvent("move",`created “${vals.title}”${vals.assignee!==me.id?" for "+U(vals.assignee).name:""}`);
      toast("Task created ✓");
    }
    state.pipe=vals.pipe;
    closeModal(); render();
  });
}
