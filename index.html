function openPipeModal(pipeId){
  const me=state.me;
  const p = pipeId ? PIPES.find(x=>x.id===pipeId) : null;
  const depts = DEPTS.length ? DEPTS : [...new Set(USERS.map(u=>u.dept))];
  const defDept = p?.dept || (depts.includes(me.dept) ? me.dept : depts[0]);
  let stages = [...STAGES];                 // fixed for every board
  let color = p?.color || 1;
  modal(`<div class="modal">
    <h3>${p?"Edit task board":"New task board"}</h3>
    <div class="msub">A board holds daily tasks for one area of work. Every board uses the same four stages, so “paused” means the same thing across the company.</div>
    <form id="pipeForm" class="f-grid">
      <div class="f-grid f-2">
        <div class="field"><label>Board name</label><input id="pName" required maxlength="40" value="${esc(p?.name||"")}" placeholder="e.g. Field operations"></div>
        <div class="field"><label>Department</label><select id="pDept">
          ${depts.map(d=>`<option ${defDept===d?"selected":""}>${esc(d)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Colour</label><div class="color-row" id="pColors">
        ${[1,2,3,4,5,7,8].map(c=>`<button type="button" class="color-dot ${c===color?"sel":""}" data-c="${c}" style="background:var(--s${c})"></button>`).join("")}</div></div>
      <div class="field"><label>Stages</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${STAGES.map((sg,i)=>`<span class="chip">${i+1}. ${esc(sg)}</span>`).join("")}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px">The same four on every board — that is what makes the team view and the reports comparable. Pausing asks for a reason.</div></div>
      <div class="m-actions">
        ${p&&(me.level==="ceo"||p.createdBy===me.id)?`<button type="button" class="btn danger sm" id="pDel">Delete board</button>`:""}
        <div class="grow"></div>
        <button type="button" class="btn" id="pCancel">Cancel</button>
        <button class="btn primary" type="submit">${p?"Save changes":"Create board"}</button>
      </div>
    </form>
  </div>`);
  function syncStagesFromInputs(){ /* stages are fixed - nothing to read back */ }
  $("#pColors").addEventListener("click",e=>{ const d=e.target.closest(".color-dot"); if(!d) return;
    color=+d.dataset.c; document.querySelectorAll(".color-dot").forEach(x=>x.classList.toggle("sel",+x.dataset.c===color)); });
  $("#pCancel").addEventListener("click",closeModal);
  const pd=$("#pDel"); if(pd) pd.addEventListener("click", async ()=>{
    if(TASKS.some(t=>t.pipe===p.id)){ if(!confirm(`Delete “${p.name}” and its ${TASKS.filter(t=>t.pipe===p.id).length} tasks?`)) return; }
    if(await guard(()=>DB.del("dat_pipelines", p.id).then(()=>true))===null) return;
    for(let i=TASKS.length-1;i>=0;i--) if(TASKS[i].pipe===p.id) TASKS.splice(i,1);   // DB cascades
    PIPES.splice(PIPES.findIndex(x=>x.id===p.id),1);
    state.pipe=visiblePipes(me)[0]?.id||null; closeModal(); toast("Board deleted"); render();
  });
  $("#pipeForm").addEventListener("submit", async e=>{
    e.preventDefault(); syncStagesFromInputs();
    stages=stages.map(s=>s.trim()).filter(Boolean);
    if(stages.length<2){ toast("Need at least 2 stages"); return; }
    if(new Set(stages.map(s=>s.toLowerCase())).size!==stages.length){ toast("Stage names must be unique"); return; }
    const name=$("#pName").value.trim(); if(!name) return;
    if(p){
      const saved = await guard(()=>DB.upd("dat_pipelines", p.id, {name, dept:$("#pDept").value, color, stages}));
      if(!saved) return;
      // a stage that no longer exists: move those tasks back to the first stage
      const orphans = TASKS.filter(t=>t.pipe===p.id && !stages.includes(t.stage));
      for(const t of orphans){
        const r = await guard(()=>DB.upd("dat_tasks", t.id, {stage:stages[0], done:false, done_on:null}));
        if(r) Object.assign(t, mapTask(r));
      }
      Object.assign(p, mapPipe(saved));
      toast(orphans.length ? `Pipeline updated ✓ — ${orphans.length} task(s) moved to “${stages[0]}”` : "Pipeline updated ✓");
    } else {
      /* Not wrapped in guard(): a board that will not save is worth an exact
         message, because "no permission" is almost never the real reason. */
      let saved = null;
      try{
        saved = await DB.ins("dat_pipelines",
          {name, dept:$("#pDept").value, color, stages, created_by:me.id});
      }catch(err){
        console.error("Pipeline create failed:", err);
        const msg = (err && (err.message || err.error_description)) || String(err);
        if(/row-level security/i.test(msg)){
          openInfoModal("The board could not be saved",
            `The database saved it but then refused to hand it back, which happens when the
             new pipeline has no owner recorded against it.<br><br>
             Run <b>TRACKER-UPDATE-05.sql</b> in the Supabase SQL Editor — it makes the database
             fill the owner in itself — then reload this page with <b>Ctrl+Shift+R</b> and try again.`);
        } else {
          openInfoModal("The board could not be saved",
            `The database refused it with:<br><br><code>${esc(msg)}</code>`);
        }
        return;
      }
      if(!saved) return;
      PIPES.push(mapPipe(saved)); state.pipe=saved.id; state.view="pipelines";
      addEvent("move",`created pipeline “${name}”`);
      toast("Pipeline created ✓");
    }
    closeModal(); render();
  });
}

    if(ROLES.some(x=>x.name.toLowerCase()===name.toLowerCase() && x.id!==roleId)){ toast("That job role already exists."); return; }
    const sel=[...document.querySelectorAll(".jPipe:checked")].map(c=>c.value);
    const vals={name, dept:$("#jDept").value, level:$("#jLevel").value, pipes:sel};
    if(PRIVPIPES_READY) vals.private_pipes = !!($("#jPrivate") && $("#jPrivate").checked);
    if(ACCESS_READY){
      const acl = [];
      document.querySelectorAll(".jAccEd:checked").forEach(c=>acl.push(c.value, c.value+":edit"));
      document.querySelectorAll(".jAcc:checked").forEach(c=>{ if(!acl.includes(c.value)) acl.push(c.value); });
      vals.access = acl;
      if(LEADERSHIP_READY) vals.leadership = acl.includes("docs_all");
    } else if(LEADERSHIP_READY) vals.leadership = !!($("#jLead") && $("#jLead").checked);
    if(r){
      const saved = await guard(()=>DB.upd("dat_job_roles", r.id, {...vals, active:$("#jActive")?$("#jActive").checked:true}));
      if(!saved) return;
      Object.assign(r, mapRole(saved)); toast("Job role updated ✓");
    } else {
      const saved = await guard(()=>DB.ins("dat_job_roles", {...vals, active:true}));
      if(!saved) return;
      ROLES.push(mapRole(saved));
      addEvent("move",`created the job role “${name}”`); toast("Job role created ✓");
    }
    if(preset.fromReq) await resolveReq(preset.fromReq,"approved","");
    closeModal(); render();
  });
}

/* One chronological story of a person's period: what they did to tasks, what
   they wrote in the daily log, what they attached. The task half comes from the
   history table, so it is the same record the task timeline shows. */
function stageChip(t){
  const cls = t.stage===STAGE_DONE ? "done" : t.stage===STAGE_PAUSE ? "today"
            : t.stage===STAGE_WIP ? "" : "p-low";
  return `<span class="chip ${cls}">${esc(t.stage)}</span>`;
}
/* The tasks this person has, and where each one stands. Deliberately NOT an
   event stream: a manager reviewing someone wants the list of work and its
   status, not forty lines of every drag and drop. The blow-by-blow is still
   there on the task itself. */
function personTasksHTML(id){
  const from = periodFrom();
  const mine = TASKS.filter(t=>t.assignee===id)
    .filter(t=>{
      const added = t.createdAt ? iso(new Date(t.createdAt)) : null;
      const closed = t.doneOn;
      return (added && added >= from) || (closed && closed >= from) || !t.done;
    })
    .sort((a,b)=>{
      const rank = x => x.stage===STAGE_PAUSE?0 : x.stage===STAGE_WIP?1 : x.stage===STAGE_START?2 : 3;
      return rank(a)-rank(b) || (b.createdAt||0)-(a.createdAt||0);
    });
  if(!mine.length) return `<div style="color:var(--muted);font-size:13px">No tasks in this period.</div>`;
  return `<div style="max-height:320px;overflow-y:auto">${mine.map(t=>{
    const p = PIPES.find(x=>x.id===t.pipe);
    const added = t.createdAt ? fmtDate(iso(new Date(t.createdAt))) : "—";
    return `<div class="ptask" data-opentask="${t.id}">
      <div style="min-width:0">
        <div class="t">${esc(t.title)}</div>
        <div class="s">${esc(p?.name||"")} · added ${esc(added)}${
          t.done && t.doneOn ? ` · done ${esc(fmtDate(t.doneOn))}` : ""}${
          t.stage===STAGE_PAUSE && t.pauseReason ? ` · ${esc(t.pauseReason)}` : ""}${
          !t.done && t.due ? ` · due ${esc(fmtDate(t.due))}` : ""}</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        ${!t.done && t.due && t.due<TODAY ? `<span class="chip overdue">late</span>` : ""}
        ${stageChip(t)}
      </div></div>`;}).join("")}</div>`;
}
function mountPersonTimeline(sel, id){
  const host = $(sel); if(!host) return;
  const mine = TASKS.filter(t=>t.assignee===id);
  const n = mine.filter(t=>!t.done).length;
  host.innerHTML = `
    <div class="sec-h"><h2 style="font-size:14px">Tasks &amp; status</h2>
      <div class="spacer"></div>
      <span style="font-size:11.5px;color:var(--muted)">${n} open · ${esc(periodLabel().toLowerCase())}</span></div>
    ${personTasksHTML(id)}`;
  host.querySelectorAll("[data-opentask]").forEach(el=>el.addEventListener("click",()=>{
    const t = TASKS.find(x=>x.id===el.dataset.opentask);
    if(t){ closeDrawer(); openTaskModal(t.id); }
  }));
}

async function loadUlbs(force){
  if(ULB_LOADING && !force) return ULB_LOADING;
  ULB_LOADING = (async()=>{
    try{
      const all = []; let from = 0;
      for(;;){ const {data,error} = await sb.from("dat_ulbs").select("*").order("id").range(from, from+999);
        if(error) throw error; all.push(...(data||[])); if(!data || data.length<1000) break; from += 1000; }
      const {data:vs, error:ve} = await sb.from("dat_ulb_visits").select("*").order("visit_date",{ascending:true}).limit(5000);
      if(ve) throw ve;
      ULBS = all.map(mapUlb); ULB_VISITS = (vs||[]).map(mapUlbVisit); ULB_READY = true;

  })();
  return ULB_LOADING;
}

/* ---- projection: equirectangular, corrected for Rajasthan's latitude ---- */
const UM_K = Math.cos(26.5*Math.PI/180);
const umP = (lng,lat) => [lng*UM_K*100, -lat*100];
function umEach(g, f){ (g.type==="Polygon"?[g.coordinates]:g.coordinates).forEach(poly=>poly.forEach(ring=>ring.forEach(c=>f(c)))); }
const UM_DB = {}; let UM_FULL = null;
(function(){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  ULB_GEO.features.forEach(ft=>{ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    umEach(ft.geometry, q=>{ const [x,y]=umP(q[0],q[1]); x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y); });
    UM_DB[ft.properties.district] = {x:x0,y:y0,w:x1-x0,h:y1-y0};

  UM_FULL = {x:a-20,y:b-20,w:(c-a)+40,h:(d-b)+40};
})();
const umPath = g => (g.type==="Polygon"?[g.coordinates]:g.coordinates).map(poly=>poly.map(ring=>"M"+ring.map(c=>umP(c[0],c[1]).map(v=>v.toFixed(1)).join(",")).join("L")+"Z").join("")).join("");

    const p=document.createElementNS(NS,"path"); p.setAttribute("d",umPath(ft.geometry)); p.setAttribute("class","um-dist"); p.dataset.d=k; umG.d.appendChild(p);
    const t=document.createElementNS(NS,"text"); t.setAttribute("class","um-dlabel"); t.textContent=k; t.dataset.d=k;
    t.setAttribute("x",b.x+b.w/2); t.setAttribute("y",b.y+b.h/2); umG.l.appendChild(t); });
  umPins = {};
  ULBS.forEach(u=>{ const [x,y]=umP(u.lng,u.lat); const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",x); c.setAttribute("cy",y); c.dataset.id=u.id; umG.p.appendChild(c); umPins[u.id]=c; });
  if(!um.VB) um.VB = {...UM_FULL};
  if(um.district && UM_DB[um.district]) um.VB = umFit(UM_DB[um.district]);
  umSetVB();
  /* pan, zoom, hover, click */
  let drag=null, moved=false;
  svg.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,vb:{...um.VB}}; moved=false; });
  svg.addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4){ moved=true; svg.classList.add("drag"); }
    if(moved){ const s=svg.clientWidth/um.VB.w; um.VB={...drag.vb, x:drag.vb.x-dx/s, y:drag.vb.y-dy/s}; umSetVB(); } });
  const endDrag=()=>{ drag=null; svg.classList.remove("drag"); };
  svg.addEventListener("pointerup",endDrag); svg.addEventListener("pointerleave",endDrag);
  const zoomBy=(f,cx,cy)=>{ const r=svg.getBoundingClientRect(); const px=cx==null?.5:(cx-r.left)/r.width, py=cy==null?.5:(cy-r.top)/r.height;
    const nw=Math.min(UM_FULL.w*1.6, Math.max(8, um.VB.w*f)), nh=nw*(um.VB.h/um.VB.w);
    um.VB={x:um.VB.x+(um.VB.w-nw)*px, y:um.VB.y+(um.VB.h-nh)*py, w:nw, h:nh}; umSetVB(); };
  svg.addEventListener("wheel",e=>{ e.preventDefault(); zoomBy(e.deltaY>0?1.18:1/1.18,e.clientX,e.clientY); },{passive:false});
  $("#umIn").onclick=()=>zoomBy(1/1.4); $("#umOut").onclick=()=>zoomBy(1.4);
  $("#umAll").onclick=umHome;
  const tip=$("#umTip");
  svg.addEventListener("mousemove",e=>{ const pin=e.target.closest("circle"), dist=e.target.closest(".um-dist"); let h="";
    if(pin){ const u=ULBS.find(x=>x.id===pin.dataset.id); h=`${esc(u.name)} · ${esc(u.category||u.type)} · ${UM_STATUS[u.status]}`; }
    else if(dist && !um.district){ h=`${esc(dist.dataset.d)} · ${umIn(dist.dataset.d).length} ULBs`; }
    if(!h){ tip.style.opacity=0; return; }
    const r=svg.getBoundingClientRect(); tip.innerHTML=h; tip.style.opacity=1;
    tip.style.left=Math.max(4,Math.min(e.clientX-r.left+12, r.width-tip.offsetWidth-6))+"px"; tip.style.top=(e.clientY-r.top+14)+"px"; });
  svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
  svg.addEventListener("click",e=>{ if(moved) return; const pin=e.target.closest("circle"); if(pin){ umOpenUlb(pin.dataset.id); return; }
    const d=e.target.closest(".um-dist"); if(d) umOpenDistrict(d.dataset.d); });
  if(window.ResizeObserver) new ResizeObserver(()=>umRestyle()).observe(svg);
}
function umSetVB(){ const svg=$("#umMap"); if(!svg) return; const v=um.VB; svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`); umRestyle(); }
function umFit(t){ const svg=$("#umMap"); const ar=(svg&&svg.clientWidth&&svg.clientHeight)?svg.clientWidth/svg.clientHeight:1.4;
  let {x,y,w,h}=t; const pad=.12; x-=w*pad; y-=h*pad; w*=1+2*pad; h*=1+2*pad;
  if(w/h<ar){ const nw=h*ar; x-=(nw-w)/2; w=nw; } else { const nh=w/ar; y-=(nh-h)/2; h=nh; } return {x,y,w,h}; }
let umAnim=null;
function umFly(t){ const to=umFit(t), from={...um.VB}, t0=performance.now(), dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:420;
  cancelAnimationFrame(umAnim);
  const step=now=>{ const k=dur?Math.min(1,(now-t0)/dur):1, e=1-Math.pow(1-k,3);
    um.VB={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e}; umSetVB();
    if(k<1) umAnim=requestAnimationFrame(step); };
  umAnim=requestAnimationFrame(step); }
function umRestyle(){
  const svg=$("#umMap"); if(!svg || !umG.d) return;
  const s=(svg.clientWidth/um.VB.w)||1, sel=um.district, NS="http://www.w3.org/2000/svg";
  umG.d.querySelectorAll(".um-dist").forEach(p=>{ p.classList.toggle("sel",p.dataset.d===sel); p.classList.toggle("dim",!!sel&&p.dataset.d!==sel); });
  umG.l.querySelectorAll(".um-dlabel").forEach(t=>{ t.setAttribute("font-size",(sel?10:10.5)/s); t.setAttribute("stroke-width",2.5/s);
    t.style.display=(sel&&t.dataset.d===sel)?"none":""; });
  const r=(sel?6.5:4.2)/s;
  ULBS.forEach(u=>{ const c=umPins[u.id]; if(!c) return;
    c.setAttribute("r", u.id===um.ulb?r*1.5:r); c.setAttribute("class",`um-pin s${u.status}${u.id===um.ulb?" hl":""}`);
    c.style.display=umPass(u)?"":"none"; });
  [0,1,2].forEach(k=>ULBS.filter(u=>u.status===k).forEach(u=>umPins[u.id]&&umG.p.appendChild(umPins[u.id])));
  if(um.ulb && umPins[um.ulb]) umG.p.appendChild(umPins[um.ulb]);
  umG.t.innerHTML="";
  if(sel) umIn(sel).filter(umPass).forEach(u=>{ const [x,y]=umP(u.lng,u.lat); const t=document.createElementNS(NS,"text");
    t.setAttribute("class","um-plabel"); t.setAttribute("x",x+9/s); t.setAttribute("y",y+4/s); t.setAttribute("font-size",11.5/s);
    t.setAttribute("stroke-width",3/s); t.textContent=u.name; umG.t.appendChild(t); });
}
function umOpenDistrict(d){ um.district=d; um.ulb=null; umFly(UM_DB[d]); umPaintAll(); }
function umOpenUlb(id){ const u=ULBS.find(x=>x.id===id); if(!u) return;
  if(um.district!==u.mapDistrict){ um.district=u.mapDistrict; umFly(UM_DB[u.mapDistrict]); }
  um.ulb=id; umPaintAll(); }
function umHome(){ um.district=null; um.ulb=null; umFly(UM_FULL); umPaintAll(); }
function umBar(list){ const n=[0,0,0]; list.forEach(u=>n[u.status]++); const t=list.length||1;
  return `<span class="um-bar">${[2,1,0].map(k=>`<i style="width:${n[k]/t*100}%;background:var(--um-s${k})"></i>`).join("")}</span>`; }
function umPaintAll(){
  if(!$("#umPanel")) return;
  const n=[0,0,0]; ULBS.forEach(u=>n[u.status]++);
  $("#umTop").innerHTML = `<div class="um-sub">${ULBS.length} urban local bodies · 33 districts${canEdit(state.me,"ulbmap")?"":" · <b>view only</b>"}</div>
    <div class="um-counts">${[0,1,2].map(k=>`<button class="um-cnt ${um.filter===k?"on":""}" data-umf="${k}" title="Show only: ${UM_STATUS[k]}"><i class="um-dot s${k}"></i><b>${n[k]}</b>${UM_STATUS[k]}</button>`).join("")}</div>`;
  $("#umTop").querySelectorAll("[data-umf]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.umf; um.filter=um.filter===k?-1:k; umPaintAll(); });
  $("#umCrumb").innerHTML = um.district ? `<b>${esc(um.district)}</b> · ${umIn(um.district).length} ULBs` : "Click a district to see its ULBs";
  $("#umAll").hidden = !um.district;
  umPanel(); umRestyle();
}
function umSearch(ph){ return `<div class="um-search"><input id="umQ" placeholder="${ph}" value="${esc(um.q)}" autocomplete="off">
  <select id="umTy" aria-label="Body type"><option value="all">All types</option>${["Nagar Nigam","Nagar Parishad","Nagar Palika"].map(t=>`<option ${um.type===t?"selected":""}>${t}</option>`).join("")}</select></div>`; }
function umPanel(){
  const P_=$("#umPanel"); if(!P_) return;
  if(um.ulb) return umCard(P_);
  if(um.district){ const us=umIn(um.district);
    P_.innerHTML=`<div class="um-ph"><button class="um-back" id="umBk">‹ All districts</button>
      <h2>${esc(um.district)} ${umBar(us)}</h2>
      <div class="um-meta">${us.length} ULBs · ${us.filter(u=>u.status===1).length} visited · ${us.filter(u=>u.status===2).length} working with us</div>
      ${umSearch("Search in "+esc(um.district))}</div><div class="um-pb" id="umList"></div>`;
    $("#umBk").onclick=umHome;
  } else {
    P_.innerHTML=`<div class="um-ph"><h2>Districts</h2><div class="um-meta">Click a district on the map or below, then a ULB to see its officers.</div>
      ${umSearch("Search any ULB in Rajasthan")}</div><div class="um-pb" id="umList"></div>`;
  }
  const q=$("#umQ"); q.oninput=()=>{ um.q=q.value.trim().toLowerCase(); umList(); umRestyle(); };
  const ty=$("#umTy"); ty.onchange=()=>{ um.type=ty.value; umList(); umRestyle(); };
  umList();
}
const UM_RANK = {"Nagar Nigam":0,"Nagar Parishad":1,"Nagar Palika":2};
function umList(){
  const L=$("#umList"); if(!L) return;
  if(um.district || um.q){
    const us=(um.district?umIn(um.district):ULBS).filter(umPass)
      .sort((a,b)=>(UM_RANK[a.category]??3)-(UM_RANK[b.category]??3) || a.name.localeCompare(b.name));
    L.innerHTML = us.length ? us.map(u=>{ const v=umVisits(u.id), last=v[v.length-1];
      return `<button class="um-row" data-umu="${u.id}"><i class="um-dot s${u.status}"></i><div style="min-width:0"><div class="nm">${esc(u.name)}</div>
        <div class="sm">${esc(u.category||u.type)}${u.district!==u.mapDistrict?` · ${esc(u.district)}`:""}${last?` · last visit ${esc(umFmt(last.date))}`:""}</div></div>
        <span class="um-tag s${u.status}">${UM_STATUS[u.status]}</span></button>`; }).join("")
      : `<div class="um-empty">No ULB matches.</div>`;
    L.querySelectorAll("[data-umu]").forEach(b=>{ b.onclick=()=>umOpenUlb(b.dataset.umu);
      b.onmouseenter=()=>umPins[b.dataset.umu]?.classList.add("hl");
      b.onmouseleave=()=>{ if(b.dataset.umu!==um.ulb) umPins[b.dataset.umu]?.classList.remove("hl"); }; });
  } else {
    L.innerHTML = Object.keys(UM_DB).sort().map(d=>{ const us=umIn(d).filter(umPass);
      return `<button class="um-row" data-umd="${esc(d)}"><div style="min-width:0"><div class="nm">${esc(d)}</div>
        <div class="sm">${us.length} ULBs · ${us.filter(u=>u.status===2).length} working · ${us.filter(u=>u.status===1).length} visited</div></div>${umBar(us)}</button>`; }).join("");
    L.querySelectorAll("[data-umd]").forEach(b=>b.onclick=()=>umOpenDistrict(b.dataset.umd));
  }
}
function umPhone(v){ return v ? v.split(/[;,|]/).map(x=>x.trim()).filter(Boolean)
  .map(x=>`<span class="um-num">${esc(x)} <button class="um-copy" data-umcopy="${esc(x)}">Copy</button></span>`).join("<br>") : ""; }
const umField = (l,v,cls="") => v ? `<dt>${l}</dt><dd class="${cls}">${v}</dd>` : "";
function umCard(P_){
  const u=ULBS.find(x=>x.id===um.ulb), me=state.me, edit=canEdit(me,"ulbmap"), v=umVisits(u.id);
  const team = liveUsers().filter(x=>can(x,"ulbmap")).sort((a,b)=>a.name.localeCompare(b.name));
  if(!team.some(x=>x.id===me.id)) team.unshift(me);
  P_.innerHTML=`<div class="um-ph"><button class="um-back" id="umBk">‹ ${esc(u.mapDistrict)}</button>
      <h2>${esc(u.name)}</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${u.category?`<span class="um-tag cat">${esc(u.category)}</span>`:""}
        <span class="um-tag s${u.status}">${UM_STATUS[u.status]}</span>
        <span class="um-meta">${esc(u.district)} district${u.code?` · City code ${esc(u.code)}`:""}${u.newBody?" · new body (2026 list)":""}</span></div></div>
    <div class="um-pb"><div class="um-card">
      <div class="um-sec"><h3>Our status</h3>
        <div class="um-status3">${[0,1,2].map(k=>`<button class="s${k} ${u.status===k?"on":""}" data-ums="${k}" ${edit?"":"disabled"}><i class="um-dot s${k}"></i>${UM_STATUS[k]}</button>`).join("")}</div>
        ${u.statusAt?`<div class="um-meta" style="margin-top:6px">Set by ${esc(U(u.statusBy)?.name||"someone")} on ${esc(fmtDate(iso(new Date(u.statusAt))))}</div>`:""}</div>
      <div class="um-sec"><h3>Elected body (Sept 2026)</h3><dl>
        ${umField(esc(u.headPost||"Head"), esc(u.head)+(u.party?` <span class="um-meta">(${esc(u.party)})</span>`:""), "um-hi")}
        ${umField("Deputy", esc(u.deputy), "um-hi")}
        ${umField("Head contact", esc(u.oldChair ? u.oldChair+" (portal, may be previous term)" : "Not published"))}</dl></div>
      <div class="um-sec"><h3>Officers</h3><dl>
        ${umField("EO / Commissioner", esc(u.eo)||"<span class='um-meta'>Not listed in DLB directory</span>", "um-hi")}
        ${umField("Designation", esc([u.eoDesig,u.eoPost].filter(Boolean).join(" · ")), "um-hi")}
        ${umField("Mobile", umPhone(u.eoMobile))}
        ${umField("Commissioner (DDR)", esc(u.commissioner))}
        ${umField("Office landline", umPhone(u.landline))}
        ${umField("E-mail", u.email?u.email.split(/;\s*/).map(e=>`<span class="um-num">${esc(e)} <button class="um-copy" data-umcopy="${esc(e)}">Copy</button></span>`).join("<br>"):"")}
        ${umField("Nodal officer", esc(u.nodal))}</dl></div>
      ${u.flags?`<div class="um-flag">⚠ ${esc(u.flags)}</div>`:""}
      <div class="um-sec"><h3>Visits (${v.length})</h3><div class="um-visits">
        ${v.slice().reverse().map(x=>`<div class="um-visit"><div class="vh"><span><b>${esc(U(x.by)?.name||"—")}</b>${x.met?` met ${esc(x.met)}`:""}</span><span>${esc(umFmt(x.date))}</span></div>${esc(x.note)}
          ${x.createdBy && x.createdBy!==x.by ? `<div class="um-meta">logged by ${esc(U(x.createdBy)?.name||"someone")}</div>`:""}</div>`).join("") || `<div class="um-meta">No visit recorded yet.</div>`}</div></div>
      ${edit?`<form class="um-vf" id="umVf"><div class="full" style="font-weight:650;font-size:12.5px">Log a visit <span class="um-meta">— a grey ULB turns orange</span></div>
        <label>Date<input type="date" id="umVd" value="${TODAY}" max="${TODAY}" required></label>
        <label>Visited by<select id="umVb">${team.map(t=>`<option value="${t.id}" ${t.id===me.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label>
        <label class="full">Met<input id="umVm" maxlength="120" placeholder="e.g. EO, Commissioner, Chairperson"></label>
        <label class="full">What happened<textarea id="umVn" maxlength="1000" placeholder="e.g. Shared company profile, asked for ward map, follow up next week"></textarea></label>
        <div class="full" style="display:flex;justify-content:flex-end"><button class="btn sm primary" type="submit">Save visit</button></div></form>`
      :`<div class="um-meta">You can see this ULB but not change it. Ask your Admin for <b>Can edit</b> on the ULB map.</div>`}
      <div class="um-meta">Officer details: Rajasthan ULB Directory (LSG directory 08-Oct-2026; election results Sept 2026). Map position from public place data${u.exact?"":", approximate"}. Verify before formal correspondence.</div>
    </div></div>`;
  $("#umBk").onclick=()=>{ um.ulb=null; umPaintAll(); };
  P_.querySelectorAll("[data-umcopy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.umcopy); toast("Copied"); }catch(_){ toast(b.dataset.umcopy); } });
  P_.querySelectorAll("[data-ums]").forEach(b=>b.onclick=async()=>{ const k=+b.dataset.ums; if(k===u.status) return;
    const saved = await guard(()=>DB.upd("dat_ulbs", u.id, {status:k})); if(!saved) return;
    Object.assign(u, mapUlb(saved)); toast(`${u.name}: ${UM_STATUS[k]}`); umPaintAll(); });
  const f=$("#umVf"); if(f) f.onsubmit=async e=>{ e.preventDefault();
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
    const row = await guard(()=>DB.ins("dat_ulb_visits",{ulb_id:u.id, visit_date:$("#umVd").value||TODAY, visited_by:$("#umVb").value,
      met:$("#umVm").value.trim(), note:$("#umVn").value.trim(), created_by:me.id}));
    btn.disabled=false; if(!row) return;
    ULB_VISITS.push(mapUlbVisit(row)); ULB_VISITS.sort((a,b)=>a.date.localeCompare(b.date));
    if(u.status===0) u.status=1;                          // the database did the same
    addEvent("ulb",`logged a visit to ${u.name}`);
    toast("Visit saved"); umPaintAll(); };
}

/* ================= common wiring & init ================= */
function wireCommon(){
  document.querySelectorAll("[data-person]").forEach(el=>el.addEventListener("click",()=>openPerson(el.dataset.person)));
  document.querySelectorAll("[data-gopipe]").forEach(el=>el.addEventListener("click",()=>{ state.pipe=el.dataset.gopipe; state.view="pipelines"; render(); }));
  document.querySelectorAll('[data-act="newPipe"]').forEach(el=>el.addEventListener("click",e=>{e.stopPropagation(); openPipeModal(null);}));
  document.querySelectorAll('#view [data-act="newAcc"]').forEach(el=>el.addEventListener("click",e=>{e.stopPropagation(); openAccountModal(null);}));
  document.querySelectorAll('[data-act="askAdmin"]').forEach(el=>el.addEventListener("click",e=>{e.stopPropagation(); openRequestModal("role");}));
  document.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",()=>{
    const t=TASKS.find(x=>x.id===el.dataset.toggle); if(!t) return;
    const pipe=PIPES.find(p=>p.id===t.pipe); moveTask(t, pipe.stages[pipe.stages.length-1]); }));
  document.querySelectorAll("#view [data-opentask]").forEach(el=>el.addEventListener("click",()=>openTaskModal(el.dataset.opentask)));
}
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]"); if(nav){ state.view=nav.dataset.nav; render(); return; }
  const pt=e.target.closest("[data-pipe]"); if(pt){ state.pipe=pt.dataset.pipe; renderPipelines(); return; }
});
$("#meCard").addEventListener("click",openAccountMenu);
$("#drawerScrim").addEventListener("click",closeDrawer);
$("#themeBtn").addEventListener("click",()=>{ state.theme=state.theme==="dark"?"light":"dark"; applyTheme(); });
$("#notifBtn").addEventListener("click", toggleNotifications);
$("#quickAdd").addEventListener("click",()=>{
  if(state.view==="kpis"){ if(teamPeople().length) openKpiModal(null); else toast("Nobody reports to you yet."); }
  else if(state.view==="documents"){ const f=$("#docFile"); if(f) f.click(); }
  else if(state.view==="legal"){ openLegalModal(null); }
  else if(state.view==="tenders"){ openTenderModal(null); }
  else if(state.view==="myday"){ openTaskModal(null,{assignee:state.me.id}); }
  else openTaskModal(null,{});
});
/* Escape peels one layer at a time: a task opened from inside the person layer
   closes on its own, and the layer underneath stays. */
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){
  if($("#overlayHost").innerHTML) closeModal(); else closeDrawer(); hideTip(); } });

paintNotifBtn();
wireNotifBridge();
boot();
if("serviceWorker" in navigator && location.protocol==="https:")
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
