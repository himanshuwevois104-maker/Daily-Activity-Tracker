<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WeVois — Daily Activity Tracker</title>
<style>
/* ================= Design tokens ================= */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-strong:#256abf; --accent-soft:#e5effb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --ord1:#86b6ef; --ord2:#5598e7; --ord3:#3987e5; --ord4:#256abf; --ord5:#1c5cab; --ord6:#104281;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.05);
  --shadow-lg:0 8px 40px rgba(11,11,11,.16);
  --r:14px; --r-sm:10px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-strong:#5598e7; --accent-soft:#16283f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --ord1:#86b6ef; --ord2:#6da7ec; --ord3:#5598e7; --ord4:#3987e5; --ord5:#2a78d6; --ord6:#184f95;
  --good-text:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--page); color:var(--ink);
  font-size:14.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select,textarea{font:inherit; color:var(--ink)}
::placeholder{color:var(--muted)}
h1,h2,h3,h4{font-weight:650; letter-spacing:-.01em}
.hidden{display:none !important}

/* ================= Login ================= */
#login{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(1100px 500px at 85% -10%, color-mix(in srgb, var(--s1) 14%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--s3) 12%, transparent), transparent 60%),
    var(--page);}
.login-card{width:min(680px,100%); background:var(--surface); border:1px solid var(--border);
  border-radius:20px; box-shadow:var(--shadow-lg); padding:34px 36px}
.login-head{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.logo-mark{width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--s3));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px; flex:none}
.login-head h1{font-size:21px}
.login-sub{color:var(--ink2); margin:2px 0 20px}
.login-group{margin-top:16px}
.login-group .lvl{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px}
.login-users{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px}
.user-btn{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface); text-align:left; transition:.15s}
.user-btn:hover{border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px)}
.user-btn .nm{font-weight:600; font-size:13.5px; line-height:1.2}
.user-btn .tt{font-size:11.5px; color:var(--muted); line-height:1.25}
.demo-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2);
  background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:4px 12px; margin-top:20px}
.demo-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--warning)}

/* ================= App shell ================= */
#app{display:flex; min-height:100dvh}
#sidebar{width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100dvh; padding:18px 12px 12px; z-index:30}
.side-logo{display:flex; align-items:center; gap:10px; padding:0 8px 16px}
.side-logo .logo-mark{width:34px; height:34px; font-size:15px; border-radius:9px}
.side-logo .t1{font-weight:750; font-size:15px; line-height:1.1}
.side-logo .t2{font-size:11px; color:var(--muted)}
nav{display:flex; flex-direction:column; gap:2px}
.nav-btn{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px;
  color:var(--ink2); font-weight:550; font-size:14px; transition:.12s}
.nav-btn svg{width:19px; height:19px; flex:none}
.nav-btn:hover{background:var(--surface-2); color:var(--ink)}
.nav-btn.active{background:var(--accent-soft); color:var(--accent-strong)}
.nav-btn .cnt,.pipe-tab .cnt{margin-left:auto; font-size:10.5px; font-weight:750; background:var(--critical);
  color:#fff; border-radius:99px; min-width:18px; height:18px; padding:0 5px; display:inline-flex;
  align-items:center; justify-content:center}
.pipe-tab .cnt{margin-left:2px}
.side-foot{margin-top:auto; border-top:1px solid var(--border); padding-top:10px}
.me-card{display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; width:100%; text-align:left}
.me-card:hover{background:var(--surface-2)}
.me-card .nm{font-weight:650; font-size:13.5px; line-height:1.15}
.me-card .rl{font-size:11.5px; color:var(--muted)}
.switch-hint{font-size:10.5px; color:var(--muted); padding:2px 8px 0}

#main{flex:1; min-width:0; display:flex; flex-direction:column}
#topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--page) 86%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:12px 26px; min-height:60px}
#viewTitle{font-size:18px}
#viewDate{font-size:12.5px; color:var(--muted); margin-top:1px}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:9px}
.icon-btn{width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--ink2)}
.icon-btn:hover{color:var(--ink); box-shadow:var(--shadow)}
.icon-btn svg{width:17px; height:17px}
#view{padding:24px 26px 90px; max-width:1500px; width:100%}

/* Level badges */
.lvl-badge{display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; border-radius:6px; padding:2px 7px}
.lvl-ceo{background:color-mix(in srgb,var(--s7) 16%, var(--surface)); color:var(--s7)}
[data-theme="dark"] .lvl-ceo{color:#b3aaf3}
.lvl-vp{background:color-mix(in srgb,var(--s1) 15%, var(--surface)); color:var(--accent-strong)}
.lvl-manager{background:color-mix(in srgb,var(--s3) 16%, var(--surface)); color:#0d7a55}
[data-theme="dark"] .lvl-manager{color:#3fc796}
.lvl-member{background:var(--surface-2); color:var(--ink2)}

/* Avatars */
.av{border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:700; flex:none; color:var(--ink); border:1px solid var(--border)}
.av-sm{width:26px; height:26px; font-size:10px}
.av-md{width:34px; height:34px; font-size:12.5px}
.av-lg{width:48px; height:48px; font-size:17px}

/* ================= Cards / common ================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.card-head h3{font-size:15px}
.card-head .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
.card-head .spacer{margin-left:auto}
.btn{display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:10px; font-weight:600;
  font-size:13.5px; border:1px solid var(--border); background:var(--surface); color:var(--ink2); transition:.12s}
.btn:hover{color:var(--ink); box-shadow:var(--shadow)}
.btn.primary{background:var(--accent); border-color:transparent; color:#fff}
.btn.primary:hover{background:var(--accent-strong); color:#fff}
.btn.danger{color:var(--critical); border-color:color-mix(in srgb,var(--critical) 35%, transparent)}
.btn.sm{padding:5px 11px; font-size:12.5px; border-radius:8px}
.btn svg{width:15px; height:15px}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
  border-radius:7px; padding:2.5px 8px; background:var(--surface-2); color:var(--ink2)}
.chip .ic{font-size:11px}
.chip.p-urgent{background:color-mix(in srgb,var(--critical) 14%, var(--surface)); color:var(--critical)}
.chip.p-high{background:color-mix(in srgb,var(--serious) 16%, var(--surface)); color:#c05a32}
[data-theme="dark"] .chip.p-high{color:var(--serious)}
.chip.p-medium{background:color-mix(in srgb,var(--warning) 18%, var(--surface)); color:#8a6206}
[data-theme="dark"] .chip.p-medium{color:var(--warning)}
.chip.p-low{background:var(--surface-2); color:var(--muted)}
.chip.overdue{background:color-mix(in srgb,var(--critical) 13%, var(--surface)); color:var(--critical)}
.chip.today{background:color-mix(in srgb,var(--warning) 18%, var(--surface)); color:#8a6206}
[data-theme="dark"] .chip.today{color:var(--warning)}
.chip.done{background:color-mix(in srgb,var(--good) 14%, var(--surface)); color:var(--good-text)}

/* Grid helpers */
.grid{display:grid; gap:16px}
.g-kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-main-side{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media(max-width:1050px){.g-2,.g-main-side{grid-template-columns:1fr}}

/* Stat tiles */
.tile{padding:15px 17px}
.tile .lbl{font-size:12.5px; color:var(--ink2); font-weight:550}
.tile .val{font-size:27px; font-weight:680; letter-spacing:-.02em; margin-top:3px}
.tile .delta{font-size:12px; margin-top:2px; color:var(--muted)}
.tile .delta.up{color:var(--good-text)} .tile .delta.down{color:var(--critical)}

/* Chart bits */
.chart-wrap{position:relative}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2)}
.legend .key{display:inline-flex; align-items:center; gap:6px}
.legend .sw{width:10px; height:10px; border-radius:3px}
#tooltip{position:fixed; z-index:99; pointer-events:none; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); padding:8px 11px;
  font-size:12.5px; max-width:260px; opacity:0; transition:opacity .1s}
#tooltip .tt-t{font-weight:650; margin-bottom:3px}
#tooltip .tt-row{display:flex; align-items:center; gap:7px; color:var(--ink2)}
#tooltip .tt-row .sw{width:8px; height:8px; border-radius:2px; flex:none}
#tooltip .tt-row b{color:var(--ink); margin-left:auto; padding-left:12px}

/* Stage distribution stacked bar */
.stack{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-2)}
.stack .seg{height:100%; border-right:2px solid var(--surface)}
.stack .seg:last-child{border-right:none}
.o1{background:var(--ord1)}.o2{background:var(--ord2)}.o3{background:var(--ord3)}
.o4{background:var(--ord4)}.o5{background:var(--ord5)}.o6{background:var(--ord6)}

/* ================= Kanban ================= */
.pipe-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.pipe-tab{display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:99px;
  border:1px solid var(--border); background:var(--surface); font-weight:600; font-size:13px; color:var(--ink2)}
.pipe-tab .pdot{width:9px; height:9px; border-radius:50%}
.pipe-tab.active{border-color:var(--accent); color:var(--ink); box-shadow:var(--shadow)}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.filters input[type=search],.filters select{padding:7px 11px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); font-size:13px; color:var(--ink)}
.filters input[type=search]{min-width:190px}
.board{display:flex; gap:14px; overflow-x:auto; padding-bottom:18px; align-items:flex-start}
.col{flex:0 0 262px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r);
  padding:10px; max-height:calc(100dvh - 305px); display:flex; flex-direction:column}
.col.drag-over{outline:2px dashed var(--accent); outline-offset:-2px; background:var(--accent-soft)}
.col-head{display:flex; align-items:center; gap:8px; padding:2px 6px 10px}
.col-head .cnm{font-weight:650; font-size:13px}
.col-head .cct{font-size:11.5px; font-weight:700; background:var(--surface); border:1px solid var(--border);
  border-radius:99px; padding:1px 8px; color:var(--ink2)}
.col-head .add{margin-left:auto; color:var(--muted); width:24px; height:24px; border-radius:7px;
  display:flex; align-items:center; justify-content:center}
.col-head .add:hover{background:var(--surface); color:var(--ink)}
.col-body{overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-height:40px; flex:1}
.tcard{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 12px;
  cursor:grab; box-shadow:var(--shadow); border-left:3px solid var(--pc,var(--baseline)); transition:.12s}
.tcard:hover{transform:translateY(-1px); box-shadow:var(--shadow-lg)}
.tcard.dragging{opacity:.45; cursor:grabbing}
.tcard .tt{font-weight:600; font-size:13.5px; line-height:1.3}
.tcard .meta{display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap}
.tcard .meta .av-sm{margin-left:auto}
.tcard.done-card .tt{text-decoration:line-through; color:var(--muted)}
.empty-col{font-size:12px; color:var(--muted); text-align:center; padding:14px 6px; border:1.5px dashed var(--grid); border-radius:10px}

/* ================= Daily log ================= */
.log-day{margin-bottom:20px}
.log-day .dhead{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.log-day .dhead .dt{font-weight:700; font-size:13.5px}
.log-day .dhead .dsub{font-size:12px; color:var(--muted)}
.log-entry{display:flex; gap:12px; padding:11px 4px; border-bottom:1px solid var(--grid)}
.log-entry:last-child{border-bottom:none}
.log-entry .cat-ic{width:32px; height:32px; border-radius:9px; background:var(--surface-2); flex:none;
  display:flex; align-items:center; justify-content:center; font-size:15px}
.log-entry .note{font-size:13.5px; margin-top:1px; color:var(--ink)}
.log-entry .lmeta{display:flex; gap:8px; align-items:center; font-size:11.5px; color:var(--muted)}
.log-entry .acts{margin-left:auto; display:flex; gap:4px; opacity:0; transition:.15s}
.log-entry:hover .acts{opacity:1}
.mini-btn{font-size:11.5px; color:var(--muted); padding:3px 8px; border-radius:7px}
.mini-btn:hover{background:var(--surface-2); color:var(--ink)}
.qa-form{display:grid; grid-template-columns:150px 170px 1fr auto; gap:9px; align-items:center}
.qa-form select,.qa-form input,.qa-form textarea{padding:8px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px}
@media(max-width:860px){.qa-form{grid-template-columns:1fr 1fr; }.qa-form .qa-note{grid-column:1/-1}}

/* task checklist rows (My Day) */
.trow{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--grid)}
.trow:last-child{border-bottom:none}
.trow .cb{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--baseline); flex:none;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; transition:.12s}
.trow .cb.on{background:var(--good); border-color:var(--good)}
.trow .t{font-size:13.5px; font-weight:550; cursor:pointer}
.trow.done .t{text-decoration:line-through; color:var(--muted)}
.trow .sub{font-size:11.5px; color:var(--muted)}
.trow .right{margin-left:auto; display:flex; gap:6px; align-items:center}

/* ================= Team / org chart ================= */
.org{overflow-x:auto; padding:10px 4px 26px}
.org ul{display:flex; justify-content:center; padding-top:24px; position:relative; list-style:none}
.org > ul{padding-top:0}
.org li{display:flex; flex-direction:column; align-items:center; position:relative; padding:24px 7px 0}
.org > ul > li{padding-top:0}
.org li::before,.org li::after{content:""; position:absolute; top:0; right:50%; width:50%; height:24px;
  border-top:1.5px solid var(--baseline)}
.org li::after{right:auto; left:50%; border-left:1.5px solid var(--baseline)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org > ul > li::before,.org > ul > li::after{display:none}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:1.5px solid var(--baseline)}
.org ul ul::before{content:""; position:absolute; top:0; left:50%; border-left:1.5px solid var(--baseline); width:0; height:24px}
.person{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:11px 14px;
  min-width:168px; box-shadow:var(--shadow); cursor:pointer; text-align:left; transition:.13s; position:relative; z-index:1}
.person:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--accent)}
.person .prow{display:flex; align-items:center; gap:9px}
.person .nm{font-weight:650; font-size:13.5px; line-height:1.15}
.person .tt{font-size:11.5px; color:var(--muted); line-height:1.25}
.person .pstats{display:flex; gap:6px; margin-top:8px}
.pstat{font-size:10.5px; font-weight:600; background:var(--surface-2); border-radius:6px; padding:2px 7px; color:var(--ink2)}

/* ================= Overlays / modals ================= */
.overlay{position:fixed; inset:0; z-index:80; background:rgba(11,11,11,.45); display:flex;
  align-items:flex-start; justify-content:center; padding:5vh 18px 18px; overflow-y:auto}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.6)}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg);
  width:min(560px,100%); padding:24px 26px; animation:pop .18s ease}
.modal.wide{width:min(780px,100%)}
@keyframes pop{from{transform:translateY(10px); opacity:0} to{transform:none; opacity:1}}
.modal h3{font-size:17px; margin-bottom:4px}
.modal .msub{font-size:13px; color:var(--muted); margin-bottom:16px}
.f-grid{display:grid; gap:13px}
.f-2{grid-template-columns:1fr 1fr} @media(max-width:640px){.f-2{grid-template-columns:1fr}}
.field label{display:block; font-size:12px; font-weight:650; color:var(--ink2); margin-bottom:5px}
.field input,.field select,.field textarea{width:100%; padding:9px 12px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); font-size:13.5px}
.field textarea{resize:vertical; min-height:74px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%, transparent); border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px; flex:none; cursor:pointer; margin:0}
.field input[type=checkbox]{width:16px; height:16px; padding:0; border-radius:4px}
.check-list{display:flex; flex-direction:column; gap:2px; margin-top:2px}
.check-list label{display:flex !important; align-items:center; gap:9px; font-size:13.5px; color:var(--ink);
  text-transform:none; font-weight:500; margin:0; padding:7px 9px; border-radius:9px; cursor:pointer}
.check-list label:hover{background:var(--surface-2)}
.m-actions{display:flex; gap:9px; margin-top:20px; align-items:center}
.m-actions .grow{flex:1}
.color-row{display:flex; gap:8px; flex-wrap:wrap}
.color-dot{width:28px; height:28px; border-radius:50%; border:2.5px solid transparent; cursor:pointer}
.color-dot.sel{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface) inset}
.stage-row{display:flex; gap:7px; align-items:center; margin-bottom:7px}
.stage-row input{flex:1; padding:7px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px}
.stage-row .mini-btn{border:1px solid var(--border); border-radius:8px}

/* Person drawer */

.drawer-scrim{position:fixed; inset:0; z-index:84; background:rgba(11,11,11,.3); opacity:0; pointer-events:none; transition:.2s}
.drawer-scrim.open{opacity:1; pointer-events:auto}

/* Feed */
.feed-item{display:flex; gap:11px; padding:9px 2px; border-bottom:1px solid var(--grid); font-size:13px}
.feed-item:last-child{border-bottom:none}
.feed-item .fic{width:28px; height:28px; border-radius:9px; flex:none; display:flex; align-items:center;

/* Tables */
table.simple{width:100%; border-collapse:collapse; font-size:13px}
table.simple th{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);

table.simple td{padding:9px 10px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums}
table.simple tr:last-child td{border-bottom:none}
table.simple tr.click{cursor:pointer} table.simple tr.click:hover td{background:var(--surface-2)}

/* Toast */
#toasts{position:fixed; bottom:22px; right:22px; z-index:120; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--ink); color:var(--page); padding:10px 16px; border-radius:11px; font-size:13px;
  font-weight:550; box-shadow:var(--shadow-lg); animation:pop .2s ease; display:flex; gap:8px; align-items:center}

/* Section headers inside views */
.sec-h{display:flex; align-items:center; gap:10px; margin:26px 0 13px}
.sec-h h2{font-size:16px}
.sec-h .sub{font-size:12.5px; color:var(--muted)}
.sec-h .spacer{margin-left:auto}

/* ================= roles, hierarchy & permissions ================= */
const roleOf   = u => ROLES.find(r=>r.id===u?.role) || null;
const titleOf  = u => roleOf(u)?.name || "No job role";
const isAdmin  = u => !!u?.admin;
const canRequest = u => u.level==="ceo" || u.level==="vp";   // may raise a request to Admin
const isLive   = u => u.active !== false;
const liveUsers = () => USERS.filter(isLive);
const pendingReqs = () => REQS.filter(r=>r.status==="pending");
/* pipelines a person reaches through their job role, company-wide */
const rolePipeIds = u => { const r=roleOf(u); return (r && r.active) ? (r.pipes||[]) : []; };

const childrenOf = id => USERS.filter(u=>u.mgr===id && isLive(u));
function subtree(id){ const out=[id]; childrenOf(id).forEach(c=>out.push(...subtree(c.id))); return out; }
function visibleUserIds(viewer){                       // whose work can I see?
  if(viewer.level==="ceo") return liveUsers().map(u=>u.id);
  if(viewer.level==="member") return [viewer.id];
  return subtree(viewer.id);                            // vp / manager: self + everyone below
}
const canManage = v => v.level!=="member";              // create pipelines, assign to others
function visiblePipes(v){
  const extra = new Set(rolePipeIds(v));
  let base;
  if(v.level==="ceo") base = PIPES.slice();
  else {
    const depts = new Set(USERS.filter(u=>visibleUserIds(v).includes(u.id)).map(u=>u.dept));
    depts.add(v.dept);
    base = PIPES.filter(p=>!p.dept || depts.has(p.dept) || p.createdBy===v.id);
  }
  PIPES.forEach(p=>{ if(extra.has(p.id) && !base.includes(p)) base.push(p); });
  return base;
}
function visibleTasks(v){
  const ids = new Set(visibleUserIds(v));
  const rp  = new Set(rolePipeIds(v));
  return TASKS.filter(t=>ids.has(t.assignee) || t.createdBy===v.id || rp.has(t.pipe));
}
const canEditTask = (v,t) => v.level==="ceo" || isAdmin(v) || t.assignee===v.id || t.createdBy===v.id
  || subtree(v.id).includes(t.assignee);
const canEditPipe = (v,p) => v.level==="ceo" || p.createdBy===v.id
  || (v.level==="vp" && visiblePipes(v).includes(p));
/* a manager can't be moved under their own report — no cycles */
function validMgrOptions(userId){
  const banned = userId ? new Set(subtree(userId)) : new Set();
  return liveUsers().filter(u=>!banned.has(u.id));
}

/* ================= weekly activity chart (2 series, grouped columns) ================= */
function weekChart(){
  const ids = new Set(visibleUserIds(state.me));
  const days=[]; for(let i=6;i>=0;i--) days.push(dOff(-i));
  const doneS = days.map(d=>TASKS.filter(t=>t.done&&t.doneOn===d&&ids.has(t.assignee)).length);
  const logS  = days.map(d=>LOGS.filter(l=>l.date===d&&ids.has(l.user)).length);
  const W=680,H=230,mL=34,mR=10,mT=14,mB=28, iw=W-mL-mR, ih=H-mT-mB;
  const maxV = Math.max(2, ...doneS, ...logS);
  const yMax = Math.ceil(maxV/2)*2;                       // clean even ceiling
  const y = v => mT + ih - (v/yMax)*ih;
  const slot = iw/7, bw = Math.min(22, (slot-18)/2);
  let g = "";
  const ticks = [0, yMax/2, yMax];
  ticks.forEach(v=>{ g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${mL-7}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-variant-numeric="tabular-nums">${v}</text>`; });
  days.forEach((d,i)=>{
    const cx = mL + slot*i + slot/2;
    const lbl = new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short"});
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="${d===TODAY?"var(--ink2)":"var(--muted)"}" ${d===TODAY?'font-weight="700"':""}>${lbl}</text>`;
    [[doneS[i],"var(--s1)"],[logS[i],"var(--s2)"]].forEach(([v,c],si)=>{
      const bx = cx - bw - 1 + si*(bw+2);
      const bh = Math.max(v>0?3:0,(v/yMax)*ih);
      g+=`<path d="M${bx} ${y(0)} v${-Math.max(0,bh-4)} q0 -4 4 -4 h${bw-8} q4 0 4 4 v${Math.max(0,bh-4)} z"
           fill="${c}" opacity="${v>0?1:0}" pointer-events="none" class="wbar"/>`;
    });
    g+=`<rect x="${cx-bw-2}" y="${mT}" width="${bw*2+6}" height="${ih}" fill="transparent" class="whit" data-i="${i}"/>`;
  });
  g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--baseline)" stroke-width="1"/>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" style="width:100%; display:block" role="img" aria-label="Team activity, last 7 days">${g}</svg>`,
    days, doneS, logS};
}
function wireWeekChart(host, data){
  host.querySelectorAll(".whit").forEach(r=>{
    r.addEventListener("mousemove",e=>{
      const i=+r.dataset.i;
      const dd=data.days[i], wd=new Date(dd+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long"});
      showTip(`<div class="tt-t">${dd===TODAY?"Today":dd===dOff(-1)?"Yesterday":wd} · ${fmtDate(dd)}</div>
        <div class="tt-row"><span class="sw" style="background:var(--s1)"></span>Tasks completed<b>${data.doneS[i]}</b></div>
        <div class="tt-row"><span class="sw" style="background:var(--s2)"></span>Log entries<b>${data.logS[i]}</b></div>`, e.clientX,e.clientY);
    });
    r.addEventListener("mouseleave",hideTip);
  });
}

/* ================= dashboard ================= */
function kpis(){
  const ids = new Set(visibleUserIds(state.me));
  const mine = TASKS.filter(t=>ids.has(t.assignee));
  const open = mine.filter(t=>!t.done);
  const wk = []; for(let i=6;i>=0;i--) wk.push(dOff(-i));
  const prevWk = []; for(let i=13;i>=7;i--) prevWk.push(dOff(-i));
  const doneWk = mine.filter(t=>t.done&&wk.includes(t.doneOn)).length;
  const donePrev = mine.filter(t=>t.done&&prevWk.includes(t.doneOn)).length;
  const logsToday = LOGS.filter(l=>l.date===TODAY&&ids.has(l.user)).length;
  const logsYest = LOGS.filter(l=>l.date===dOff(-1)&&ids.has(l.user)).length;
  return {
    open: open.length,
    dueToday: open.filter(t=>t.due===TODAY).length,
    overdue: open.filter(t=>t.due&&t.due<TODAY).length,
    doneWk, dDone: doneWk-donePrev,
    logsToday, dLogs: logsToday-logsYest,
  };
}

/* ================= pipelines (Kanban) ================= */
function renderPipelines(){
  const me=state.me, pipes=visiblePipes(me);
  if(!pipes.length){ $("#view").innerHTML=`<div class="card card-pad">No pipelines visible to you yet.</div>`; return; }
  if(!pipes.find(p=>p.id===state.pipe)) state.pipe=pipes[0].id;
  const pipe = pipes.find(p=>p.id===state.pipe);
  const people = liveUsers().filter(u=>visibleUserIds(me).includes(u.id));
  let tasks = visibleTasks(me).filter(t=>t.pipe===pipe.id);
  if(state.fAssignee!=="all") tasks=tasks.filter(t=>t.assignee===state.fAssignee);
  if(state.fPriority!=="all") tasks=tasks.filter(t=>t.pr===state.fPriority);
  if(state.fSearch) tasks=tasks.filter(t=>t.title.toLowerCase().includes(state.fSearch.toLowerCase()));
  if(!state.showDone) tasks=tasks.filter(t=>!t.done);

  $("#view").innerHTML = `
  <div class="pipe-tabs">
    ${pipes.map(p=>`<button class="pipe-tab ${p.id===state.pipe?"active":""}" data-pipe="${p.id}">
      <span class="pdot" style="background:var(--s${p.color})"></span>${esc(p.name)}
      <span style="color:var(--muted);font-weight:600">${visibleTasks(me).filter(t=>t.pipe===p.id&&!t.done).length}</span></button>`).join("")}
    ${canManage(me)?`<button class="pipe-tab" data-act="newPipe" style="border-style:dashed">＋ New pipeline</button>`:""}
  </div>
  <div class="filters">
    <input type="search" id="fSearch" placeholder="Search tasks…" value="${esc(state.fSearch)}">
    <select id="fAssignee"><option value="all">Everyone</option>
      ${people.map(u=>`<option value="${u.id}" ${state.fAssignee===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
    <select id="fPriority"><option value="all">Any priority</option>
      ${["urgent","high","medium","low"].map(p=>`<option value="${p}" ${state.fPriority===p?"selected":""}>${p[0].toUpperCase()+p.slice(1)}</option>`).join("")}</select>
    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)">
      <input type="checkbox" id="fDone" ${state.showDone?"checked":""}> Show done</label>
    <div style="margin-left:auto;display:flex;gap:8px">
      ${canEditPipe(me,pipe)?`<button class="btn sm" data-act="editPipe">✏️ Edit pipeline</button>`:""}
    </div>
  </div>
  <div class="board" id="board">
    ${pipe.stages.map((s,si)=>{
      const st = tasks.filter(t=>t.stage===s);
      return `<div class="col" data-stage="${esc(s)}">
        <div class="col-head">
          <span class="pdot" style="width:8px;height:8px;border-radius:50%;background:var(--ord${Math.min(si+1,6)})"></span>
          <span class="cnm">${esc(s)}</span><span class="cct">${st.length}</span>
          <button class="add" data-addtask="${esc(s)}" title="Add task here">＋</button>
        </div>
        <div class="col-body" data-drop="${esc(s)}">
          ${st.length?st.map(t=>taskCard(t,pipe)).join(""):`<div class="empty-col">Drop tasks here</div>`}
        </div>
      </div>`; }).join("")}
  </div>`;
  wireBoard(pipe); wireCommon();
}
function taskCard(t,pipe){
  const u=U(t.assignee);
  return `<div class="tcard ${t.done?"done-card":""}" draggable="true" data-task="${t.id}" style="--pc:var(--s${pipe.color})">
    <div class="tt">${esc(t.title)}</div>
    <div class="meta">${prChip(t.pr)} ${dueChip(t)} ${u?avatar(u,"sm"):""}</div>
  </div>`;
}
function wireBoard(pipe){
  const me=state.me;
  $("#fSearch").addEventListener("input",e=>{state.fSearch=e.target.value; renderPipelines();});
  $("#fAssignee").addEventListener("change",e=>{state.fAssignee=e.target.value; renderPipelines();});
  $("#fPriority").addEventListener("change",e=>{state.fPriority=e.target.value; renderPipelines();});
  $("#fDone").addEventListener("change",e=>{state.showDone=e.target.checked; renderPipelines();});
  // drag & drop
  let dragId=null;
  document.querySelectorAll(".tcard").forEach(c=>{
    c.addEventListener("dragstart",e=>{ dragId=c.dataset.task; c.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId); });
    c.addEventListener("dragend",()=>{ c.classList.remove("dragging"); dragId=null;
      document.querySelectorAll(".col").forEach(x=>x.classList.remove("drag-over")); });
    c.addEventListener("click",()=>openTaskModal(c.dataset.task));
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave",e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("drag-over"); });
    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("drag-over");
      const id=dragId||e.dataTransfer.getData("text/plain"); const t=TASKS.find(x=>x.id===id); if(!t) return;
      if(!canEditTask(me,t)){ toast("You can't move this task."); return; }
      const stage=col.dataset.stage; if(t.stage===stage) return;
      moveTask(t, stage);
    });
  });
  document.querySelectorAll("[data-addtask]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); openTaskModal(null, {pipe:pipe.id, stage:b.dataset.addtask}); }));
  const ep=$('[data-act="editPipe"]'); if(ep) ep.addEventListener("click",()=>openPipeModal(pipe.id));
}
function moveTask(t, stage){
  const pipe=PIPES.find(p=>p.id===t.pipe);
  const last = pipe.stages[pipe.stages.length-1];
  t.stage=stage;
  const wasDone=t.done;
  t.done = (stage===last);
  t.doneOn = t.done ? (t.doneOn||TODAY) : null;
  addEvent(t.done?"done":"move", t.done?`completed “${t.title}”`:`moved “${t.title}” to ${stage}`);
  toast(t.done?`✓ “${trunc(t.title)}” completed`:`Moved to ${stage}`);
  render();
}
const trunc = s => s.length>34?s.slice(0,34)+"…":s;

/* ================= daily log ================= */
function renderDaily(){
  const me=state.me, ids=visibleUserIds(me);
  const team = ids.length>1;
  const who = state.logWho && ids.includes(state.logWho) ? state.logWho : (team?"all":me.id);
  const scopeIds = who==="all" ? ids : [who];
  const entries = LOGS.filter(l=>scopeIds.includes(l.user)).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const days=[...new Set(entries.map(l=>l.date))];
  const canWrite = who===me.id || who==="all";

  $("#view").innerHTML = `
  ${team?`<div class="pipe-tabs">
    <button class="pipe-tab ${who==="all"?"active":""}" data-logwho="all">👥 Whole team</button>
    ${liveUsers().filter(u=>ids.includes(u.id)).map(u=>`<button class="pipe-tab ${who===u.id?"active":""}" data-logwho="${u.id}">
      ${esc(u.id===me.id?"Me":u.name)}<span style="color:var(--muted);font-weight:600">${LOGS.filter(l=>l.user===u.id&&l.date===TODAY).length}</span></button>`).join("")}
  </div>`:""}
  ${canWrite?`<div class="card card-pad" style="margin-bottom:18px">
    <div class="card-head"><div><h3>Log today's activity</h3><div class="sub">Quick note on what you worked on — it builds your day-to-day track record</div></div></div>
    <form class="qa-form" id="qaForm">
      <input type="date" id="qaDate" value="${TODAY}" max="${TODAY}">
      <select id="qaCat">${activeCats().map(c=>`<option value="${c.id}">${c.ic} ${esc(c.name)}</option>`).join("")}</select>
      <input class="qa-note" id="qaNote" placeholder="What did you do? e.g. Visited Ward 12 collection point, met the supervisor…" required>
      <button class="btn primary" type="submit">Add entry</button>
    </form>
  </div>`:""}
  ${days.length?days.map(d=>{
    const de=entries.filter(l=>l.date===d);
    return `<div class="log-day card card-pad">
      <div class="dhead"><span class="dt">${relDay(d)}</span><span class="dsub">${fmtDateLong(d)} · ${de.length} entr${de.length===1?"y":"ies"}</span></div>
      ${de.map(l=>{ const u=U(l.user), c=catOf(l.cat), own=l.user===me.id;
        return `<div class="log-entry">
          <div class="cat-ic">${c.ic}</div>
          <div style="min-width:0">
            <div class="lmeta">${team&&who==="all"?`<b style="color:var(--ink)">${esc(u.name)}</b> ·`:""} ${esc(c.name)}</div>
            <div class="note">${esc(l.note)}</div>
          </div>
          ${own?`<div class="acts"><button class="mini-btn" data-editlog="${l.id}">Edit</button><button class="mini-btn" data-dellog="${l.id}" style="color:var(--critical)">Delete</button></div>`:""}
        </div>`;}).join("")}
    </div>`;}).join("")
  :`<div class="card card-pad" style="text-align:center;color:var(--muted)">No log entries yet${who!=="all"?" for this person":""}. ${canWrite?"Add the first one above.":""}</div>`}`;

  document.querySelectorAll("[data-logwho]").forEach(b=>b.addEventListener("click",()=>{ state.logWho=b.dataset.logwho; renderDaily(); }));
  const f=$("#qaForm"); if(f) f.addEventListener("submit",e=>{
    e.preventDefault();
    const note=$("#qaNote").value.trim(); if(!note) return;
    LOGS.push({id:nid("l"), user:me.id, date:$("#qaDate").value||TODAY, cat:$("#qaCat").value, note});
    addEvent("log","logged an activity");
    toast("Activity logged ✓"); renderDaily();
  });
  document.querySelectorAll("[data-editlog]").forEach(b=>b.addEventListener("click",()=>openLogModal(b.dataset.editlog)));
  document.querySelectorAll("[data-dellog]").forEach(b=>b.addEventListener("click",()=>{
    const i=LOGS.findIndex(l=>l.id===b.dataset.dellog);
    if(i>-1){ LOGS.splice(i,1); toast("Entry deleted"); renderDaily(); }
  }));
}

/* ================= team (org chart) ================= */
function renderTeam(){
  const me=state.me;
  const rootId = me.level==="member" ? me.mgr : me.id;   // member sees their own team, read-only
  const readOnlyNote = me.level==="member" ? `<div class="sub">Your team — tap a person to view their public profile</div>` : `<div class="sub">Your reporting line — click anyone to see their work</div>`;
  const chainUp = [];
  let p = U(rootId)?.mgr; while(p){ chainUp.unshift(U(p)); p=U(p).mgr; }

  $("#view").innerHTML = `
  <div class="card card-pad">
    <div class="card-head"><div><h3>Hierarchy</h3>${readOnlyNote}</div>
      <div class="spacer"></div>
      ${chainUp.length?`<div style="font-size:12px;color:var(--muted)">Reports up to: ${chainUp.map(u=>esc(u.name)).join(" → ")}</div>`:""}

function orgNode(id){

function teamTable(){

}

function wireAdmin(){

  document.querySelectorAll('[data-act="newAcc"]').forEach(b=>b.addEventListener("click",()=>openAccountModal(null)));
  document.querySelectorAll('[data-act="newRole"]').forEach(b=>b.addEventListener("click",()=>openRoleModal(null)));
  document.querySelectorAll("[data-toggleacc]").forEach(b=>b.addEventListener("click",()=>{
    const u=U(b.dataset.toggleacc);
    if(isLive(u) && childrenOf(u.id).length){ toast("Move their team to another manager first."); return; }
    u.active = !isLive(u);
    toast(isLive(u)?`${u.name} reactivated`:`${u.name} deactivated`); renderAdmin(); }));
  document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>approveReq(b.dataset.app)));

    const v=$("#deptName").value.trim(); if(!v) return;

    DEPTS.push(v); toast("Department added ✓"); renderAdmin(); });
  document.querySelectorAll("[data-deldept]").forEach(b=>b.addEventListener("click",()=>{
    const i=DEPTS.indexOf(b.dataset.deldept);
    if(ROLES.some(r=>r.dept===b.dataset.deldept)){ toast("Job roles still use this department."); return; }
    if(i>-1){ DEPTS.splice(i,1); toast("Department removed"); renderAdmin(); } }));
  const cf=$("#catForm"); if(cf) cf.addEventListener("submit",e=>{ e.preventDefault();
    const v=$("#catName").value.trim(); if(!v) return;
    if(LOG_CATS.some(c=>c.name.toLowerCase()===v.toLowerCase())){ toast("That category already exists."); return; }
    LOG_CATS.push({id:nid("c"), name:v, ic:$("#catIc").value.trim()||"📌", active:true});

function openTaskModal(taskId, preset={}){

  const people = canManage(me) ? liveUsers().filter(u=>visibleUserIds(me).includes(u.id)) : [me];
  modal(`<div class="modal">
    <h3>${t?"Edit task":"New task"}</h3>
    <div class="msub">${t?"Update details, move stage, or reassign.":"Create a task card on a pipeline."}</div>
    <form id="taskForm" class="f-grid">
      <div class="field"><label>Title</label><input id="tTitle" required maxlength="120" value="${esc(t?.title||"")}" placeholder="e.g. Follow up with Kota South on revised pricing"></div>
      <div class="f-grid f-2">
        <div class="field"><label>Pipeline</label><select id="tPipe">
          ${pipes.map(p=>`<option value="${p.id}" ${p.id===pipeId?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Stage</label><select id="tStage">
          ${pipe.stages.map(s=>`<option ${((t?.stage||preset.stage)===s)?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
      </div>
      <div class="f-grid f-2">
        <div class="field"><label>Assignee</label><select id="tWho">
          ${people.map(u=>`<option value="${u.id}" ${(t?.assignee||preset.assignee||me.id)===u.id?"selected":""}>${esc(u.name)} — ${esc(titleOf(u))}</option>`).join("")}</select></div>
        <div class="field"><label>Priority</label><select id="tPr">
          ${["urgent","high","medium","low"].map(p=>`<option value="${p}" ${(t?.pr||"medium")===p?"selected":""}>${p[0].toUpperCase()+p.slice(1)}</option>`).join("")}</select></div>
      </div>
      <div class="f-grid f-2">
        <div class="field"><label>Due date</label><input type="date" id="tDue" value="${t?.due||""}"></div>
        <div class="field"><label>&nbsp;</label><div class="check-list"><label>
          <input type="checkbox" id="tDone" ${t?.done?"checked":""}> Mark as done</label></div></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="tDesc" placeholder="Context, next step, links…">${esc(t?.desc||"")}</textarea></div>
      <div class="m-actions">
        ${t?`<button type="button" class="btn danger sm" id="tDel">Delete</button>`:""}
        <div class="grow"></div>
        <button type="button" class="btn" id="tCancel">Cancel</button>
        <button class="btn primary" type="submit">${t?"Save changes":"Create task"}</button>
      </div>
    </form>
  </div>`);
  $("#tPipe").addEventListener("change",e=>{
    const np=PIPES.find(p=>p.id===e.target.value);
    $("#tStage").innerHTML = np.stages.map(s=>`<option>${esc(s)}</option>`).join("");
  });
  $("#tCancel").addEventListener("click",closeModal);
  const del=$("#tDel"); if(del) del.addEventListener("click",()=>{
    const i=TASKS.findIndex(x=>x.id===t.id); TASKS.splice(i,1);
    addEvent("move",`deleted “${t.title}”`); closeModal(); toast("Task deleted"); render();
  });
  $("#taskForm").addEventListener("submit",e=>{
    e.preventDefault();
    const vals={ title:$("#tTitle").value.trim(), pipe:$("#tPipe").value, stage:$("#tStage").value,
      assignee:$("#tWho").value, pr:$("#tPr").value, due:$("#tDue").value||null,
      desc:$("#tDesc").value.trim(), done:$("#tDone").checked };
    if(!vals.title) return;
    if(t){ const wasDone=t.done; Object.assign(t,vals);
      t.doneOn = t.done ? (t.doneOn||TODAY) : null;
      if(!wasDone&&t.done) addEvent("done",`completed “${t.title}”`);
      toast("Task updated ✓");
    } else {
      const nt={id:nid("t"), created:TODAY, createdBy:me.id, doneOn:vals.done?TODAY:null, ...vals};
      TASKS.push(nt); addEvent("move",`created “${nt.title}”${vals.assignee!==me.id?" for "+U(vals.assignee).name:""}`);
      toast("Task created ✓");
    }
    closeModal(); render();
  });
}

function openPipeModal(pipeId){
  const me=state.me;
  const p = pipeId ? PIPES.find(x=>x.id===pipeId) : null;
  const depts=[...new Set(USERS.map(u=>u.dept).filter(d=>d!=="Leadership"))];
  let stages = p ? [...p.stages] : ["To Do","In Progress","Done"];
  let color = p?.color || 1;
  function stageRows(){ return stages.map((s,i)=>`
    <div class="stage-row" data-i="${i}">
      <span style="font-size:11px;color:var(--muted);width:16px;text-align:right">${i+1}.</span>
      <input value="${esc(s)}" data-stagein="${i}" maxlength="26">
      <button type="button" class="mini-btn" data-up="${i}" ${i===0?"disabled style='opacity:.3'":""}>↑</button>
      <button type="button" class="mini-btn" data-dn="${i}" ${i===stages.length-1?"disabled style='opacity:.3'":""}>↓</button>
      <button type="button" class="mini-btn" data-rm="${i}" ${stages.length<=2?"disabled style='opacity:.3'":""} style="color:var(--critical)">✕</button>
    </div>`).join(""); }
  modal(`<div class="modal">
    <h3>${p?"Edit pipeline":"New pipeline"}</h3>
    <div class="msub">A pipeline is a flow of stages — sales, operations, hiring, anything. Tasks move left to right; the last stage means done.</div>
    <form id="pipeForm" class="f-grid">
      <div class="f-grid f-2">
        <div class="field"><label>Pipeline name</label><input id="pName" required maxlength="40" value="${esc(p?.name||"")}" placeholder="e.g. Recruitment"></div>
        <div class="field"><label>Department</label><select id="pDept">
          ${depts.map(d=>`<option ${p?.dept===d?"selected":""}>${esc(d)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Colour</label><div class="color-row" id="pColors">
        ${[1,2,3,4,5,7,8].map(c=>`<button type="button" class="color-dot ${c===color?"sel":""}" data-c="${c}" style="background:var(--s${c})"></button>`).join("")}</div></div>
      <div class="field"><label>Stages (in order — last stage counts as “done”)</label>
        <div id="stageList">${stageRows()}</div>
        <button type="button" class="btn sm" id="addStage" style="margin-top:4px">＋ Add stage</button></div>
      <div class="m-actions">
        ${p&&(me.level==="ceo"||p.createdBy===me.id)?`<button type="button" class="btn danger sm" id="pDel">Delete pipeline</button>`:""}
        <div class="grow"></div>
        <button type="button" class="btn" id="pCancel">Cancel</button>
        <button class="btn primary" type="submit">${p?"Save changes":"Create pipeline"}</button>
      </div>
    </form>
  </div>`);
  function syncStagesFromInputs(){ document.querySelectorAll("[data-stagein]").forEach(inp=>{ stages[+inp.dataset.stagein]=inp.value; }); }
  function repaint(){ $("#stageList").innerHTML=stageRows(); wireStageRows(); }
  function wireStageRows(){
    document.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{ syncStagesFromInputs(); const i=+b.dataset.up;
      [stages[i-1],stages[i]]=[stages[i],stages[i-1]]; repaint(); }));
    document.querySelectorAll("[data-dn]").forEach(b=>b.addEventListener("click",()=>{ syncStagesFromInputs(); const i=+b.dataset.dn;
      [stages[i+1],stages[i]]=[stages[i],stages[i+1]]; repaint(); }));
    document.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ syncStagesFromInputs(); stages.splice(+b.dataset.rm,1); repaint(); }));
  }
  wireStageRows();
  $("#addStage").addEventListener("click",()=>{ syncStagesFromInputs(); if(stages.length>=7){toast("Max 7 stages"); return;} stages.push("New stage"); repaint(); });
  $("#pColors").addEventListener("click",e=>{ const d=e.target.closest(".color-dot"); if(!d) return;
    color=+d.dataset.c; document.querySelectorAll(".color-dot").forEach(x=>x.classList.toggle("sel",+x.dataset.c===color)); });
  $("#pCancel").addEventListener("click",closeModal);
  const pd=$("#pDel"); if(pd) pd.addEventListener("click",()=>{
    if(TASKS.some(t=>t.pipe===p.id)){ if(!confirm(`Delete “${p.name}” and its ${TASKS.filter(t=>t.pipe===p.id).length} tasks?`)) return; }
    for(let i=TASKS.length-1;i>=0;i--) if(TASKS[i].pipe===p.id) TASKS.splice(i,1);
    PIPES.splice(PIPES.findIndex(x=>x.id===p.id),1);
    state.pipe=visiblePipes(me)[0]?.id; closeModal(); toast("Pipeline deleted"); render();
  });
  $("#pipeForm").addEventListener("submit",e=>{
    e.preventDefault(); syncStagesFromInputs();
    stages=stages.map(s=>s.trim()).filter(Boolean);
    if(stages.length<2){ toast("Need at least 2 stages"); return; }
    if(new Set(stages.map(s=>s.toLowerCase())).size!==stages.length){ toast("Stage names must be unique"); return; }
    const name=$("#pName").value.trim(); if(!name) return;
    if(p){
      // move tasks whose stage vanished into the first stage
      TASKS.forEach(t=>{ if(t.pipe===p.id && !stages.includes(t.stage)){ t.stage=stages[0]; t.done=false; t.doneOn=null; } });
      Object.assign(p,{name, dept:$("#pDept").value, color, stages});
      toast("Pipeline updated ✓");
    } else {
      const np={id:nid("p"), name, dept:$("#pDept").value, color, stages, createdBy:me.id};
      PIPES.push(np); state.pipe=np.id; state.view="pipelines";
      addEvent("move",`created pipeline “${name}”`);
      toast("Pipeline created ✓");
    }
    closeModal(); render();
  });
}

function openAccountModal(userId, preset={}){
  const me=state.me;
  if(!isAdmin(me)){ toast("Only an Admin can create or edit accounts."); return; }
  const u = userId ? U(userId) : null;
  const activeRoles = ROLES.filter(r=>r.active || r.id===u?.role);
  const roleId = u?.role || preset.role || "";
  const defRole = ROLES.find(r=>r.id===roleId) || {level:"member", dept:DEPTS[1]};
  modal(`<div class="modal wide">
    <h3>${u?"Edit account":"New account"}</h3>
    <div class="msub">${u?"Change their job role, level or reporting line.":"Creating the account gives this person their own login and workspace."}
      ${preset.fromReq?`<b style="color:var(--accent-strong)"> · approving ${esc(U(REQS.find(r=>r.id===preset.fromReq).by)?.name||"")}'s request</b>`:""}</div>
    <form id="accForm" class="f-grid">
      <div class="f-grid f-2">
        <div class="field"><label>Full name</label><input id="aName" required maxlength="40" value="${esc(u?.name||preset.name||"")}" placeholder="e.g. Suresh Pareek"></div>
        <div class="field"><label>Work email</label><input id="aEmail" type="email" value="${esc(u?.email||preset.email||"")}" placeholder="name@wevois.com"></div>
      </div>
      <div class="field"><label>Job role</label><select id="aRole" required>
        ${roleId?"":`<option value="" disabled selected>— pick a job role —</option>`}
        ${activeRoles.map(r=>`<option value="${r.id}" ${r.id===roleId?"selected":""}>${esc(r.name)} — ${esc(r.dept)}</option>`).join("")}</select>
        <div style="font-size:11.5px;color:var(--muted);margin-top:5px">Picking a role fills in the level and department below — change them if this person is an exception.</div></div>
      <div class="f-grid f-2">
        <div class="field"><label>Hierarchy level</label><select id="aLevel">
          ${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${(u?.level||defRole?.level)===k?"selected":""}>${v.label}</option>`).join("")}</select></div>
        <div class="field"><label>Department</label><select id="aDept">
          ${DEPTS.map(d=>`<option ${(u?.dept||defRole?.dept)===d?"selected":""}>${esc(d)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Reports to</label><select id="aMgr">
        <option value="">— nobody (top of the org) —</option>
        ${validMgrOptions(userId).map(x=>`<option value="${x.id}" ${(u?.mgr||preset.mgr)===x.id?"selected":""}>${esc(x.name)} — ${esc(titleOf(x))}</option>`).join("")}</select></div>
      <div class="field"><div class="check-list"><label>
        <input type="checkbox" id="aAdmin" ${u?.admin?"checked":""}> Make this person an Admin
        </label></div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">Admins can create job roles and accounts, and decide requests — the powers you have.</div></div>
      <div class="m-actions"><div class="grow"></div>
        <button type="button" class="btn" id="aCancel">Cancel</button>
        <button class="btn primary" type="submit">${u?"Save changes":"Create account"}</button></div>
    </form></div>`);
  $("#aRole").addEventListener("change",e=>{
    const r=ROLES.find(x=>x.id===e.target.value); if(!r) return;
    $("#aLevel").value=r.level; $("#aDept").value=r.dept;
  });
  $("#aCancel").addEventListener("click",closeModal);
  $("#accForm").addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("#aName").value.trim(); if(!name) return;
    if(!$("#aRole").value){ toast("Pick a job role for this person."); return; }
    const vals={name, email:$("#aEmail").value.trim(), role:$("#aRole").value,
      level:$("#aLevel").value, dept:$("#aDept").value, mgr:$("#aMgr").value||null, admin:$("#aAdmin").checked};
    if(u){
      if(u.id===me.id && !vals.admin){ toast("You can't remove your own Admin rights."); return; }
      Object.assign(u,vals); toast("Account updated ✓");
    } else {
      const nu={id:nid("u"), c:(USERS.length%8)+1, active:true, ...vals};
      USERS.push(nu);
      addEvent("move",`created an account for ${nu.name} (${titleOf(nu)})`);
      toast(`Account created for ${name} ✓`);
    }
    if(preset.fromReq) resolveReq(preset.fromReq,"approved","");
    closeModal(); render();
  });
}
function openRoleModal(roleId, preset={}){
  const me=state.me;
  if(!isAdmin(me)){ toast("Only an Admin can create job roles."); return; }
  const r = roleId ? ROLES.find(x=>x.id===roleId) : null;
  const pipes = new Set(r?.pipes || []);
  modal(`<div class="modal wide">
    <h3>${r?"Edit job role":"New job role"}</h3>
    <div class="msub">${r?"Everyone holding this role picks up these settings.":"A job role is the designation people are hired into — Tender Executive, Legal Executive, Accounts, HR, anything."}
      ${preset.fromReq?`<b style="color:var(--accent-strong)"> · approving ${esc(U(REQS.find(x=>x.id===preset.fromReq).by)?.name||"")}'s request</b>`:""}</div>
    <form id="roleForm" class="f-grid">
      <div class="field"><label>Job role name</label><input id="jName" required maxlength="46" value="${esc(r?.name||preset.name||"")}" placeholder="e.g. Chief Financial Officer"></div>
      <div class="f-grid f-2">
        <div class="field"><label>Department</label><select id="jDept">
          ${DEPTS.map(d=>`<option ${(r?.dept||preset.dept)===d?"selected":""}>${esc(d)}</option>`).join("")}</select></div>
        <div class="field"><label>Default hierarchy level</label><select id="jLevel">
          ${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${(r?.level||preset.level||"member")===k?"selected":""}>${v.label}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Company-wide pipeline access</label>
        <div class="check-list">
          ${PIPES.map(p=>`<label>
            <input type="checkbox" class="jPipe" value="${p.id}" ${pipes.has(p.id)?"checked":""}>
            <span style="width:9px;height:9px;border-radius:50%;background:var(--s${p.color});flex:none"></span>${esc(p.name)}</label>`).join("")}
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:6px">Tick a pipeline to let anyone in this role see it across every team — how Accounts or Legal work company-wide. Leave all unticked and they only see their own team's work.</div></div>
      ${r?`<div class="field"><div class="check-list"><label>
        <input type="checkbox" id="jActive" ${r.active?"checked":""}> Role is active</label></div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">Retiring a role keeps the ${USERS.filter(x=>x.role===r.id).length} people already on it — it just stops appearing when creating new accounts.</div></div>`:""}
      <div class="m-actions"><div class="grow"></div>
        <button type="button" class="btn" id="jCancel">Cancel</button>
        <button class="btn primary" type="submit">${r?"Save changes":"Create job role"}</button></div>
    </form></div>`);
  $("#jCancel").addEventListener("click",closeModal);
  $("#roleForm").addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("#jName").value.trim(); if(!name) return;
    if(ROLES.some(x=>x.name.toLowerCase()===name.toLowerCase() && x.id!==roleId)){ toast("That job role already exists."); return; }
    const sel=[...document.querySelectorAll(".jPipe:checked")].map(c=>c.value);
    const vals={name, dept:$("#jDept").value, level:$("#jLevel").value, pipes:sel};
    if(r){ Object.assign(r,vals,{active:$("#jActive")?$("#jActive").checked:true}); toast("Job role updated ✓"); }
    else { ROLES.push({id:nid("r"), active:true, ...vals});
      addEvent("move",`created the job role “${name}”`); toast("Job role created ✓"); }
    if(preset.fromReq) resolveReq(preset.fromReq,"approved","");
    closeModal(); render();
  });
}

function openLogModal(logId){
  const l=LOGS.find(x=>x.id===logId); if(!l) return;
  modal(`<div class="modal"><h3>Edit log entry</h3><div class="msub">${fmtDateLong(l.date)}</div>
    <form id="logForm" class="f-grid">
      <div class="f-grid f-2">
        <div class="field"><label>Date</label><input type="date" id="lDate" value="${l.date}" max="${TODAY}"></div>
        <div class="field"><label>Category</label><select id="lCat">
          ${LOG_CATS.filter(c=>c.active!==false||c.id===l.cat).map(c=>`<option value="${c.id}" ${l.cat===c.id?"selected":""}>${c.ic} ${esc(c.name)}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Note</label><textarea id="lNote" required>${esc(l.note)}</textarea></div>
      <div class="m-actions"><div class="grow"></div>
        <button type="button" class="btn" id="lCancel">Cancel</button>
        <button class="btn primary" type="submit">Save</button></div>
    </form></div>`);
  $("#lCancel").addEventListener("click",closeModal);
  $("#logForm").addEventListener("submit",e=>{ e.preventDefault();
    l.date=$("#lDate").value||l.date; l.cat=$("#lCat").value; l.note=$("#lNote").value.trim();
    closeModal(); toast("Entry updated ✓"); render(); });
}

/* ================= person drawer ================= */
function openPerson(id){
  const me=state.me, u=U(id);
  const open=TASKS.filter(t=>t.assignee===id&&!t.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const logs=LOGS.filter(l=>l.user===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const canSee = visibleUserIds(me).includes(id);
  const mgr = u.mgr?U(u.mgr):null;
  $("#drawer").innerHTML = `
    <div style="display:flex;align-items:center;gap:13px;margin-bottom:4px">
      ${avatar(u,"lg")}
      <div><div style="font-weight:700;font-size:17px">${esc(u.name)}</div>
        <div style="font-size:12.5px;color:var(--muted)">${esc(titleOf(u))}</div></div>
      <button class="icon-btn" style="margin-left:auto" id="drawerX">✕</button></div>
    <div style="display:flex;gap:7px;margin:10px 0 12px;flex-wrap:wrap">${lvlBadge(u)}<span class="chip">${esc(u.dept)}</span>
      ${u.admin?`<span class="chip" style="background:color-mix(in srgb,var(--s7) 16%, var(--surface));color:var(--s7)">🛡 Admin</span>`:""}
      ${isLive(u)?"":`<span class="chip overdue">Deactivated</span>`}
      ${mgr?`<span class="chip">Reports to ${esc(mgr.name)}</span>`:""}</div>
    ${u.email?`<div style="font-size:12.5px;color:var(--ink2);margin-bottom:14px">✉️ ${esc(u.email)}</div>`:""}
    ${isAdmin(me)?`<button class="btn" style="width:100%;justify-content:center;margin-bottom:14px" id="editAccBtn">⚙️ Edit account</button>`:""}
    ${canSee?`
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:18px">
      <div class="card tile" style="padding:11px 13px"><div class="lbl">Open</div><div class="val" style="font-size:21px">${open.length}</div></div>
      <div class="card tile" style="padding:11px 13px"><div class="lbl">Overdue</div><div class="val" style="font-size:21px;${open.filter(t=>t.due&&t.due<TODAY).length?'color:var(--critical)':''}">${open.filter(t=>t.due&&t.due<TODAY).length}</div></div>
      <div class="card tile" style="padding:11px 13px"><div class="lbl">Logs today</div><div class="val" style="font-size:21px">${LOGS.filter(l=>l.user===id&&l.date===TODAY).length}</div></div>
    </div>
    ${canManage(me)&&id!==me.id?`<button class="btn primary" style="width:100%;justify-content:center;margin-bottom:18px" id="assignBtn">＋ Assign a task to ${esc(u.name.split(" ")[0])}</button>`:""}
    <div class="sec-h" style="margin-top:0"><h2 style="font-size:14px">Open tasks</h2></div>
    ${open.length?open.slice(0,6).map(t=>{ const p=PIPES.find(x=>x.id===t.pipe); return `
      <div class="trow"><div><div class="t" data-opentask="${t.id}">${esc(t.title)}</div>
        <div class="sub">${esc(p?.name||"")} · ${esc(t.stage)}</div></div>
        <div class="right">${dueChip(t)}</div></div>`;}).join("")
      :`<div style="color:var(--muted);font-size:13px">No open tasks.</div>`}
    <div class="sec-h"><h2 style="font-size:14px">Recent daily log</h2></div>
    ${logs.length?logs.map(l=>{ const c=catOf(l.cat); return `
      <div class="log-entry"><div class="cat-ic">${c.ic}</div>
        <div><div class="lmeta">${relDay(l.date)} · ${esc(c.name)}</div>
        <div class="note">${esc(l.note)}</div></div></div>`;}).join("")
      :`<div style="color:var(--muted);font-size:13px">No log entries yet.</div>`}`
    :`<div style="color:var(--muted);font-size:13px">You can see this person's profile, but their work detail is visible to their reporting line.</div>`}`;
  $("#drawer").classList.add("open"); $("#drawerScrim").classList.add("open");
  $("#drawerX").addEventListener("click",closeDrawer);
  const ab=$("#assignBtn"); if(ab) ab.addEventListener("click",()=>{ closeDrawer(); openTaskModal(null,{assignee:id}); });
  const eb=$("#editAccBtn"); if(eb) eb.addEventListener("click",()=>{ closeDrawer(); openAccountModal(id); });
  $("#drawer").querySelectorAll("[data-opentask]").forEach(el=>el.addEventListener("click",()=>{ closeDrawer(); openTaskModal(el.dataset.opentask); }));
}
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#drawerScrim").classList.remove("open"); }

/* ================= common wiring & init ================= */
function wireCommon(){
  document.querySelectorAll("[data-person]").forEach(el=>el.addEventListener("click",()=>openPerson(el.dataset.person)));
  document.querySelectorAll("[data-gopipe]").forEach(el=>el.addEventListener("click",()=>{ state.pipe=el.dataset.gopipe; state.view="pipelines"; render(); }));
  document.querySelectorAll('[data-act="newPipe"]').forEach(el=>el.addEventListener("click",e=>{e.stopPropagation(); openPipeModal(null);}));
  document.querySelectorAll('#view [data-act="newAcc"]').forEach(el=>el.addEventListener("click",e=>{e.stopPropagation(); openAccountModal(null);}));
  document.querySelectorAll('[data-act="askAdmin"]').forEach(el=>el.addEventListener("click",e=>{e.stopPropagation(); openRequestModal("role");}));
  document.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",()=>{
    const t=TASKS.find(x=>x.id===el.dataset.toggle); if(!t) return;
    const pipe=PIPES.find(p=>p.id===t.pipe); moveTask(t, pipe.stages[pipe.stages.length-1]); }));
  document.querySelectorAll("#view [data-opentask]").forEach(el=>el.addEventListener("click",()=>openTaskModal(el.dataset.opentask)));
}
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]"); if(nav){ state.view=nav.dataset.nav; render(); return; }
  const lg=e.target.closest("[data-login]"); if(lg){ login(lg.dataset.login); return; }
  const pt=e.target.closest("[data-pipe]"); if(pt){ state.pipe=pt.dataset.pipe; renderPipelines(); return; }
});
$("#meCard").addEventListener("click",logout);
$("#drawerScrim").addEventListener("click",closeDrawer);
$("#themeBtn").addEventListener("click",()=>{ state.theme=state.theme==="dark"?"light":"dark"; applyTheme(); });
$("#quickAdd").addEventListener("click",()=>{
  if(state.view==="daily"){ const n=$("#qaNote"); if(n){ n.focus(); n.scrollIntoView({behavior:"smooth",block:"center"}); } else toast("Pick a person tab with write access"); }
  else openTaskModal(null,{});
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeDrawer(); hideTip(); } });

renderLogin();
applyTheme();
</script>
</body>
</html>
